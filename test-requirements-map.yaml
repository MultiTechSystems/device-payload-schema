# Test Requirements Mapping
# Maps test functions to specification requirements from la-payload-schema
#
# Requirement ids are the stable `PS-nnn` tags carried in the specification text and in
# the Tag column of spec/sections/10-conformance.md.
#
# This file used to key on the M/R/O ids of an earlier requirements appendix
# (spec/sections/A4-requirements.md, removed in d129427). Those ids are positional -
# `generate-conformance-tables.py` assigns them by source order - so every inserted
# requirement renumbered the ones after it and this map came to name requirements it did
# not mean: its entry for M003 described what is now M001, and CR-2026-010 and -011
# shifted clause 1 again. A PS tag is allocated once and never reused.
#
# The re-pointing recovered each stale id's original wording from A4-requirements.md at
# e9a67b1 and matched that against the current requirement set: 115 of 139 references
# resolved. The remaining 24 are left as UNRESOLVED comments with the reason - the
# requirement was withdrawn (compact mode, the shorthand bitfield spellings, QR
# provisioning), or it was never a requirement at all but a line the old extractor lifted
# out of an example YAML block.
#
# Patterns support wildcards:
#   TestClassName.* - all tests in class
#   TestClassName.test_specific - single test

mappings:
  # ============================================================
  # Section 01: Schema Format
  # ============================================================
  - test: test_schema_interpreter.TestSchemaInterpreterBasic.*
    requirements:
      - PS-001  # Schema SHALL be valid JSON/YAML
      # UNRESOLVED M004  # name field REQUIRED
      #   never a requirement, an example YAML line: 'name: string REQUIRED: Schema identifier'
      - PS-004  # Schema MUST contain fields or ports

  - test: test_schema_interpreter.TestSchemaInterpreterBasic.test_decode_simple
    requirements:
      - PS-001
      # UNRESOLVED M004
      #   never a requirement, an example YAML line: 'name: string REQUIRED: Schema identifier'

  - test: test_schema_interpreter.TestSchemaInterpreterBasic.test_decode_empty_payload
    requirements:
      - PS-054  # Decoders MUST reject payloads too short

  # ============================================================
  # Section 02: Field Types - Integers
  # ============================================================
  - test: test_schema_interpreter.TestIntegerTypes.*
    requirements:
      - PS-049  # Type aliases
      - PS-052  # All integer widths
      - PS-049  # Documented type aliases
      - PS-053  # Big/little endian

  - test: test_schema_interpreter.TestIntegerTypes.test_decode_u16_big_endian
    requirements:
      - PS-052
      - PS-050  # Big-endian default

  - test: test_schema_interpreter.TestIntegerTypes.test_decode_u16_little_endian
    requirements:
      - PS-053

  # ============================================================
  # Section 02: Field Types - Floats
  # ============================================================
  - test: test_schema_interpreter.TestFloatTypes.*
    requirements:
      - PS-055  # IEEE 754 formats
      - PS-056  # Special values (NaN, Infinity)

  # ============================================================
  # Section 02: Field Types - Bitfields
  # ============================================================
  - test: test_schema_interpreter.TestBitfieldTypes.*
    requirements:
      - PS-058  # Bits numbered 0 (LSB) to 7 (MSB)
      # UNRESOLVED M049  # All shorthand syntaxes
      #   withdrawn from the specification: '- Decoders MUST support all shorthand syntaxes listed above'
      - PS-060  # Bitfield extractions position

  - test: test_schema_interpreter.TestBitfieldTypes.test_decode_multiple_bitfields_no_advance
    requirements:
      - PS-060

  # ============================================================
  # Section 02: Field Types - Boolean
  # ============================================================
  - test: test_schema_interpreter.TestBooleanType.*
    requirements:
      - PS-065  # JSON boolean output
      - PS-066  # Bool doesn't advance position

  # ============================================================
  # Section 02: Field Types - Enum
  # ============================================================
  - test: test_schema_interpreter.TestEnumType.*
    requirements:
      - PS-067  # String name for known values
      - PS-068  # Unknown value handling
      - PS-069  # Encoder accepts string/integer

  # ============================================================
  # Section 02: Field Types - Byte Group
  # ============================================================
  - test: test_schema_interpreter.TestByteGroup.*
    requirements:
      - PS-070  # Byte groups consume full bytes
      - PS-017  # Fields in byte group MUST NOT specify consume

  # ============================================================
  # Section 02: Field Types - Strings
  # ============================================================
  - test: test_schema_interpreter.TestBytesAndStrings.*
    requirements:
      - PS-071  # ascii, hex, base64 support
      - PS-072  # length field requirement
      - PS-074  # hex lowercase output
      - PS-075  # RFC 4648 Base64

  # ============================================================
  # Section 02: Field Types - Computed
  # ============================================================
  - test: test_schema_interpreter.TestPolynomialAndCompute.*
    requirements:
      - PS-076  # type: number for computed
      - PS-077  # No value property
      - PS-122  # Referenced fields decoded first

  # ============================================================
  # Section 02: Field Types - Repeat
  # ============================================================
  - test: test_schema_interpreter.TestRepeatType.*
    requirements:
      - PS-083  # Exactly ONE of count/byte_length/until
      - PS-085  # byte_length references field
      - PS-086  # until MUST be "end"
      - PS-087  # Empty arrays produce []
      - PS-088  # byte_length evenly divisible

  # ============================================================
  # Section 02: Field Types - Bitfield String
  # ============================================================
  - test: test_schema_interpreter.TestVersionString.*
    requirements:
      - PS-090  # Read length bytes as unsigned
      - PS-091  # Parts processed in order
      - PS-092  # Default part format decimal
      - PS-094  # Prefix prepended

  # ============================================================
  # Section 03: Modifiers
  # ============================================================
  - test: test_schema_interpreter.TestModifiers.*
    requirements:
      - PS-098  # add, mult, div support
      - PS-099  # Floating-point arithmetic
      - PS-100  # Division by zero

  - test: test_schema_interpreter.TestModifiers.test_lookup_modifier
    requirements:
      - PS-103  # lookup field support
      - PS-104  # Zero-based array index
      # UNRESOLVED M091  # Out of range error
      #   withdrawn from the specification: '- Implementations MUST emit an error if the index is out'
      - PS-107  # Lookup after arithmetic

  # ============================================================
  # Section 03: Polynomial
  # ============================================================
  - test: test_schema_interpreter.TestPolynomialAndCompute.test_polynomial*
    requirements:
      - PS-109  # At least 2 coefficients
      - PS-110  # Numeric coefficients
      - PS-111  # ref references decoded field
      - PS-112  # type: number
      - PS-113  # Floating-point arithmetic

  # ============================================================
  # Section 03: Transforms
  # ============================================================
  - test: test_schema_interpreter.TestTransformOperations.*
    requirements:
      - PS-115  # Transform operations support
      - PS-116  # sqrt clamps negative to 0
      - PS-118  # Transforms applied in order

  # ============================================================
  # Section 03: Compute
  # ============================================================
  - test: test_schema_interpreter.TestPolynomialAndCompute.test_compute*
    requirements:
      - PS-119  # op field values
      - PS-120  # Operands a and b
      - PS-121  # Field reference syntax
      - PS-122  # Referenced fields decoded first
      - PS-123  # type: number

  # ============================================================
  # Section 03: Guard
  # ============================================================
  - test: test_schema_interpreter.TestPolynomialAndCompute.test_guard*
    requirements:
      - PS-124  # when array of conditions
      - PS-125  # field property
      - PS-126  # Comparison operator
      - PS-127  # Numeric literal
      - PS-128  # Simple comparisons only

  # ============================================================
  # Section 03: Valid Range
  # ============================================================
  - test: test_schema_interpreter.TestSemanticFields.test_valid_range*
    requirements:
      - PS-129  # Array of two numbers
      - PS-130  # min <= max
      - PS-131  # Out-of-range flagged in _quality
      - PS-132  # Values not modified

  # ============================================================
  # Section 04: Nested Objects
  # ============================================================
  - test: test_schema_interpreter.TestNestedObjects.*
    requirements:
      - PS-139  # Nested object support
      - PS-140  # Fields processed in order
      - PS-142  # At least one field

  # ============================================================
  # Section 04: Variables
  # ============================================================
  - test: test_schema_interpreter.TestVariablesComprehensive.*
    requirements:
      - PS-143  # var: storage
      - PS-144  # $ prefix reference
      - PS-145  # Field names not starting with $
      - PS-146  # Validator rejects $ field names

  # ============================================================
  # Section 04: Match
  # ============================================================
  - test: test_schema_interpreter.TestMatchConditional.*
    requirements:
      - PS-148  # match construct support
      - PS-149  # Exactly one matching case
      - PS-150  # Cases evaluated in order
      - PS-151  # Range start <= end
      - PS-152  # All three patterns supported

  # ============================================================
  # Section 04: TLV
  # ============================================================
  - test: test_schema_interpreter.TestTLV.*
    requirements:
      - PS-153  # tlv construct support
      - PS-154  # Parse until end
      - PS-155  # Unknown tag handling
      - PS-156  # Fields merged to parent
      - PS-157  # Repeated tags as arrays

  # ============================================================
  # Section 04: Flagged
  # ============================================================
  - test: test_schema_interpreter.TestFlaggedConstruct.*
    requirements:
      - PS-158  # flagged construct support
      - PS-159  # Flags field previously parsed
      - PS-160  # Groups evaluated in order
      - PS-161  # Bit set → decode fields
      - PS-162  # Bit clear → skip group
      - PS-163  # Fields merged to parent

  # ============================================================
  # Section 05: Compact Mode
  # ============================================================
  - test: test_schema_interpreter.TestCompactFormat.*
    requirements:
      # UNRESOLVED M149  # Compact encoding mode
      #   withdrawn from the specification: '- Implementations MUST support compact encoding mode when'
      # UNRESOLVED M150  # No type/channel markers
      #   withdrawn from the specification: '- Compact payloads MUST NOT include any type, channel, or'
      # UNRESOLVED M151  # Field order matches schema
      #   withdrawn from the specification: '- Field order MUST match the schema definition exactly'
      # UNRESOLVED M152  # Sequential reading
      #   withdrawn from the specification: '- Decoders MUST read fields sequentially according to the'

  # ============================================================
  # Section 06: TS013 Generation
  # ============================================================
  # Note: TS013 tests are in separate test file

  # ============================================================
  # Section 07: Compact Format Strings
  # ============================================================
  - test: test_schema_interpreter.TestCompactFormat.*
    requirements:
      # UNRESOLVED M166  # Functionally equivalent
      #   withdrawn from the specification: '- When supported, compact format MUST be functionally equ'
      # UNRESOLVED M167  # Simple sequential fields only
      #   withdrawn from the specification: '- Compact format SHALL only be used for simple sequential'
      # UNRESOLVED M168  # Complex features not supported
      #   withdrawn from the specification: '- Complex features (conditional parsing, nested objects,'
      # UNRESOLVED M169  # Big-endian default
      #   withdrawn from the specification: '- If byte order prefix is omitted, big-endian MUST be ass'

  # ============================================================
  # Section 08: Output Formats (_quality) (M170)
  # ============================================================
  - test: test_schema_interpreter.TestSemanticFields.*
    requirements:
      - PS-182  # _quality only when valid_range

  # ============================================================
  # Section 09: Validation
  # ============================================================
  - test: test_schema_interpreter.TestValidationLevels.*
    requirements:
      - PS-189  # Reject invalid schemas
      - PS-190  # Fixed-width no length
      - PS-196  # Schema not used if errors

  # ============================================================
  # Section 11: Testing & Safety
  # ============================================================
  - test: test_schema_interpreter.TestEdgeCasesAndSecurity.*
    requirements:
      - PS-218  # Handle invalid inputs safely
      - PS-219  # MUST NOT crash
      - PS-220  # MUST NOT infinite loop
      - PS-222  # Return error for invalid

  # ============================================================
  # Section 13: Downlink
  # ============================================================
  - test: test_schema_interpreter.TestDownlinkCommands.*
    requirements:
      - PS-166  # JSON to binary encoding
      - PS-167  # Reverse arithmetic transformations
      - PS-168  # Validate values fit

  # ============================================================
  # Section 18: Schema Composition
  # ============================================================
  - test: test_schema_interpreter.TestDefinitionsComprehensive.*
    requirements:
      - PS-226  # Detect circular references
      # UNRESOLVED M227  # Resolve ref references
      #   withdrawn from the specification: "Implementations supporting composition MUST resolve 'ref'"
      - PS-226  # Reject circular with error
      # UNRESOLVED M229  # Undefined definitions error
      #   withdrawn from the specification: 'References to undefined definitions MUST produce an error'

  # ============================================================
  # Section 01: Ports
  # ============================================================
  - test: test_schema_interpreter.TestPortBasedSchemas.*
    requirements:
      # UNRESOLVED M016  # fields array required
      #   never a requirement, an example YAML line: 'fields: array REQUIRED: Field definitions for this port'
      - PS-018  # Port numbers 1-223
      - PS-019  # Each port has fields
      - PS-022  # Extract FPort from input
      - PS-023  # Select matching port
      - PS-024  # Default entry fallback
      - PS-025  # No match → error

  # ============================================================
  # Recommended Requirements
  # ============================================================
  - test: test_schema_interpreter.TestSemanticOutput.*
    requirements:
      - PS-186  # SenML unit codes

  - test: test_schema_interpreter.TestValidationLevels.test_validation_warning*
    requirements:
      - PS-199  # IPSO for standard sensors
      - PS-200  # SenML for unit fields
      - PS-201  # Common sensor detection

  # ============================================================
  # Optional Requirements
  # ============================================================
  - test: test_schema_interpreter.TestDirectionProperty.*
    requirements:
      # UNRESOLVED O005  # direction property
      #   never a requirement, an example YAML line: 'direction: string OPTIONAL: uplink-downlink-both (default'
      - PS-170  # direction: downlink

  - test: test_schema_interpreter.TestCompactFormat.*
    requirements:
      # UNRESOLVED O021  # Compact string format
      #   withdrawn from the specification: 'For simple sequential field definitions, a compact string'
      # UNRESOLVED O022  # Parsers MAY support compact
      #   withdrawn from the specification: '- Parsers MAY support compact format strings as an altern'

  # ============================================================
  # Binary Schema
  # ============================================================
  - test: test_binary_schema.*
    requirements:
      # UNRESOLVED M222  # Network resolution order
      #   withdrawn from the specification: 'Networks SHALL support the following resolution order:'
      # UNRESOLVED M223  # Version 2 accepts version 1
      #   withdrawn from the specification: 'Version 2 decoders MUST accept version 1 data.'

  # ============================================================
  # QR Schema
  # ============================================================
  - test: test_qr_schema.*
    requirements:
      # UNRESOLVED R043  # QR provisioning
      #   withdrawn from the specification: 'When a device is provisioned via QR code containing an em'
      # UNRESOLVED O040  # Embed binary schema in QR
      #   withdrawn from the specification: 'Devices MAY embed their binary schema in the provisioning'

  # ============================================================
  # Encoder/Roundtrip
  # ============================================================
  - test: test_schema_interpreter.TestEncoder.*
    requirements:
      # UNRESOLVED M153  # Modifiers reversed in order
      #   withdrawn from the specification: 'Modifiers MUST be reversed in the opposite order from dec'
      # UNRESOLVED M154  # Round non-integer values
      #   withdrawn from the specification: 'When the reversed value is not an integer, encoders MUST'

  - test: test_schema_interpreter.TestEncodings.*
    requirements:
      - PS-053  # Endian support (encodings use this)
      # Note: sign_magnitude, bcd, gray not yet in spec requirements

# Summary mapping for quick reference
summary:
  requirement_ids: "stable PS-nnn tags; see spec/sections/10-conformance.md, Tag column"
  requirement_references: 115
  distinct_requirements: 107
  unresolved_references: 24
  coverage_areas:
    # Named by clause rather than by id range: the M/R/O ranges this block used to list
    # were positional and moved whenever a requirement was inserted.
    - Schema format, structure and ports (clause 1)
    - Field types: integers, floats, bitfields, boolean, enum, byte groups, strings (clause 2)
    - Modifiers, polynomial, transforms, compute, guard, valid range (clause 3)
    - Nested objects, variables, match, TLV, flagged (clause 4)
    - Downlink encoding (clause 5)
    - Validation and safety (clause 8)
    - TS013 codec generation (clause 9)

  notes:
    - "Encodings (sign_magnitude, bcd, gray) implemented but not yet in spec"
    - "downlink_commands structure implemented but spec uses match-based approach"
    - "See la-payload-schema/spec/sections/A4-requirements.md for full requirement list"
