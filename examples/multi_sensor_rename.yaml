# Example: two sensors of the same type in one schema
#
# An indoor and an outdoor temperature sensor, and an indoor and an outdoor humidity
# sensor, each pair reported under its own names. Field definitions follow
# schemas/library/sensors/environmental.yaml (temperature_c_div10, humidity_pct_half),
# schemas/library/sensors/power.yaml (battery_mv, battery_pct_from_mv) and
# schemas/library/common/headers.yaml (msg_type_header).
#
# The fields are written out because the language has no way to reuse one definition
# under a second name. `$ref` substitutes a definition's fields exactly as declared
# (PS-346); a reference entry carries only `$ref`, and `rename:`/`prefix:` beside it
# are not part of the specification. They are honoured only by the authoring tool
# tools/schema_preprocessor.py, which also cannot set the IPSO instances that tell the
# two 3303 and the two 3304 fields apart (IL-180). tests/test_examples_library_copies.py
# holds these fields equal to the library's, renamed, apart from those instances.

name: multi_temp_sensor
version: 1
endian: big
description: Device with indoor and outdoor temperature sensors
fields:
- name: msg_type
  type: u8
  description: Message type identifier
  lookup:
    0: heartbeat
    1: data
    2: alarm
    3: config
    255: diagnostic
- name: indoor_temp
  type: s16
  div: 10
  unit: °C
  senml: {unit: Cel}
  valid_range:
  - -40
  - 125
  resolution: 0.1
  unece: CEL
  ipso: {object: 3303, instance: 0}
- name: outdoor_temp
  type: s16
  div: 10
  unit: °C
  senml: {unit: Cel}
  valid_range:
  - -40
  - 125
  resolution: 0.1
  unece: CEL
  ipso: {object: 3303, instance: 1}
- name: indoor_humidity
  type: u8
  mult: 0.5
  unit: '%RH'
  valid_range:
  - 0
  - 100
  resolution: 0.5
  unece: P1
  ipso: {object: 3304, instance: 0}
- name: outdoor_humidity
  type: u8
  mult: 0.5
  unit: '%RH'
  valid_range:
  - 0
  - 100
  resolution: 0.5
  unece: P1
  ipso: {object: 3304, instance: 1}
- name: battery_mv
  type: u16
  unit: mV
  valid_range:
  - 1800
  - 4200
  resolution: 1
  description: Battery voltage in millivolts
  ipso: {object: 3316}
- name: battery_percent
  type: number
  ref: $battery_mv
  transform:
  - add: -1800
  - div: 12
  unit: '%'
  senml: {unit: /100}
  valid_range:
  - 0
  - 100
  description: Battery percentage computed from mV (1800-3000mV = 0-100%)
test_vectors:
- name: normal_reading
  description: Indoor warm, outdoor cold
  payload: 01 00E7 FF9C 32 46 0BB8
  expected:
    msg_type: data
    indoor_temp: 23.1
    outdoor_temp: -10.0
    indoor_humidity: 25.0
    outdoor_humidity: 35.0
    battery_mv: 3000
    battery_percent: 100.0
