# Digital I/O Sensor Library
# Binary inputs, counters, pulse meters

definitions:
  # === DIGITAL INPUTS ===
  
  digital_input:
    fields:
      - name: digital_input
        type: bool
        description: "Digital input state"
        semantic:
          ipso: 3200

  gpio_state:
    fields:
      - name: gpio
        type: u8
        description: "GPIO pin states as bitmask"

  door_open:
    fields:
      - name: door_open
        type: bool
        description: "Door/window open state"
        semantic:
          ipso: 3302

  water_leak:
    fields:
      - name: water_leak
        type: bool
        description: "Water leak detected"
        semantic:
          ipso: 3302

  tamper:
    fields:
      - name: tamper
        type: bool
        description: "Tamper switch activated"

  # === COUNTERS ===
  
  pulse_count:
    fields:
      - name: pulse_count
        type: u32
        description: "Cumulative pulse count"
        semantic:
          ipso: 3200

  pulse_count_16:
    fields:
      - name: pulse_count
        type: u16
        description: "Pulse count (16-bit)"

  event_count:
    fields:
      - name: event_count
        type: u16
        description: "Event counter"

  # === ALARMS ===
  
  alarm:
    fields:
      - name: alarm
        type: bool
        description: "Alarm state"
        semantic:
          ipso: 3200

  temperature_alarm:
    fields:
      - name: temperature_alarm
        type: bool
        description: "Temperature threshold alarm"

  humidity_alarm:
    fields:
      - name: humidity_alarm
        type: bool
        description: "Humidity threshold alarm"

  low_battery_alarm:
    fields:
      - name: low_battery_alarm
        type: bool
        description: "Low battery warning"
