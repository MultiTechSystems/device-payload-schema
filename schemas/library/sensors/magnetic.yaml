# Magnetic & Orientation Sensor Library
# Magnetometer, gyroscope, compass, hall effect

definitions:
  # === MAGNETOMETER ===
  
  mag_x:
    fields:
      - name: mag_x
        type: s16
        unit: "µT"
        valid_range: [-1000, 1000]
        resolution: 1
        description: "Magnetic field X axis"
        semantic:
          ipso: 3314

  mag_y:
    fields:
      - name: mag_y
        type: s16
        unit: "µT"
        valid_range: [-1000, 1000]
        resolution: 1
        description: "Magnetic field Y axis"

  mag_z:
    fields:
      - name: mag_z
        type: s16
        unit: "µT"
        valid_range: [-1000, 1000]
        resolution: 1
        description: "Magnetic field Z axis"

  mag_total:
    fields:
      - name: mag_total
        type: u16
        unit: "µT"
        valid_range: [0, 2000]
        resolution: 1
        description: "Total magnetic field strength"

  # === GYROSCOPE ===
  
  gyro_x:
    fields:
      - name: gyro_x
        type: s16
        div: 100
        unit: "°/s"
        valid_range: [-2000, 2000]
        resolution: 0.01
        description: "Angular velocity X axis"
        semantic:
          ipso: 3334

  gyro_y:
    fields:
      - name: gyro_y
        type: s16
        div: 100
        unit: "°/s"
        valid_range: [-2000, 2000]
        resolution: 0.01
        description: "Angular velocity Y axis"

  gyro_z:
    fields:
      - name: gyro_z
        type: s16
        div: 100
        unit: "°/s"
        valid_range: [-2000, 2000]
        resolution: 0.01
        description: "Angular velocity Z axis"

  # === HALL EFFECT ===
  
  hall_effect:
    fields:
      - name: hall_effect
        type: bool
        description: "Hall effect sensor state (magnet detected)"

  hall_count:
    fields:
      - name: hall_count
        type: u32
        description: "Hall effect trigger count"

  # === COMPASS ===
  
  compass_heading:
    fields:
      - name: compass_heading
        type: u16
        unit: "°"
        senml: {unit: deg}
        valid_range: [0, 360]
        resolution: 1
        description: "Compass heading (0=N)"

  compass_heading_div10:
    fields:
      - name: compass_heading
        type: u16
        div: 10
        unit: "°"
        senml: {unit: deg}
        valid_range: [0, 360]
        resolution: 0.1
        description: "Compass heading (0=N)"

  # === MAGNETIC SWITCH (Reed) ===
  
  reed_switch:
    fields:
      - name: reed_switch
        type: bool
        description: "Reed switch / magnetic contact state"

  magnet_present:
    fields:
      - name: magnet_present
        type: bool
        description: "Magnet presence detected"
