# A field's own `on_repeat` takes precedence over the loop's (PS-525, CR-2026-110):
# under a loop declaring `merge`, an object that declares `collect` is collected into
# an array as PS-157 has always done. Every field reporting the name declares it, as
# PS-526 requires.
#
# Does not round-trip: the array's elements are written one entry per element under the
# first case declaring the name (PS-502, PS-527 as CR-2026-125 amends it), so `dr`,
# which that case's object does not declare, is not written.
name: probe_tlv_repeat_object_collect
endian: big
fields:
- tlv:
    tag_size: 2
    on_repeat: merge
    cases:
      0x0310:
      - name: loramac
        type: object
        on_repeat: collect
        fields:
        - name: adr
          type: u8
      0x0311:
      - name: loramac
        type: object
        on_repeat: collect
        fields:
        - name: dr
          type: u8
test_vectors:
- name: object_declares_collect
  source: spec-example
  payload: "0310 01 0311 05"
  expected:
    loramac:
    - adr: 1
    - dr: 5
