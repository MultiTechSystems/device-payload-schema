# `max` beside a declared `count`, met exactly.
#
# A `count` above `max` used to be clamped to it, yielding `max` records and no error,
# with every field after the repeat read from inside the records the clamp discarded.
# CR-2026-058 (PS-396) makes it an error, held by the CR-058 tests in each language since
# no vector kind expects a failure. Kept apart from repeat-max.yaml because the check has
# to hold for both spellings, and a single fixture would let one pass on the other's
# behaviour.
name: probe_repeat_max_count
endian: big
fields:
  - name: n
    type: u8
    var: n
  - name: capped_count
    type: repeat
    count: $n
    max: 2
    fields:
      - name: v
        type: u8
  - name: after
    type: u8
test_vectors:
  - name: a_count_at_the_ceiling_decodes
    description: "The payload says two records and `max: 2` allows two; the field after reads its own byte"
    payload: "020A1405"
    source: generated
    expected:
      n: 2
      capped_count:
        - v: 10
        - v: 20
      after: 5
    expected_warnings: []
