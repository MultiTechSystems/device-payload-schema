# bf16 words with no value JSON can carry (PS-558, PS-282): exponent 255 with fraction 0 is
# an infinity and with a nonzero fraction is NaN, and the field is absent, asserted by null,
# as for f32. A vector with an absent field cannot round-trip, so these are kept apart from
# bf16.yaml, whose vectors all do.
name: probe_bf16_specials
endian: big
fields:
- name: x
  type: bf16
test_vectors:
- name: positive_infinity
  source: spec-example
  payload: "7F80"
  expected: {x: null}
- name: negative_infinity
  source: spec-example
  payload: "FF80"
  expected: {x: null}
- name: nan_with_a_fraction
  source: spec-example
  payload: "7FC1"
  expected: {x: null}
