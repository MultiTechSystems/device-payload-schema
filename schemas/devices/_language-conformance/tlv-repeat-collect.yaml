# A name reported by two entries is collected into an array, in payload order (PS-157,
# CR-2026-110). With no `on_repeat` anywhere this is every field's behaviour, and it
# holds whether the two entries share a tag or not: here two different tags report
# `event`. The payload is the third row of CR-2026-110's table.
#
# Does not round-trip: either tag could have written either value, and the encoders
# write every element under the first case declaring the name (PS-527, CR-2026-125):
# `3a 01 3a 02`. tlv-repeat-collect-first-case.yaml is the payload that does.
name: probe_tlv_repeat_collect
endian: big
fields:
- tlv:
    tag_size: 1
    cases:
      0x3a:
      - name: event
        type: u8
      0x40:
      - name: event
        type: u8
test_vectors:
- name: two_tags_one_name_collect
  source: spec-example
  payload: "3a 01 40 02"
  expected:
    event: [1, 2]
