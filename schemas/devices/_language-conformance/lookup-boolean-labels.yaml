# PS-106 (CR-2026-104): a lookup label may be a boolean, in the mapping form and in the
# sequence form, and the field is then reported as a JSON boolean (PS-279) - not as the
# string "true", and not as 1. PS-513: a boolean label matches only a boolean, so an
# encoder reversing `false` through [true, false] writes index 1, not 0.
#
# One byte. Bits 4-7 are looked up through a mapping whose keys are explicit, so both
# labels reverse to a key; bit 0 is negated by a two-entry sequence. Bits 1-3 are zero
# in every payload, so each vector re-encodes to its own bytes.
name: probe_lookup_boolean_labels
endian: big
fields:
- name: alarm
  type: u8[4:7]
  lookup: {0: false, 1: true}
- name: inverted
  type: u8[0:0]
  consume: 1
  lookup: [true, false]
test_vectors:
- name: both_false_labels
  source: spec-example
  payload: "01"
  expected:
    alarm: false
    inverted: false
- name: both_true_labels
  source: spec-example
  payload: "10"
  expected:
    alarm: true
    inverted: true
- name: mapping_true_sequence_false
  source: spec-example
  payload: "11"
  expected:
    alarm: true
    inverted: false
- name: mapping_false_sequence_true
  source: spec-example
  payload: "00"
  expected:
    alarm: false
    inverted: true
