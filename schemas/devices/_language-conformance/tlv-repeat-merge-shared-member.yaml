# A merged object's member that several cases declare is written once, under the first
# case declaring it (PS-527 as CR-2026-125 amends it). Here 0x0310 declares `adr` and
# `dr`, and 0x0311 `dr` alone: the payload's one entry round-trips as one entry, where
# writing `dr` under every declaring case would add `0311 05`, and a decoder would then
# report `dr` twice (PS-525).
name: probe_tlv_repeat_merge_shared_member
endian: big
fields:
- tlv:
    tag_size: 2
    on_repeat: merge
    cases:
      0x0310:
      - name: loramac
        type: object
        fields:
        - name: adr
          type: u8
        - name: dr
          type: u8
      0x0311:
      - name: loramac
        type: object
        fields:
        - name: dr
          type: u8
test_vectors:
- name: shared_member_written_once
  source: spec-example
  payload: "0310 01 05"
  expected:
    loramac:
      adr: 1
      dr: 5
