# `max` on a repeat with `until: end`: the ceiling, met exactly.
#
# CR-2026-021 made `max` a ceiling in all five implementations, which stopped reading
# at `max` records and left the rest of the payload unread without a word. CR-2026-058
# (PS-396) made exceeding it an error naming the repeat, the limit and the bytes left
# unparsed: the decoder no longer knows where the repeat ends, so nothing after it can be
# trusted. That outcome is a failed decode, which no vector kind expresses, so it is held
# by tests/test_cr_2026_058_described_constructs.py and each language's CR-058 tests.
#
# What is pinned here is the case that must still succeed: exactly `max` records.
name: probe_repeat_max
endian: big
fields:
  - name: capped_to_end
    type: repeat
    until: end
    max: 2
    fields:
      - name: v
        type: u8
test_vectors:
  - name: a_payload_at_the_ceiling_decodes
    description: "Two records, which is exactly what the ceiling allows"
    payload: "0A14"
    source: generated
    expected:
      capped_to_end:
        - v: 10
        - v: 20
    expected_warnings: []
