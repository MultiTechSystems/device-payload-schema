# How many bytes a group of bit ranges covers (PS-070, CR-2026-131). With no `size`,
# the group covers its widest member's base type, whichever bytes that member's bits
# fall in: a `u16[...]` member makes it two bytes, a `u32[...]` member four. A `size`
# may widen the group past that, never narrow it.
#
# Every implementation used to read a group with no `size` as one byte, so `upper`
# below read 0, `nibble` read the high byte's low bits, and every later field came
# from the wrong offset. The single-byte field after each group pins the position
# the group leaves behind.
#
# Round-trips: every bit the members do not cover is zero in each payload.
name: probe_byte_group_width
endian: big
fields:
# Two bytes, big-endian, written in the array form with no size beside it.
- byte_group:
  - name: upper
    type: "u16[8:15]"
  - name: nibble
    type: "u16[0:3]"
- name: after_two
  type: u8
# Four bytes, little-endian, written in the mapping form with no size.
- byte_group:
    endian: little
    fields:
    - name: low
      type: "u32[0:7]"
    - name: top
      type: "u32[24:31]"
- name: after_four
  type: u8
# A size of 3 widens two bytes of members to three; the third byte is uncovered.
- byte_group:
    size: 3
    endian: little
    fields:
    - name: lo
      type: "u16[0:7]"
    - name: hi
      type: "u16[8:15]"
- name: after_three
  type: u8
test_vectors:
- name: distinct
  source: spec-example
  payload: "AB 05 11 78 00 00 9A 22 34 12 00 33"
  expected:
    upper: 171
    nibble: 5
    after_two: 17
    low: 120
    top: 154
    after_four: 34
    lo: 52
    hi: 18
    after_three: 51
- name: all_set
  source: spec-example
  payload: "FF 0F 01 FF 00 00 FF 02 FF FF 00 03"
  expected:
    upper: 255
    nibble: 15
    after_two: 1
    low: 255
    top: 255
    after_four: 2
    lo: 255
    hi: 255
    after_three: 3
- name: zero
  source: spec-example
  payload: "00 00 00 00 00 00 00 00 00 00 00 00"
  expected:
    upper: 0
    nibble: 0
    after_two: 0
    low: 0
    top: 0
    after_four: 0
    lo: 0
    hi: 0
    after_three: 0
