# Milesight IoT CT303 / CT305 / CT310
name: milesight_ct303
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            sensor: none
            lookup: {1: "reset", default: "reset"}
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: {1: "on", default: "on"}
            # raw: readDeviceStatus(1)
        # TEMPERATURE
        "[9, 103]":
          # One 16-bit little-endian word. 0xFFFD and 0xFFFF are status codes: the
          # status peeks at the word through a bit range without consuming it, and a
          # mapping miss omits it. Only 0xFFFF is mapped: its bytes read the same in
          # either order, while the interpreter reads a bit range's base big-endian
          # and the TS013 generator in the schema's order, so 0xFFFD cannot be
          # mapped portably.
          # formula: raw == 0xFFFD -> temperature_sensor_status "over range
          #   alarm"; raw == 0xFFFF -> temperature_sensor_status "read
          #   failed"; otherwise temperature. The vendor reports temperature
          #   only for a non-status word; this schema still reports it beside
          #   the status, because a `match` inside a tlv case is not decoded
          #   by the Python interpreter.
          - name: temperature_sensor_status
            type: u16[0:15]
            consume: 0
            sensor: none
            lookup: {65535: "read failed"}
            # raw: readSensorStatus(1) / readSensorStatus(2)
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # TEMPERATURE ALARM
        "[137, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            sensor: none
            lookup: ["temperature threshold alarm release", "temperature threshold alarm"]
            # raw: readTemperatureAlarm(bytes[i + 2])

        # CURRENT, PER CHANNEL
        #
        # The vendor builds these keys from the channel id's position in a list:
        # current_chns = [0x04, 0x06, 0x08] and the key is "current_chn" + (index+1).
        # The index is fixed per channel, so each case names its fields outright -
        # `name_from` is for a key derived from a decoded *value*, which this is not.
        "[3, 151]":
          - name: current_chn1_total
            type: u32
            div: 100
            unit: "Ah"
        "[4, 153]":
          - name: current_chn1
            type: u16
            div: 10
            unit: "A"
            ipso: {object: 3317, instance: 0, resource: 5700}
            senml: {name: "current_chn1", unit: "A"}
            semantic: "current"
        "[132, 153]":
          - name: current_chn1_max
            type: u16
            div: 10
            unit: "A"
          - name: current_chn1_min
            type: u16
            div: 10
            unit: "A"
          - name: current_chn1
            type: u16
            div: 10
            unit: "A"
            ipso: {object: 3317, instance: 0, resource: 5700}
            senml: {name: "current_chn1", unit: "A"}
            semantic: "current"
          - name: current_chn1_alarm
            type: object
            fields:
              - name: current_threshold_alarm
                type: u8[0:0]
                lookup: ["no", "yes"]
              - name: current_threshold_alarm_release
                type: u8[1:1]
                lookup: ["no", "yes"]
              - name: current_over_range_alarm
                type: u8[2:2]
                lookup: ["no", "yes"]
              - name: current_over_range_alarm_release
                type: u8[3:3]
                lookup: ["no", "yes"]
                consume: 1
        "[5, 151]":
          - name: current_chn2_total
            type: u32
            div: 100
            unit: "Ah"
        "[6, 153]":
          - name: current_chn2
            type: u16
            div: 10
            unit: "A"
            ipso: {object: 3317, instance: 1, resource: 5700}
            senml: {name: "current_chn2", unit: "A"}
            semantic: "current"
        "[134, 153]":
          - name: current_chn2_max
            type: u16
            div: 10
            unit: "A"
          - name: current_chn2_min
            type: u16
            div: 10
            unit: "A"
          - name: current_chn2
            type: u16
            div: 10
            unit: "A"
            ipso: {object: 3317, instance: 1, resource: 5700}
            senml: {name: "current_chn2", unit: "A"}
            semantic: "current"
          - name: current_chn2_alarm
            type: object
            fields:
              - name: current_threshold_alarm
                type: u8[0:0]
                lookup: ["no", "yes"]
              - name: current_threshold_alarm_release
                type: u8[1:1]
                lookup: ["no", "yes"]
              - name: current_over_range_alarm
                type: u8[2:2]
                lookup: ["no", "yes"]
              - name: current_over_range_alarm_release
                type: u8[3:3]
                lookup: ["no", "yes"]
                consume: 1
        "[7, 151]":
          - name: current_chn3_total
            type: u32
            div: 100
            unit: "Ah"
        "[8, 153]":
          - name: current_chn3
            type: u16
            div: 10
            unit: "A"
            ipso: {object: 3317, instance: 2, resource: 5700}
            senml: {name: "current_chn3", unit: "A"}
            semantic: "current"
        "[136, 153]":
          - name: current_chn3_max
            type: u16
            div: 10
            unit: "A"
          - name: current_chn3_min
            type: u16
            div: 10
            unit: "A"
          - name: current_chn3
            type: u16
            div: 10
            unit: "A"
            ipso: {object: 3317, instance: 2, resource: 5700}
            senml: {name: "current_chn3", unit: "A"}
            semantic: "current"
          - name: current_chn3_alarm
            type: object
            fields:
              - name: current_threshold_alarm
                type: u8[0:0]
                lookup: ["no", "yes"]
              - name: current_threshold_alarm_release
                type: u8[1:1]
                lookup: ["no", "yes"]
              - name: current_over_range_alarm
                type: u8[2:2]
                lookup: ["no", "yes"]
              - name: current_over_range_alarm_release
                type: u8[3:3]
                lookup: ["no", "yes"]
                consume: 1

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
  - name: ch137_type103_zero_values
    description: "Channel 137 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "8967000000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
      temperature_alarm: "temperature threshold alarm release"
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
  - name: ch255_type255_max_values
    description: "Channel 255 type 255, max values bytes, decoded by the vendor's own decoder"
    payload: "FFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v255.255"
  - name: ch255_type22_max_values
    description: "Channel 255 type 22, max values bytes, decoded by the vendor's own decoder"
    payload: "FF16FFFFFFFFFFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "ffffffffffffffff"
  - name: current_chn1_alarm_channel
    description: "Channel 0x84 type 0x99: per-channel current max/min/value plus the alarm bits"
    payload: "8499b80bd007c40905"
    fPort: 85
    source: vendor-codec
    expected:
      current_chn1_max: 300
      current_chn1_min: 200
      current_chn1: 250
      current_chn1_alarm:
        current_threshold_alarm: "yes"
        current_threshold_alarm_release: "no"
        current_over_range_alarm: "yes"
        current_over_range_alarm_release: "no"
  - name: power_on_reset_event
    description: "Reset-event frame: the vendor reports reset_event 'reset' whatever the byte holds"
    payload: "FFFEFF"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: temperature_s16_word
    description: "Temperature channel is one signed 16-bit word scaled /10"
    payload: "0967F000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 24
  - name: temperature_s16_negative
    description: "Temperature channel, negative reading"
    payload: "0967F0FF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -1.6
  - name: reset_event_byte_one
    description: "Reset-event frame with the byte 0x01, the index the vendor's own map labels 'reset'"
    payload: "FFFE01"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: device_status_byte_one
    description: "Device-status frame with the byte 0x01, the index the vendor's own map labels 'on'"
    payload: "FF0B01"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: lorawan_class_b
    description: "LoRaWAN class byte 0x01"
    payload: "FF0F01"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class B"
  - name: lorawan_class_c
    description: "LoRaWAN class byte 0x02"
    payload: "FF0F02"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class C"
  - name: lorawan_class_ctob
    description: "LoRaWAN class byte 0x03"
    payload: "FF0F03"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class CtoB"
  - name: temperature_read_failed
    description: "Temperature word 0xFFFF is the vendor's read-failed status"
    payload: "0967FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature_sensor_status: "read failed"
  - name: current_alarm_release_bits
    description: "Current alarm byte 0x0A: both release bits set alone, both alarm bits clear"
    payload: "84991000200030000A"
    fPort: 85
    source: vendor-codec
    expected:
      current_chn1_max: 1.6
      current_chn1_min: 3.2
      current_chn1: 4.8
      current_chn1_alarm:
        current_threshold_alarm: "no"
        current_threshold_alarm_release: "yes"
        current_over_range_alarm: "no"
        current_over_range_alarm_release: "yes"
  - name: temperature_alarm_negative
    description: "Temperature alarm frame: word 0xFEF6 is -26.6 C, alarm byte 1"
    payload: "8967F6FE01"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -26.6
      temperature_alarm: "temperature threshold alarm"
