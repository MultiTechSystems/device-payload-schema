# Milesight IoT AM307 / AM319
name: milesight_am307
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # HUMIDITY
        "[4, 104]":
          - name: humidity
            unit: "%"
            sensor: humidity
            ipso: {object: 3304, instance: 0, resource: 5700}
            senml: {name: "humidity", unit: "%RH"}
            semantic: "humidity"
            type: u8
            div: 2
        # PIR
        "[5, 0]":
          - name: pir
            type: u8
            lookup: ["idle", "trigger"]
        # LIGHT
        "[6, 203]":
          - name: light_level
            type: u8
        # CO2
        "[7, 125]":
          - name: co2
            unit: "ppm"
            sensor: co2
            ipso: {object: 3325, instance: 0, resource: 5700}
            senml: {name: "co2", unit: "ppm"}
            semantic: "co2"
            type: u16
        # TVOC
        "[8, 125]":
          - name: tvoc
            unit: "ppb"
            type: u16
        # PRESSURE
        "[9, 115]":
          - name: pressure
            unit: "hPa"
            type: u16
            div: 10
        # HCHO
        "[10, 125]":
          - name: hcho
            unit: "mg/m³"
            type: u16
            div: 100
        # PM2.5
        "[11, 125]":
          - name: pm2_5
            unit: "µg/m³"
            type: u16
        # PM10
        "[12, 125]":
          - name: pm10
            unit: "µg/m³"
            type: u16
        # O3
        "[13, 125]":
          - name: o3
            unit: "ppm"
            type: u16
            div: 100
        # BEEP
        "[14, 1]":
          - name: beep
            type: u8
            lookup: ["no", "yes"]

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01755C03673401046865056A4900"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 92
      temperature: 30.8
      humidity: 50.5
    expected_warnings:
      - ["0x05, 0x6A", "4 of 14 byte(s)"]
  - name: vendor_reference_2
    description: "Example declared by the vendor in the TTN device repository"
    payload: "077DE704087D070009733F27"
    fPort: 85
    source: vendor-doc
    expected:
      co2: 1255
      tvoc: 7
      pressure: 1004.7
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type104_midscale
    description: "Channel 4 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "046811"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch6_type203_midscale
    description: "Channel 6 type 203, midscale bytes, decoded by the vendor's own decoder"
    payload: "06CB11"
    fPort: 85
    source: vendor-codec
    expected:
      light_level: 17
  - name: ch7_type125_midscale
    description: "Channel 7 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "077D1111"
    fPort: 85
    source: vendor-codec
    expected:
      co2: 4369
  - name: ch8_type125_midscale
    description: "Channel 8 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "087D1111"
    fPort: 85
    source: vendor-codec
    expected:
      tvoc: 4369
  - name: ch9_type115_midscale
    description: "Channel 9 type 115, midscale bytes, decoded by the vendor's own decoder"
    payload: "09731111"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 436.9
  - name: ch10_type125_midscale
    description: "Channel 10 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0A7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      hcho: 43.69
  - name: ch11_type125_midscale
    description: "Channel 11 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0B7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      pm2_5: 4369
  - name: ch12_type125_midscale
    description: "Channel 12 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0C7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      pm10: 4369
  - name: ch13_type125_midscale
    description: "Channel 13 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0D7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      o3: 43.69
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
