# Milesight IoT WTS305 / WTS506
name: milesight_wts505
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # HUMIDITY
        "[4, 104]":
          - name: humidity
            unit: "%"
            sensor: humidity
            ipso: {object: 3304, instance: 0, resource: 5700}
            senml: {name: "humidity", unit: "%RH"}
            semantic: "humidity"
            type: u8
            div: 2
        # Wind Direction, unit degree
        "[5, 132]":
          - name: wind_direction
            unit: "°"
            type: s16
            div: 10
        # Barometric Pressure, unit hPa
        "[6, 115]":
          - name: pressure
            unit: "hPa"
            type: u16
            div: 10
        # Wind Speed, unit m/s
        "[7, 146]":
          - name: wind_speed
            unit: "m/s"
            type: u16
            div: 10
        # rainfall_total, unit mm, Frame counter to define whether device enters the new rainfall accumulation phase, it will plus 1 every upload, range: 0~255
        "[8, 119]":
          - name: rainfall_total
            type: u16
            div: 100
          - name: rainfall_counter
            type: u8

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01756403671001046871058400010673AA2707929201"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 100
      humidity: 56.5
      pressure: 1015.4
      temperature: 27.2
      wind_direction: 25.6
      wind_speed: 40.2
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type104_midscale
    description: "Channel 4 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "046811"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch5_type132_midscale
    description: "Channel 5 type 132, midscale bytes, decoded by the vendor's own decoder"
    payload: "05841111"
    fPort: 85
    source: vendor-codec
    expected:
      wind_direction: 436.9
  - name: ch6_type115_midscale
    description: "Channel 6 type 115, midscale bytes, decoded by the vendor's own decoder"
    payload: "06731111"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 436.9
  - name: ch7_type146_midscale
    description: "Channel 7 type 146, midscale bytes, decoded by the vendor's own decoder"
    payload: "07921111"
    fPort: 85
    source: vendor-codec
    expected:
      wind_speed: 436.9
  - name: ch8_type119_midscale
    description: "Channel 8 type 119, midscale bytes, decoded by the vendor's own decoder"
    payload: "0877111111"
    fPort: 85
    source: vendor-codec
    expected:
      rainfall_total: 43.69
      rainfall_counter: 17
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch4_type104_zero_values
    description: "Channel 4 type 104, zero values bytes, decoded by the vendor's own decoder"
    payload: "046800"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 0
  - name: ch5_type132_zero_values
    description: "Channel 5 type 132, zero values bytes, decoded by the vendor's own decoder"
    payload: "05840000"
    fPort: 85
    source: vendor-codec
    expected:
      wind_direction: 0
  - name: ch6_type115_zero_values
    description: "Channel 6 type 115, zero values bytes, decoded by the vendor's own decoder"
    payload: "06730000"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 0
  - name: ch7_type146_zero_values
    description: "Channel 7 type 146, zero values bytes, decoded by the vendor's own decoder"
    payload: "07920000"
    fPort: 85
    source: vendor-codec
    expected:
      wind_speed: 0
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
