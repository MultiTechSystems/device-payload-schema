# Milesight IoT WS201
name: milesight_ws201
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # DISTANCE
        "[3, 130]":
          - name: distance
            type: u16
        # REMAINING AMOUNT
        "[4, 214]":
          - name: remaining
            type: u8

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01756403823E0004D645"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 100
      distance: 62
      remaining: 69
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type130_midscale
    description: "Channel 3 type 130, midscale bytes, decoded by the vendor's own decoder"
    payload: "03821111"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 4369
  - name: ch4_type214_midscale
    description: "Channel 4 type 214, midscale bytes, decoded by the vendor's own decoder"
    payload: "04D611"
    fPort: 85
    source: vendor-codec
    expected:
      remaining: 17
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type130_zero_values
    description: "Channel 3 type 130, zero values bytes, decoded by the vendor's own decoder"
    payload: "03820000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
  - name: ch4_type214_zero_values
    description: "Channel 4 type 214, zero values bytes, decoded by the vendor's own decoder"
    payload: "04D600"
    fPort: 85
    source: vendor-codec
    expected:
      remaining: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type130_max_values
    description: "Channel 3 type 130, max values bytes, decoded by the vendor's own decoder"
    payload: "0382FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 65535
  - name: ch4_type214_max_values
    description: "Channel 4 type 214, max values bytes, decoded by the vendor's own decoder"
    payload: "04D6FF"
    fPort: 85
    source: vendor-codec
    expected:
      remaining: 255
