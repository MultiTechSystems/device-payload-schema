# Milesight IoT WS503
name: milesight_ws50x
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 8]":
          - name: sn
            type: hex
            length: 6
            # raw: readSerialNumber(bytes.slice(i, i + 6))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            sensor: none
            lookup: {1: "reset", default: "reset"}
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: {1: "on", default: "on"}
            # raw: readDeviceStatus(1)
        # SWITCH STATE
        "[255, 41]":
          - name: switch_1
            type: u8[0:0]
            lookup: ["off", "on"]
            # raw: readOnOffStatus((value >>> 0) & 1)
          - name: switch_1_change
            type: u8[4:4]
            lookup: ["no", "yes"]
            # raw: readYesNoStatus((value >>> 4) & 1)
          - name: switch_2
            type: u8[1:1]
            lookup: ["off", "on"]
            # raw: readOnOffStatus((value >>> 1) & 1)
          - name: switch_2_change
            type: u8[5:5]
            lookup: ["no", "yes"]
            # raw: readYesNoStatus((value >>> 5) & 1)
          - name: switch_3
            type: u8[2:2]
            lookup: ["off", "on"]
            # raw: readOnOffStatus((value >>> 2) & 1)
          - name: switch_3_change
            type: u8[6:6]
            lookup: ["no", "yes"]
            # raw: readYesNoStatus((value >>> 6) & 1)
            consume: 1
        # BUTTON STATUS
        "[255, 43]":
          - name: function_key_event
            type: u8
            sensor: none
            lookup: {1: "yes", default: "yes"}
            # raw: readYesNoStatus(1)

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type41_midscale
    description: "Channel 255 type 41, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF29111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      switch_1: "on"
      switch_1_change: "yes"
      switch_2: "off"
      switch_2_change: "no"
      switch_3: "off"
      switch_3_change: "no"
    expected_warnings:
      - ["0x11, 0x11", "5 of 8 byte(s)"]
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
  - name: ch255_type41_zero_values
    description: "Channel 255 type 41, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF29000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      switch_1: "off"
      switch_1_change: "no"
      switch_2: "off"
      switch_2_change: "no"
      switch_3: "off"
      switch_3_change: "no"
    expected_warnings:
      - ["0x00, 0x00", "5 of 8 byte(s)"]
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
  - name: ch255_type255_max_values
    description: "Channel 255 type 255, max values bytes, decoded by the vendor's own decoder"
    payload: "FFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v255.255"
  - name: power_on_reset_event
    description: "Reset-event frame: the vendor reports reset_event 'reset' whatever the byte holds"
    payload: "FFFEFF"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: function_key_event_constant
    description: "Button frame: the vendor reports function_key_event 'yes' whatever the byte holds"
    payload: "FF2BFF"
    fPort: 85
    source: vendor-codec
    expected:
      function_key_event: "yes"
  - name: sn_6_bytes
    description: "Serial number is six bytes; a device-status channel follows to prove alignment"
    payload: "FF086789ABCDEF01FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "6789abcdef01"
      device_status: "on"
  - name: ch255_type15_lorawan_class_class_b
    description: "Channel 255 type 15, chosen to pin lorawan_class; expected values from the vendor's own decoder"
    payload: "FF0F01"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class B"
  - name: ch255_type15_lorawan_class_class_c
    description: "Channel 255 type 15, chosen to pin lorawan_class; expected values from the vendor's own decoder"
    payload: "FF0F02"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class C"
  - name: ch255_type15_lorawan_class_class_ctob
    description: "Channel 255 type 15, chosen to pin lorawan_class; expected values from the vendor's own decoder"
    payload: "FF0F03"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class CtoB"
  - name: ch255_type254_reset_event_reset
    description: "Channel 255 type 254, chosen to pin reset_event; expected values from the vendor's own decoder"
    payload: "FFFE01"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: ch255_type11_device_status_on
    description: "Channel 255 type 11, chosen to pin device_status; expected values from the vendor's own decoder"
    payload: "FF0B01"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: ch255_type41_switch_2_bit_position
    description: "Channel 255 type 41, chosen to pin switch_2, switch_2_change, switch_3, switch_3_change; expected values from the vendor's own decoder"
    payload: "FF2944"
    fPort: 85
    source: vendor-codec
    expected:
      switch_1: "off"
      switch_1_change: "no"
      switch_2: "off"
      switch_2_change: "no"
      switch_3: "on"
      switch_3_change: "yes"
  - name: ch255_type41_switch_2_on
    description: "Channel 255 type 41, chosen to pin switch_2, switch_2_change; expected values from the vendor's own decoder"
    payload: "FF2922"
    fPort: 85
    source: vendor-codec
    expected:
      switch_1: "off"
      switch_1_change: "no"
      switch_2: "on"
      switch_2_change: "yes"
      switch_3: "off"
      switch_3_change: "no"
  - name: ch255_type43_function_key_event_yes
    description: "Channel 255 type 43, chosen to pin function_key_event; expected values from the vendor's own decoder"
    payload: "FF2B01"
    fPort: 85
    source: vendor-codec
    expected:
      function_key_event: "yes"
