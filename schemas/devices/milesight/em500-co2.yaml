# Milesight IoT em500-co2
name: milesight_em500_co2
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # HUMIDITY
        "[4, 104]":
          - name: humidity
            unit: "%"
            sensor: humidity
            ipso: {object: 3304, instance: 0, resource: 5700}
            senml: {name: "humidity", unit: "%RH"}
            semantic: "humidity"
            type: u8
            div: 2
        # CO2
        "[5, 125]":
          - name: co2
            unit: "ppm"
            sensor: co2
            ipso: {object: 3325, instance: 0, resource: 5700}
            senml: {name: "co2", unit: "ppm"}
            semantic: "co2"
            type: s16
        # PRESSURE
        "[6, 115]":
          - name: pressure
            unit: "hPa"
            type: s16
            div: 10
