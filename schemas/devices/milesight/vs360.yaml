# Milesight IoT VS360
name: milesight_vs360
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # BATTERY(MAIN)
        "[1, 117]":
          - name: battery_main
            type: u8
            # raw: readUInt8(bytes[i])
        # BATTERY(NODE)
        "[2, 117]":
          - name: battery_node
            type: u8
            # raw: readUInt8(bytes[i])
        # TOTAL IN / OUT
        "[4, 204]":
          - name: total_in
            type: u16
          - name: total_out
            type: u16
        # PERIOD IN / OUT
        "[5, 204]":
          - name: period_in
            type: u16
          - name: period_out
            type: u16
        # TOTAL IN / OUT ALARM
        "[132, 204]":
          - name: total_in
            type: u16
          - name: total_out
            type: u16
          - name: total_count_alarm
            type: u8
            # raw: readAlarmType(bytes[i + 4])
        # PERIOD IN / OUT ALARM
        "[133, 204]":
          - name: period_in
            type: u16
          - name: period_out
            type: u16
          - name: period_count_alarm
            type: u8
            # raw: readAlarmType(bytes[i + 4])
        # TIMESTAMP
        "[10, 239]":
          - name: timestamp
            type: u32

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01756402756404CC1200160005CC13001400"
    fPort: 85
    source: vendor-doc
    expected:
      battery_main: 100
      battery_node: 100
      total_in: 18
      total_out: 22
      period_in: 19
      period_out: 20
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery_main: 17
  - name: ch2_type117_midscale
    description: "Channel 2 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "027511"
    fPort: 85
    source: vendor-codec
    expected:
      battery_node: 17
  - name: ch4_type204_midscale
    description: "Channel 4 type 204, midscale bytes, decoded by the vendor's own decoder"
    payload: "04CC11111111"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 4369
      total_out: 4369
  - name: ch5_type204_midscale
    description: "Channel 5 type 204, midscale bytes, decoded by the vendor's own decoder"
    payload: "05CC11111111"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 4369
      period_out: 4369
  - name: ch10_type239_midscale
    description: "Channel 10 type 239, midscale bytes, decoded by the vendor's own decoder"
    payload: "0AEF11111111"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 286331153
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery_main: 0
  - name: ch2_type117_zero_values
    description: "Channel 2 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "027500"
    fPort: 85
    source: vendor-codec
    expected:
      battery_node: 0
  - name: ch4_type204_zero_values
    description: "Channel 4 type 204, zero values bytes, decoded by the vendor's own decoder"
    payload: "04CC00000000"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 0
      total_out: 0
  - name: ch5_type204_zero_values
    description: "Channel 5 type 204, zero values bytes, decoded by the vendor's own decoder"
    payload: "05CC00000000"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 0
      period_out: 0
  - name: ch10_type239_zero_values
    description: "Channel 10 type 239, zero values bytes, decoded by the vendor's own decoder"
    payload: "0AEF00000000"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery_main: 255
  - name: ch2_type117_max_values
    description: "Channel 2 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0275FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery_node: 255
  - name: ch4_type204_max_values
    description: "Channel 4 type 204, max values bytes, decoded by the vendor's own decoder"
    payload: "04CCFFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 65535
      total_out: 65535
  - name: ch5_type204_max_values
    description: "Channel 5 type 204, max values bytes, decoded by the vendor's own decoder"
    payload: "05CCFFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 65535
      period_out: 65535
