# Milesight IoT EM500-LGT
name: milesight_em500_lgt
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # LIGHT
        "[3, 148]":
          - name: light
            type: u32

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01755C039450000000"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 92
      light: 80
  - name: vendor_reference_2
    description: "Example declared by the vendor in the TTN device repository"
    payload: "017564039450000000"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 100
      light: 80
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type148_midscale
    description: "Channel 3 type 148, midscale bytes, decoded by the vendor's own decoder"
    payload: "039411111111"
    fPort: 85
    source: vendor-codec
    expected:
      light: 286331153
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type148_zero_values
    description: "Channel 3 type 148, zero values bytes, decoded by the vendor's own decoder"
    payload: "039400000000"
    fPort: 85
    source: vendor-codec
    expected:
      light: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
