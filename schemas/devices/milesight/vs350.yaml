# Milesight IoT VS350
name: milesight_vs350
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            sensor: none
            lookup: {1: "reset", default: "reset"}
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: {1: "on", default: "on"}
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # TOTAL IN / OUT
        "[4, 204]":
          - name: total_in
            type: u16
          - name: total_out
            type: u16
        # PERIOD IN / OUT
        "[5, 204]":
          - name: period_in
            type: u16
          - name: period_out
            type: u16
        # TIMESTAMP
        "[10, 239]":
          - name: timestamp
            type: u32
        # TEMPERATURE ALARM
        "[131, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            sensor: none
            # raw: readAlarmType(bytes[i + 2])
            lookup: {0: "threshold alarm release", 1: "threshold alarm", 3: "high temperature alarm", 4: "high temperature alarm release", default: "unknown"}
        # TOTAL IN / OUT ALARM
        "[132, 204]":
          - name: total_in
            type: u16
          - name: total_out
            type: u16
          - name: total_count_alarm
            type: u8
            sensor: none
            # raw: readAlarmType(bytes[i + 4])
            lookup: {0: "threshold alarm release", 1: "threshold alarm", 3: "high temperature alarm", 4: "high temperature alarm release", default: "unknown"}
        # PERIOD IN / OUT ALARM
        "[133, 204]":
          - name: period_in
            type: u16
          - name: period_out
            type: u16
          - name: period_count_alarm
            type: u8
            sensor: none
            # raw: readAlarmType(bytes[i + 4])
            lookup: {0: "threshold alarm release", 1: "threshold alarm", 3: "high temperature alarm", 4: "high temperature alarm release", default: "unknown"}

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type204_midscale
    description: "Channel 4 type 204, midscale bytes, decoded by the vendor's own decoder"
    payload: "04CC11111111"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 4369
      total_out: 4369
  - name: ch5_type204_midscale
    description: "Channel 5 type 204, midscale bytes, decoded by the vendor's own decoder"
    payload: "05CC11111111"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 4369
      period_out: 4369
  - name: ch10_type239_midscale
    description: "Channel 10 type 239, midscale bytes, decoded by the vendor's own decoder"
    payload: "0AEF11111111"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 286331153
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: power_on_reset_event
    description: "Reset-event frame: the vendor reports reset_event 'reset' whatever the byte holds"
    payload: "FFFEFF"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: temperature_alarm_label
    description: "Temperature alarm byte is a label"
    payload: "8367F00003"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 24
      temperature_alarm: "high temperature alarm"
  - name: total_count_alarm_label
    description: "Total count alarm byte is a label"
    payload: "84CC0100020001"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 1
      total_out: 2
      total_count_alarm: "threshold alarm"
  - name: period_count_alarm_unlisted
    description: "An unlisted period count alarm value: the vendor reports 'unknown'"
    payload: "85CC0100020009"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 1
      period_out: 2
      period_count_alarm: "unknown"
  - name: ch255_type254_reset_event_reset
    description: "Channel 255 type 254, chosen to pin reset_event; expected values from the vendor's own decoder"
    payload: "FFFE01"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: ch255_type11_device_status_on
    description: "Channel 255 type 11, chosen to pin device_status; expected values from the vendor's own decoder"
