# Milesight IoT EM310-UDL
name: milesight_em310_udl
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # DISTANCE
        "[3, 130]":
          - name: distance
            type: u16
        # POSITION
        "[4, 0]":
          - name: position
            type: u8
            # raw: readPositionStatus(bytes[i])

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type130_midscale
    description: "Channel 3 type 130, midscale bytes, decoded by the vendor's own decoder"
    payload: "03821111"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 4369
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type130_zero_values
    description: "Channel 3 type 130, zero values bytes, decoded by the vendor's own decoder"
    payload: "03820000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type130_max_values
    description: "Channel 3 type 130, max values bytes, decoded by the vendor's own decoder"
    payload: "0382FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 65535
