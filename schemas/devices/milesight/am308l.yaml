# Milesight IoT AM307(v2) / AM308(v2) / AM319(v2)
name: milesight_am308l
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            type: s16
            div: 10
        # HUMIDITY
        "[4, 104]":
          - name: humidity
            type: u8
            div: 2
        # PIR
        "[5, 0]":
          - name: pir
            type: u8
        # LIGHT
        "[6, 203]":
          - name: light_level
            type: u8
        # CO2
        "[7, 125]":
          - name: co2
            type: u16
        # TVOC (iaq)
        "[8, 125]":
          - name: tvoc
            type: u16
            div: 100
        # TVOC (ug/m3)
        "[8, 230]":
          - name: tvoc
            type: u16
        # PRESSURE
        "[9, 115]":
          - name: pressure
            type: u16
            div: 10
        # HCHO
        "[10, 125]":
          - name: hcho
            type: u16
            div: 100
        # PM2.5
        "[11, 125]":
          - name: pm2_5
            type: u16
        # PM10
        "[12, 125]":
          - name: pm10
            type: u16
        # O3
        "[13, 125]":
          - name: o3
            type: u16
            div: 100
        # BEEP
        "[14, 1]":
          - name: beep
            type: u8

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01755C03673401046865056A4900"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 92
      temperature: 30.8
      humidity: 50.5
  - name: vendor_reference_2
    description: "Example declared by the vendor in the TTN device repository"
    payload: "077DE704087D070009733F270B7D20000C7D3000"
    fPort: 85
    source: vendor-doc
    expected:
      co2: 1255
      tvoc: 0.07
      pressure: 1004.7
      pm2_5: 32
      pm10: 48
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type104_midscale
    description: "Channel 4 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "046811"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch6_type203_midscale
    description: "Channel 6 type 203, midscale bytes, decoded by the vendor's own decoder"
    payload: "06CB11"
    fPort: 85
    source: vendor-codec
    expected:
      light_level: 17
  - name: ch7_type125_midscale
    description: "Channel 7 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "077D1111"
    fPort: 85
    source: vendor-codec
    expected:
      co2: 4369
  - name: ch8_type125_midscale
    description: "Channel 8 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "087D1111"
    fPort: 85
    source: vendor-codec
    expected:
      tvoc: 43.69
  - name: ch8_type230_midscale
    description: "Channel 8 type 230, midscale bytes, decoded by the vendor's own decoder"
    payload: "08E61111"
    fPort: 85
    source: vendor-codec
    expected:
      tvoc: 4369
  - name: ch9_type115_midscale
    description: "Channel 9 type 115, midscale bytes, decoded by the vendor's own decoder"
    payload: "09731111"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 436.9
  - name: ch10_type125_midscale
    description: "Channel 10 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0A7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      hcho: 43.69
  - name: ch11_type125_midscale
    description: "Channel 11 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0B7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      pm2_5: 4369
  - name: ch12_type125_midscale
    description: "Channel 12 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0C7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      pm10: 4369
  - name: ch13_type125_midscale
    description: "Channel 13 type 125, midscale bytes, decoded by the vendor's own decoder"
    payload: "0D7D1111"
    fPort: 85
    source: vendor-codec
    expected:
      o3: 43.69
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
