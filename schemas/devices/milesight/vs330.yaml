# Milesight IoT VS330
name: milesight_vs330
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # DISTANCE
        "[2, 130]":
          - name: distance
            type: u16
        # OCCUPANCY
        "[3, 142]":
          - name: occupancy
            type: u8
            lookup: ["vacant", "occupied"]
        # CALIBRATION
        "[4, 142]":
          - name: calibration
            type: u8
            lookup: ["failed", "success"]

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01756202820F00038E01048E01"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 98
      distance: 15
      occupancy: "occupied"
      calibration: "success"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch2_type130_midscale
    description: "Channel 2 type 130, midscale bytes, decoded by the vendor's own decoder"
    payload: "02821111"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 4369
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch2_type130_zero_values
    description: "Channel 2 type 130, zero values bytes, decoded by the vendor's own decoder"
    payload: "02820000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
  - name: ch3_type142_zero_values
    description: "Channel 3 type 142, zero values bytes, decoded by the vendor's own decoder"
    payload: "038E00"
    fPort: 85
    source: vendor-codec
    expected:
      occupancy: "vacant"
  - name: ch4_type142_zero_values
    description: "Channel 4 type 142, zero values bytes, decoded by the vendor's own decoder"
    payload: "048E00"
    fPort: 85
    source: vendor-codec
    expected:
      calibration: "failed"
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch2_type130_max_values
    description: "Channel 2 type 130, max values bytes, decoded by the vendor's own decoder"
    payload: "0282FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 65535
