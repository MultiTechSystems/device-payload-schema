# Milesight IoT GS101
name: milesight_gs101
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # gas status
        "[5, 142]":
          - name: state
            type: u8
            lookup: ["normal", "abnormal"]
        # vale
        "[6, 1]":
          - name: valve
            type: u8
            lookup: ["close", "open"]
        # relay
        "[7, 1]":
          - name: relay
            type: u8
            lookup: ["close", "open"]
        # remained life time for the sensor
        "[8, 144]":
          - name: life_remain
            type: u32
        # alarm info
        "[255, 63]":
          - name: alarm
            type: u8
            sensor: none
            # raw: "power down"
            # The vendor's switch has no default: an unlisted byte sets nothing.
            lookup: {0: "power down", 1: "power on", 2: "sensor failure", 3: "sensor recover", 4: "sensor about to fail", 5: "sensor failed"}

test_vectors:
  - name: alarm_label
    description: "Alarm byte is a label"
    payload: "FF3F05"
    fPort: 85
    source: vendor-codec
    expected:
      alarm: "sensor failed"
  - name: alarm_power_down
    description: "Alarm byte 0 is 'power down'"
    payload: "FF3F00"
    fPort: 85
    source: vendor-codec
    expected:
      alarm: "power down"
