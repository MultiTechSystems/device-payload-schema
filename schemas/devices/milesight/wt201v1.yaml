# Milesight IoT WT201
name: milesight_wt201v1
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            sensor: none
            lookup: {1: "reset", default: "reset"}
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: {1: "on", default: "on"}
            # raw: readDeviceStatus(1)
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # TARGET TEMPERATURE
        "[4, 103]":
          - name: target_temperature
            type: s16
            div: 10
        # TEMPERATURE CONTROL
        "[5, 231]":
          - name: temperature_control_mode
            type: u8[0:1]
            sensor: none
            lookup: ["heat", "em_heat", "cool", "auto"]
            # raw: readTemperatureControlMode((temperature_control_value >>> 0) & 0x03)
          - name: temperature_control_status
            type: u8[4:7]
            sensor: none
            lookup: ["standby", "stage-1 heat", "stage-2 heat", "stage-3 heat", "stage-4 heat", "em_heat", "stage-1 cool", "stage-2 cool"]
            # raw: readTemperatureControlStatus((temperature_control_value >>> 4) & 0x0f)
            consume: 1
        # FAN CONTROL
        "[6, 232]":
          - name: fan_mode
            type: u8[0:1]
            sensor: none
            lookup: ["auto", "on", "circulate", "disable"]
            # raw: readFanMode((fan_value >>> 0) & 0x03)
          - name: fan_status
            type: u8[2:3]
            sensor: none
            lookup: ["standby", "high speed", "low speed", "on"]
            # raw: readFanStatus((fan_value >>> 2) & 0x03)
            consume: 1
        # PLAN EVENT
        "[7, 188]":
          - name: plan_type
            type: u8[0:3]
            sensor: none
            lookup: {0: "not executed", 1: "wake", 2: "away", 3: "home", 4: "sleep", default: "unknown"}
            # raw: readPlanEvent((plan_event_value >>> 0) & 0x0f)
            consume: 1
        # SYSTEM STATUS
        "[8, 142]":
          - name: system_status
            type: u8
            sensor: none
            lookup: ["off", "on"]
            # raw: readOnOffStatus(bytes[i])
        # HUMIDITY
        "[9, 104]":
          - name: humidity
            unit: "%"
            sensor: humidity
            ipso: {object: 3304, instance: 0, resource: 5700}
            senml: {name: "humidity", unit: "%RH"}
            semantic: "humidity"
            type: u8
            div: 2
            # raw: readUInt8(bytes[i]) / 2
        # RELAY STATUS
        "[10, 110]":
          - name: wires_relay
            type: object
            # raw: readWiresRelay(bytes[i])
            fields:
              - name: y1
                type: u8[0:0]
                lookup: ["off", "on"]
              - name: y2_gl
                type: u8[1:1]
                lookup: ["off", "on"]
              - name: w1
                type: u8[2:2]
                lookup: ["off", "on"]
              - name: w2_aux
                type: u8[3:3]
                lookup: ["off", "on"]
              - name: e
                type: u8[4:4]
                lookup: ["off", "on"]
              - name: g
                type: u8[5:5]
                lookup: ["off", "on"]
              - name: ob
                type: u8[6:6]
                lookup: ["off", "on"]
                consume: 1
        # TEMPERATURE MODE SUPPORT
        "[255, 203]":
          - name: temperature_control_support_mode
            type: object
            # raw: readTemperatureControlSupportMode(bytes[i])
            fields:
              - name: heat
                type: u8[0:0]
                lookup: ["disable", "enable"]
              - name: em_heat
                type: u8[1:1]
                lookup: ["disable", "enable"]
              - name: cool
                type: u8[2:2]
                lookup: ["disable", "enable"]
              - name: auto
                type: u8[3:3]
                lookup: ["disable", "enable"]
                consume: 1
          - name: temperature_control_support_status
            type: object
            # raw: readTemperatureControlSupportStatus(bytes[i + 1], bytes[i + 2])
            fields:
              - name: stage_1_heat
                type: u8[0:0]
                lookup: ["disable", "enable"]
              - name: stage_2_heat
                type: u8[1:1]
                lookup: ["disable", "enable"]
              - name: stage_3_heat
                type: u8[2:2]
                lookup: ["disable", "enable"]
              - name: stage_4_heat
                type: u8[3:3]
                lookup: ["disable", "enable"]
              - name: aux_heat
                type: u8[4:4]
                lookup: ["disable", "enable"]
                consume: 1
              - name: stage_1_cool
                type: u8[0:0]
                lookup: ["disable", "enable"]
              - name: stage_2_cool
                type: u8[1:1]
                lookup: ["disable", "enable"]
                consume: 1
        # TEMPERATURE ALARM
        "[131, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            sensor: none
            # raw: readTemperatureAlarm(bytes[i + 2])
            lookup: {1: "emergency heating timeout alarm", 2: "auxiliary heating timeout alarm", 3: "persistent low temperature alarm", 4: "persistent low temperature alarm release", 5: "persistent high temperature alarm", 6: "persistent high temperature alarm release", 7: "freeze protection alarm", 8: "freeze protection alarm release", 9: "threshold alarm", 10: "threshold alarm release", default: "unknown"}
        # TEMPERATURE EXCEPTION
        "[179, 103]":
          - name: temperature_sensor_status
            type: u8
            sensor: none
            # raw: readSensorStatus(bytes[i])
            lookup: {1: "read failed", 2: "out of range", default: "unknown"}
        # HUMIDITY EXCEPTION
        "[185, 104]":
          - name: humidity_sensor_status
            type: u8
            sensor: none
            # raw: readSensorStatus(bytes[i])
            lookup: {1: "read failed", 2: "out of range", default: "unknown"}

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 1
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 1
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 1
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 1
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 1
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 1
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type103_midscale
    description: "Channel 4 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "04671111"
    fPort: 1
    source: vendor-codec
    expected:
      target_temperature: 436.9
  - name: ch9_type104_midscale
    description: "Channel 9 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "096811"
    fPort: 1
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 1
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 1
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 1
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 1
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 1
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 1
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 1
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: power_on_reset_event
    description: "Reset-event frame: the vendor reports reset_event 'reset' whatever the byte holds"
    payload: "FFFEFF"
    fPort: 1
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 1
    source: vendor-codec
    expected:
      device_status: "on"
  - name: temperature_alarm_label
    description: "Temperature alarm byte is a label"
    payload: "8367F00009"
    fPort: 1
    source: vendor-codec
    expected:
      temperature: 24
      temperature_alarm: "threshold alarm"
  - name: temperature_sensor_status_label
    description: "Temperature sensor status byte is a label"
    payload: "B36701"
    fPort: 1
    source: vendor-codec
    expected:
      temperature_sensor_status: "read failed"
  - name: humidity_sensor_status_unlisted
    description: "An unlisted humidity sensor status: the vendor reports 'unknown'"
    payload: "B96800"
    fPort: 1
    source: vendor-codec
    expected:
      humidity_sensor_status: "unknown"
  - name: plan_type_label
    description: "Plan type nibble is a label; 0 is 'not executed'"
    payload: "07BC02"
    fPort: 1
    source: vendor-codec
    expected:
      plan_type: "away"
  - name: plan_type_unlisted
    description: "An unlisted plan type nibble: the vendor reports 'unknown'"
    payload: "07BC0C"
    fPort: 1
    source: vendor-codec
    expected:
      plan_type: "unknown"
  - name: wires_relay_bits
    description: "Wires relay: seven on/off bits in one byte"
    payload: "0A6E55"
    fPort: 1
    source: vendor-codec
    expected:
      wires_relay:
        y1: "on"
        y2_gl: "off"
        w1: "on"
        w2_aux: "off"
        e: "on"
        g: "off"
        ob: "on"
  - name: temperature_control_support_bits
    description: "Temperature control support: a mode byte and two status bytes of enable bits; device status follows to prove alignment"
    payload: "FFCB0A0A01FF0BFF"
    fPort: 1
    source: vendor-codec
    expected:
      temperature_control_support_mode:
        heat: "disable"
        em_heat: "enable"
        cool: "disable"
        auto: "enable"
      temperature_control_support_status:
        stage_1_heat: "disable"
        stage_2_heat: "enable"
        stage_3_heat: "disable"
        stage_4_heat: "enable"
        aux_heat: "disable"
        stage_1_cool: "enable"
        stage_2_cool: "disable"
      device_status: "on"
