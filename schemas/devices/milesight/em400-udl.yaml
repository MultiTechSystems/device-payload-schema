# Milesight IoT EM400-TLD
name: milesight_em400_udl
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            type: s16
            div: 10
        # DISTANCE
        "[4, 130]":
          - name: distance
            type: u16
        # POSITION
        "[5, 0]":
          - name: position
            type: u8
        # TEMPERATURE WITH ABNORMAL
        "[131, 103]":
          - name: temperature
            type: s16
            div: 10
          - name: temperature_abnormal
            type: u8
        # DISTANCE WITH ALARMING
        "[132, 130]":
          - name: distance
            type: u16
          - name: distance_alarming
            type: u8

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type130_midscale
    description: "Channel 4 type 130, midscale bytes, decoded by the vendor's own decoder"
    payload: "04821111"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 4369
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch4_type130_zero_values
    description: "Channel 4 type 130, zero values bytes, decoded by the vendor's own decoder"
    payload: "04820000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
  - name: ch131_type103_zero_values
    description: "Channel 131 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "8367000000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
      temperature_abnormal: false
  - name: ch132_type130_zero_values
    description: "Channel 132 type 130, zero values bytes, decoded by the vendor's own decoder"
    payload: "8482000000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
      distance_alarming: false
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: ch4_type130_max_values
    description: "Channel 4 type 130, max values bytes, decoded by the vendor's own decoder"
    payload: "0482FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 65535
