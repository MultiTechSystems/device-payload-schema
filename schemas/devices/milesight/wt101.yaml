# Milesight IoT WT101
name: milesight_wt101
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            type: s16
            div: 10
        # TARGET TEMPERATURE
        "[4, 103]":
          - name: target_temperature
            type: s16
            div: 10
        # VALVE OPENING
        "[5, 146]":
          - name: valve_opening
            type: u8
            # raw: readUInt8(bytes[i])
        # TAMPER STATUS
        "[6, 0]":
          - name: tamper_status
            type: u8
            # raw: readTamperStatus(bytes[i])
        # WINDOW DETECTION
        "[7, 0]":
          - name: window_detection
            type: u8
            # raw: readWindowDetectionStatus(bytes[i])
        # MOTOR STROKE CALIBRATION RESULT
        "[8, 229]":
          - name: motor_calibration_result
            type: u8
            # raw: readMotorCalibrationResult(bytes[i])
        # MOTOR STROKE
        "[9, 144]":
          - name: motor_stroke
            type: u16
        # FREEZE PROTECTION
        "[10, 0]":
          - name: freeze_protection
            type: u8
            # raw: readFreezeProtectionStatus(bytes[i])
        # MOTOR CURRENT POSITION
        "[11, 144]":
          - name: motor_position
            type: u16
        # HEATING DATE
        "[249, 51]":
          - name: heating_date
            type: u8
            # raw: readHeatingDate(bytes.slice(i, i + 7))
        # HEATING SCHEDULE
        "[249, 52]":
          - name: heating_schedule
            type: u8
            # raw: decoded.heating_schedule || []

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01756104672C0103670A01059264099000000B900000"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 97
      target_temperature: 30
      temperature: 26.6
      valve_opening: 100
      motor_stroke: 0
      motor_position: 0
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type103_midscale
    description: "Channel 4 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "04671111"
    fPort: 85
    source: vendor-codec
    expected:
      target_temperature: 436.9
  - name: ch5_type146_midscale
    description: "Channel 5 type 146, midscale bytes, decoded by the vendor's own decoder"
    payload: "059211"
    fPort: 85
    source: vendor-codec
    expected:
      valve_opening: 17
  - name: ch9_type144_midscale
    description: "Channel 9 type 144, midscale bytes, decoded by the vendor's own decoder"
    payload: "09901111"
    fPort: 85
    source: vendor-codec
    expected:
      motor_stroke: 4369
  - name: ch11_type144_midscale
    description: "Channel 11 type 144, midscale bytes, decoded by the vendor's own decoder"
    payload: "0B901111"
    fPort: 85
    source: vendor-codec
    expected:
      motor_position: 4369
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
