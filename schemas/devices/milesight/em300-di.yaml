# Milesight IoT EM300-DI
name: milesight_em300_di
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # HUMIDITY
        "[4, 104]":
          - name: humidity
            unit: "%"
            sensor: humidity
            ipso: {object: 3304, instance: 0, resource: 5700}
            senml: {name: "humidity", unit: "%RH"}
            semantic: "humidity"
            type: u8
            div: 2
        # GPIO
        "[5, 0]":
          - name: gpio
            type: u8
        # PULSE COUNTER
        "[5, 200]":
          - name: pulse
            type: u32

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01755C05C800010000"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 92
      pulse: 256
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type104_midscale
    description: "Channel 4 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "046811"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch5_type0_midscale
    description: "Channel 5 type 0, midscale bytes, decoded by the vendor's own decoder"
    payload: "050011"
    fPort: 85
    source: vendor-codec
    expected:
      gpio: 17
  - name: ch5_type200_midscale
    description: "Channel 5 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "05C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      pulse: 286331153
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch4_type104_zero_values
    description: "Channel 4 type 104, zero values bytes, decoded by the vendor's own decoder"
    payload: "046800"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 0
  - name: ch5_type0_zero_values
    description: "Channel 5 type 0, zero values bytes, decoded by the vendor's own decoder"
    payload: "050000"
    fPort: 85
    source: vendor-codec
    expected:
      gpio: 0
  - name: ch5_type200_zero_values
    description: "Channel 5 type 200, zero values bytes, decoded by the vendor's own decoder"
    payload: "05C800000000"
    fPort: 85
    source: vendor-codec
    expected:
      pulse: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch4_type104_max_values
    description: "Channel 4 type 104, max values bytes, decoded by the vendor's own decoder"
    payload: "0468FF"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 127.5
  - name: ch5_type0_max_values
    description: "Channel 5 type 0, max values bytes, decoded by the vendor's own decoder"
    payload: "0500FF"
    fPort: 85
    source: vendor-codec
    expected:
      gpio: 255
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
