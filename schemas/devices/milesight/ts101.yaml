# Milesight IoT TS101
name: milesight_ts101
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # battery
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
        # temperature
        "[3, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # temperature threshold alert
        "[131, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_alert
            type: u8
            sensor: none
            # raw: readAlertType(bytes[i + 2])
            lookup: {0: "normal", 1: "threshold", 2: "mutation", default: "unkown"}
        # temperature mutation alert
        "[147, 215]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_change
            type: s16
            div: 100
          - name: temperature_alert
            type: u8
            sensor: none
            # raw: readAlertType(bytes[i + 4])
            lookup: {0: "normal", 1: "threshold", 2: "mutation", default: "unkown"}
        # temperature history
        "[32, 206]":
          - name: history
            type: u8
            # raw: = undefined) {

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01756403670701"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 100
      temperature: 26.3
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: temperature_alert_label
    description: "Temperature alert byte is a label"
    payload: "8367F00001"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 24
      temperature_alert: "threshold"
  - name: temperature_alert_unlisted
    description: "An unlisted alert value: the vendor reports its own 'unkown' label"
    payload: "8367F00009"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 24
      temperature_alert: "unkown"
  - name: temperature_mutation_alert_label
    description: "Mutation alert channel: alert byte is a label; battery follows to prove alignment"
    payload: "93D7F000100002017564"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 24
      temperature_change: 0.16
      temperature_alert: "mutation"
      battery: 100
