# Milesight IoT VS351
name: milesight_vs351
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # POWER STATUS
        "[255, 204]":
          - name: power_status
            type: u8
            # raw: readPowerStatus(bytes[i])
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            type: s16
            div: 10
        # TOTAL IN / OUT
        "[4, 204]":
          - name: total_in
            type: u16
          - name: total_out
            type: u16
        # PERIOD IN / OUT
        "[5, 204]":
          - name: period_in
            type: u16
          - name: period_out
            type: u16
        # TEMPERATURE ALARM
        "[131, 103]":
          - name: temperature
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            # raw: readAlarmType(bytes[i + 2])
        # TOTAL IN / OUT ALARM
        "[132, 204]":
          - name: total_in
            type: u16
          - name: total_out
            type: u16
          - name: total_count_alarm
            type: u8
            # raw: readAlarmType(bytes[i + 4])
        # PERIOD IN / OUT ALARM
        "[133, 204]":
          - name: period_in
            type: u16
          - name: period_out
            type: u16
          - name: period_count_alarm
            type: u8
            # raw: readAlarmType(bytes[i + 4])
        # TIMESTAMP
        "[10, 239]":
          - name: timestamp
            type: u32

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "04CC1200160005CC13001400"
    fPort: 85
    source: vendor-doc
    expected:
      total_in: 18
      total_out: 22
      period_in: 19
      period_out: 20
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type204_midscale
    description: "Channel 4 type 204, midscale bytes, decoded by the vendor's own decoder"
    payload: "04CC11111111"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 4369
      total_out: 4369
  - name: ch5_type204_midscale
    description: "Channel 5 type 204, midscale bytes, decoded by the vendor's own decoder"
    payload: "05CC11111111"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 4369
      period_out: 4369
  - name: ch10_type239_midscale
    description: "Channel 10 type 239, midscale bytes, decoded by the vendor's own decoder"
    payload: "0AEF11111111"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 286331153
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch4_type204_zero_values
    description: "Channel 4 type 204, zero values bytes, decoded by the vendor's own decoder"
    payload: "04CC00000000"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 0
      total_out: 0
  - name: ch5_type204_zero_values
    description: "Channel 5 type 204, zero values bytes, decoded by the vendor's own decoder"
    payload: "05CC00000000"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 0
      period_out: 0
  - name: ch10_type239_zero_values
    description: "Channel 10 type 239, zero values bytes, decoded by the vendor's own decoder"
    payload: "0AEF00000000"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: ch4_type204_max_values
    description: "Channel 4 type 204, max values bytes, decoded by the vendor's own decoder"
    payload: "04CCFFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      total_in: 65535
      total_out: 65535
  - name: ch5_type204_max_values
    description: "Channel 5 type 204, max values bytes, decoded by the vendor's own decoder"
    payload: "05CCFFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      period_in: 65535
      period_out: 65535
