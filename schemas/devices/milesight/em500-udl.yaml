# Milesight IoT em500-udl
name: milesight_em500_udl
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "/100"}
            semantic: "battery"
            type: u8
        # DISTANCE
        "[3, 130]":
          - name: distance
            unit: "mm"
            type: s16
            div: 1000
test_vectors:
  # Battery channel 01 75, decoded by the vendor decoder (em500-udl.js, TTN v2 Decoder()).
  - name: vendor_battery_channel
    description: "Battery channel, decoded by the vendor's own decoder"
    source: vendor-codec
    fPort: 85
    payload: "01755A"
    expected:
      battery: 90
