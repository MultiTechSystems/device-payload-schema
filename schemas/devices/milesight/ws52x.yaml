# Milesight IoT WS52x
name: milesight_ws52x
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            sensor: none
            lookup: ["normal", "reset"]
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: ["off", "on"]
            # raw: readDeviceStatus(1)
        # VOLTAGE
        "[3, 116]":
          - name: voltage
            type: u16
            div: 10
        # ACTIVE POWER
        "[4, 128]":
          - name: active_power
            type: u32
        # POWER FACTOR
        "[5, 129]":
          - name: power_factor
            type: u8
            # raw: readUInt8(bytes[i])
        # POWER CONSUMPTION
        "[6, 131]":
          - name: power_consumption
            type: u32
        # CURRENT
        "[7, 201]":
          - name: current
            type: u16
        # SOCKET STATUS
        "[8, 112]":
          - name: socket_status
            type: u8
            sensor: none
            lookup: ["off", "on"]
            # raw: readSocketStatus(data & 0x01)

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "0374ED08"
    fPort: 85
    source: vendor-doc
    expected:
      voltage: 228.5
  - name: vendor_reference_2
    description: "Example declared by the vendor in the TTN device repository"
    payload: "068356040000"
    fPort: 85
    source: vendor-doc
    expected:
      power_consumption: 1110
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch3_type116_midscale
    description: "Channel 3 type 116, midscale bytes, decoded by the vendor's own decoder"
    payload: "03741111"
    fPort: 85
    source: vendor-codec
    expected:
      voltage: 436.9
  - name: ch4_type128_midscale
    description: "Channel 4 type 128, midscale bytes, decoded by the vendor's own decoder"
    payload: "048011111111"
    fPort: 85
    source: vendor-codec
    expected:
      active_power: 286331153
  - name: ch5_type129_midscale
    description: "Channel 5 type 129, midscale bytes, decoded by the vendor's own decoder"
    payload: "058111"
    fPort: 85
    source: vendor-codec
    expected:
      power_factor: 17
  - name: ch6_type131_midscale
    description: "Channel 6 type 131, midscale bytes, decoded by the vendor's own decoder"
    payload: "068311111111"
    fPort: 85
    source: vendor-codec
    expected:
      power_consumption: 286331153
  - name: ch7_type201_midscale
    description: "Channel 7 type 201, midscale bytes, decoded by the vendor's own decoder"
    payload: "07C91111"
    fPort: 85
    source: vendor-codec
    expected:
      current: 4369
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch3_type116_zero_values
    description: "Channel 3 type 116, zero values bytes, decoded by the vendor's own decoder"
    payload: "03740000"
    fPort: 85
    source: vendor-codec
    expected:
      voltage: 0
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
