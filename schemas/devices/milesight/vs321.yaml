# Milesight IoT VS321
name: milesight_vs321
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature_sensor_status
            type: u8
            # raw: readSensorStatus(2)
        # HUMIDITY
        "[4, 104]":
          - name: humidity_sensor_status
            type: u8
            # raw: readSensorStatus(2)
        # PEOPLE TOTAL COUNTS
        "[5, 253]":
          - name: people_total_counts
            type: u16
        # ILLUMINANCE STATUS
        "[7, 255]":
          - name: illuminance_status
            type: u8
            # raw: readIlluminanceStatus(bytes[i])
        # CONFIDENCE STATUS
        "[8, 244]":
          - name: detection_status
            type: u8
            # raw: readDetectionStatus(bytes[i + 1])
        # TIMESTAMP
        "[10, 239]":
          - name: timestamp
            type: u32
        # TEMPERATURE ALARM
        "[131, 103]":
          - name: temperature
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            # raw: readTemperatureAlarm(bytes[i + 2])
        # HUMIDITY ALARM
        "[132, 104]":
          - name: humidity
            type: u8
            div: 2
            # raw: readUInt8(bytes[i]) / 2
          - name: humidity_alarm
            type: u8
            # raw: readHumidityAlarm(bytes[i + 1])

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch5_type253_midscale
    description: "Channel 5 type 253, midscale bytes, decoded by the vendor's own decoder"
    payload: "05FD1111"
    fPort: 85
    source: vendor-codec
    expected:
      people_total_counts: 4369
  - name: ch10_type239_midscale
    description: "Channel 10 type 239, midscale bytes, decoded by the vendor's own decoder"
    payload: "0AEF11111111"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 286331153
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch5_type253_zero_values
    description: "Channel 5 type 253, zero values bytes, decoded by the vendor's own decoder"
    payload: "05FD0000"
    fPort: 85
    source: vendor-codec
    expected:
      people_total_counts: 0
  - name: ch10_type239_zero_values
    description: "Channel 10 type 239, zero values bytes, decoded by the vendor's own decoder"
    payload: "0AEF00000000"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch5_type253_max_values
    description: "Channel 5 type 253, max values bytes, decoded by the vendor's own decoder"
    payload: "05FDFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      people_total_counts: 65535
  - name: ch10_type239_max_values
    description: "Channel 10 type 239, max values bytes, decoded by the vendor's own decoder"
    payload: "0AEFFFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 4294967295
