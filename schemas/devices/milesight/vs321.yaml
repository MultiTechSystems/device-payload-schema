# Milesight IoT VS321
name: milesight_vs321
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            lookup: ["normal", "reset"]
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            lookup: ["off", "on"]
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature_sensor_status
            type: u8
            lookup: ["normal", "over_range", "read_failed"]
            # raw: readSensorStatus(2)
        # HUMIDITY
        "[4, 104]":
          - name: humidity_sensor_status
            type: u8
            lookup: ["normal", "over_range", "read_failed"]
            # raw: readSensorStatus(2)
        # PEOPLE TOTAL COUNTS
        "[5, 253]":
          - name: people_total_counts
            type: u16
        # ILLUMINANCE STATUS
        "[7, 255]":
          - name: illuminance_status
            type: u8
            lookup: ["dim", "bright"]
            # raw: readIlluminanceStatus(bytes[i])
        # CONFIDENCE STATUS
        "[8, 244]":
          - name: detection_status
            type: u8
            lookup: ["normal", "unavailable"]
            # raw: readDetectionStatus(bytes[i + 1])
        # TIMESTAMP
        "[10, 239]":
          - name: timestamp
            type: u32
        # TEMPERATURE ALARM
        "[131, 103]":
          - name: temperature
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            lookup: ["threshold_alarm_release", "threshold_alarm"]
            # raw: readTemperatureAlarm(bytes[i + 2])
        # HUMIDITY ALARM
        "[132, 104]":
          - name: humidity
            type: u8
            div: 2
            # raw: readUInt8(bytes[i]) / 2
          - name: humidity_alarm
            type: u8
            lookup: ["threshold_alarm_release", "threshold_alarm"]
            # raw: readHumidityAlarm(bytes[i + 1])

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch5_type253_midscale
    description: "Channel 5 type 253, midscale bytes, decoded by the vendor's own decoder"
    payload: "05FD1111"
    fPort: 85
    source: vendor-codec
    expected:
      people_total_counts: 4369
  - name: ch10_type239_midscale
    description: "Channel 10 type 239, midscale bytes, decoded by the vendor's own decoder"
    payload: "0AEF11111111"
    fPort: 85
    source: vendor-codec
    expected:
      timestamp: 286331153
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
