# Milesight IoT AT101
name: milesight_at101_fh
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            type: s16
            div: 10
        # DEVICE POSITION
        "[5, 0]":
          - name: position
            type: u8
            # raw: readDevicePosition(bytes[i])
        # TAMPER STATUS
        "[7, 0]":
          - name: tamper_status
            type: u8
            # raw: readTamperStatus(bytes[i])
        # ANGLE
        "[8, 155]":
          - name: initial_angle_x
            type: u8
            # raw: readInt8(bytes[i])
          - name: initial_angle_y
            type: u8
            # raw: readInt8(bytes[i + 1])
          - name: initial_angle_z
            type: u8
            # raw: readInt8(bytes[i + 2])
          - name: inclination_angle_x
            type: u8
            # raw: readInt8(bytes[i + 3])
          - name: inclination_angle_y
            type: u8
            # raw: readInt8(bytes[i + 4])
          - name: inclination_angle_z
            type: u8
            # raw: readInt8(bytes[i + 5])
        # TEMPERATURE WITH ABNORMAL
        "[131, 103]":
          - name: temperature
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            # raw: readTemperatureAlarm(bytes[i + 2])

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch8_type155_midscale
    description: "Channel 8 type 155, midscale bytes, decoded by the vendor's own decoder"
    payload: "089B111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      initial_angle_x: 17
      initial_angle_y: 17
      initial_angle_z: 17
      inclination_angle_x: 17
      inclination_angle_y: 17
      inclination_angle_z: 17
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch8_type155_zero_values
    description: "Channel 8 type 155, zero values bytes, decoded by the vendor's own decoder"
    payload: "089B000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      initial_angle_x: 0
      initial_angle_y: 0
      initial_angle_z: 0
      inclination_angle_x: 0
      inclination_angle_y: 0
      inclination_angle_z: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
