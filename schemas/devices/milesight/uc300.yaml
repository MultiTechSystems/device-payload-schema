# Milesight IoT UC300 series
name: milesight_uc300
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # Digital Input
        "[3, 0]":
          - name: digital_input_1
            type: u8
            lookup: ["off", "on"]
        "[4, 0]":
          - name: digital_input_2
            type: u8
            lookup: ["off", "on"]
        "[5, 0]":
          - name: digital_input_3
            type: u8
            lookup: ["off", "on"]
        "[6, 0]":
          - name: digital_input_4
            type: u8
            lookup: ["off", "on"]
        # Digital Output
        "[7, 1]":
          - name: digital_output_1
            type: u8
            lookup: ["off", "on"]
        "[8, 1]":
          - name: digital_output_2
            type: u8
            lookup: ["off", "on"]
        # Digital Input as Counter
        "[3, 200]":
          - name: pulse_count_1
            type: u32
        "[4, 200]":
          - name: pulse_count_2
            type: u32
        "[5, 200]":
          - name: pulse_count_3
            type: u32
        "[6, 200]":
          - name: pulse_count_4
            type: u32
        # PT100
        "[9, 103]":
          - name: pt100_1
            type: s16
            div: 10
        "[10, 103]":
          - name: pt100_2
            type: s16
            div: 10
        # ADC CHANNEL
        "[11, 2]":
          - name: analog_input_adc_1
            type: u32
            div: 100
        "[12, 2]":
          - name: analog_input_adc_2
            type: u32
            div: 100
        # ADC CHANNEL for voltage
        "[13, 2]":
          - name: analog_input_adv_1
            type: u32
            div: 100
        "[14, 2]":
          - name: analog_input_adv_2
            type: u32
            div: 100
        # MODBUS
        "[255, 25]":
          - name: modbus_channels
            type: u8
            # raw: []

test_vectors:
  - name: ch3_type200_midscale
    description: "Channel 3 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "03C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_1: 286331153
  - name: ch4_type200_midscale
    description: "Channel 4 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "04C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_2: 286331153
  - name: ch5_type200_midscale
    description: "Channel 5 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "05C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_3: 286331153
  - name: ch6_type200_midscale
    description: "Channel 6 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "06C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_4: 286331153
  - name: ch9_type103_midscale
    description: "Channel 9 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "09671111"
    fPort: 85
    source: vendor-codec
    expected:
      pt100_1: 436.9
  - name: ch10_type103_midscale
    description: "Channel 10 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "0A671111"
    fPort: 85
    source: vendor-codec
    expected:
      pt100_2: 436.9
  - name: ch3_type0_zero_values
    description: "Channel 3 type 0, zero values bytes, decoded by the vendor's own decoder"
    payload: "030000"
    fPort: 85
    source: vendor-codec
    expected:
      digital_input_1: "off"
  - name: ch4_type0_zero_values
    description: "Channel 4 type 0, zero values bytes, decoded by the vendor's own decoder"
    payload: "040000"
    fPort: 85
    source: vendor-codec
    expected:
      digital_input_2: "off"
  - name: ch5_type0_zero_values
    description: "Channel 5 type 0, zero values bytes, decoded by the vendor's own decoder"
    payload: "050000"
    fPort: 85
    source: vendor-codec
    expected:
      digital_input_3: "off"
  - name: ch6_type0_zero_values
    description: "Channel 6 type 0, zero values bytes, decoded by the vendor's own decoder"
    payload: "060000"
    fPort: 85
    source: vendor-codec
    expected:
      digital_input_4: "off"
  - name: ch7_type1_zero_values
    description: "Channel 7 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "070100"
    fPort: 85
    source: vendor-codec
    expected:
      digital_output_1: "off"
  - name: ch8_type1_zero_values
    description: "Channel 8 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "080100"
    fPort: 85
    source: vendor-codec
    expected:
      digital_output_2: "off"
  - name: ch3_type200_zero_values
    description: "Channel 3 type 200, zero values bytes, decoded by the vendor's own decoder"
    payload: "03C800000000"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_1: 0
  - name: ch4_type200_zero_values
    description: "Channel 4 type 200, zero values bytes, decoded by the vendor's own decoder"
    payload: "04C800000000"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_2: 0
  - name: ch5_type200_zero_values
    description: "Channel 5 type 200, zero values bytes, decoded by the vendor's own decoder"
    payload: "05C800000000"
    fPort: 85
    source: vendor-codec
    expected:
      pulse_count_3: 0
