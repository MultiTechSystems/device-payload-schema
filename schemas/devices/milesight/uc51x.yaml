# Milesight IoT UC511 / UC512
name: milesight_uc51x
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            lookup: ["normal", "reset"]
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            lookup: ["off", "on"]
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
            # raw: readUInt8(bytes[i])
        # VALVE 1
        "[3, 1]":
          - name: valve_1_result
            type: u8
            lookup: ["success", "failed"]
            # raw: readDelayControlResult(1)
        # VALVE 2
        "[5, 1]":
          - name: valve_2_result
            type: u8
            lookup: ["success", "failed"]
            # raw: readDelayControlResult(1)
        # VALVE 1 Pulse
        "[4, 200]":
          - name: valve_1_pulse
            type: u32
        # VALVE 2 Pulse
        "[6, 200]":
          - name: valve_2_pulse
            type: u32
        # GPIO 1 (hardware_version >= v2.0 and firmware_version >= v2.4)
        "[7, 1]":
          - name: gpio_1
            type: u8
            lookup: ["off", "on"]
            # raw: readGpioStatus(bytes[i])
        # GPIO 2 (hardware_version >= v2.0 and firmware_version >= v2.4)
        "[8, 1]":
          - name: gpio_2
            type: u8
            lookup: ["off", "on"]
            # raw: readGpioStatus(bytes[i])
        # PRESSURE (hardware_version >= v4.0 and firmware_version >= v1.2)
        "[9, 123]":
          - name: pressure
            unit: "hPa"
            type: u16
        # PRESSURE FAILED (hardware_version >= v4.0 and firmware_version >= v1.2)
        "[185, 123]":
          - name: pressure_sensor_status
            type: u8
            # raw: readSensorStatus(bytes[i])
        # CUSTOM MESSAGE (hardware_version >= v4.0 and firmware_version >= v1.1)
        "[255, 18]":
          - name: custom_message
            type: u8
            # raw: readAscii(bytes.slice(i, bytes.length))

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch4_type200_midscale
    description: "Channel 4 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "04C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      valve_1_pulse: 286331153
  - name: ch6_type200_midscale
    description: "Channel 6 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "06C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      valve_2_pulse: 286331153
  - name: ch9_type123_midscale
    description: "Channel 9 type 123, midscale bytes, decoded by the vendor's own decoder"
    payload: "097B1111"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 4369
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
