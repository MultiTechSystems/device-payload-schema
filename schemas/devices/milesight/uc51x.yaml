# Milesight IoT UC511 / UC512
name: milesight_uc51x
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # VALVE 1
        "[3, 1]":
          - name: valve_1_result
            type: u8
            # raw: readDelayControlResult(1)
        # VALVE 2
        "[5, 1]":
          - name: valve_2_result
            type: u8
            # raw: readDelayControlResult(1)
        # VALVE 1 Pulse
        "[4, 200]":
          - name: valve_1_pulse
            type: u32
        # VALVE 2 Pulse
        "[6, 200]":
          - name: valve_2_pulse
            type: u32
        # GPIO 1 (hardware_version >= v2.0 and firmware_version >= v2.4)
        "[7, 1]":
          - name: gpio_1
            type: u8
            # raw: readGpioStatus(bytes[i])
        # GPIO 2 (hardware_version >= v2.0 and firmware_version >= v2.4)
        "[8, 1]":
          - name: gpio_2
            type: u8
            # raw: readGpioStatus(bytes[i])
        # PRESSURE (hardware_version >= v4.0 and firmware_version >= v1.2)
        "[9, 123]":
          - name: pressure
            type: u16
        # PRESSURE FAILED (hardware_version >= v4.0 and firmware_version >= v1.2)
        "[185, 123]":
          - name: pressure_sensor_status
            type: u8
            # raw: readSensorStatus(bytes[i])
        # CUSTOM MESSAGE (hardware_version >= v4.0 and firmware_version >= v1.1)
        "[255, 18]":
          - name: custom_message
            type: u8
            # raw: readAscii(bytes.slice(i, bytes.length))

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch4_type200_midscale
    description: "Channel 4 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "04C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      valve_1_pulse: 286331153
  - name: ch6_type200_midscale
    description: "Channel 6 type 200, midscale bytes, decoded by the vendor's own decoder"
    payload: "06C811111111"
    fPort: 85
    source: vendor-codec
    expected:
      valve_2_pulse: 286331153
  - name: ch9_type123_midscale
    description: "Channel 9 type 123, midscale bytes, decoded by the vendor's own decoder"
    payload: "097B1111"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 4369
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch4_type200_zero_values
    description: "Channel 4 type 200, zero values bytes, decoded by the vendor's own decoder"
    payload: "04C800000000"
    fPort: 85
    source: vendor-codec
    expected:
      valve_1_pulse: 0
  - name: ch6_type200_zero_values
    description: "Channel 6 type 200, zero values bytes, decoded by the vendor's own decoder"
    payload: "06C800000000"
    fPort: 85
    source: vendor-codec
    expected:
      valve_2_pulse: 0
  - name: ch9_type123_zero_values
    description: "Channel 9 type 123, zero values bytes, decoded by the vendor's own decoder"
    payload: "097B0000"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch4_type200_max_values
    description: "Channel 4 type 200, max values bytes, decoded by the vendor's own decoder"
    payload: "04C8FFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      valve_1_pulse: 4294967295
  - name: ch6_type200_max_values
    description: "Channel 6 type 200, max values bytes, decoded by the vendor's own decoder"
    payload: "06C8FFFFFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      valve_2_pulse: 4294967295
  - name: ch9_type123_max_values
    description: "Channel 9 type 123, max values bytes, decoded by the vendor's own decoder"
    payload: "097BFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 65535
