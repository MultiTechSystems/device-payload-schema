# Milesight IoT EM410-RDL
name: milesight_em410_rdl
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: u8
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: u8
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: u8
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: u8
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: u8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            # raw: readOnOffStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[3, 103]":
          - name: temperature
            type: s16
            div: 10
        # DISTANCE
        "[4, 130]":
          - name: distance
            type: s16
        # POSITION
        "[5, 0]":
          - name: position
            type: u8
            # raw: readPositionStatus(bytes[i])
        # RADAR SIGNAL STRENGTH
        "[6, 199]":
          - name: radar_signal_rssi
            type: s16
            div: 100

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch4_type130_midscale
    description: "Channel 4 type 130, midscale bytes, decoded by the vendor's own decoder"
    payload: "04821111"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 4369
  - name: ch6_type199_midscale
    description: "Channel 6 type 199, midscale bytes, decoded by the vendor's own decoder"
    payload: "06C71111"
    fPort: 85
    source: vendor-codec
    expected:
      radar_signal_rssi: 43.69
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type103_zero_values
    description: "Channel 3 type 103, zero values bytes, decoded by the vendor's own decoder"
    payload: "03670000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 0
  - name: ch4_type130_zero_values
    description: "Channel 4 type 130, zero values bytes, decoded by the vendor's own decoder"
    payload: "04820000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
  - name: ch6_type199_zero_values
    description: "Channel 6 type 199, zero values bytes, decoded by the vendor's own decoder"
    payload: "06C70000"
    fPort: 85
    source: vendor-codec
    expected:
      radar_signal_rssi: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type103_max_values
    description: "Channel 3 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0367FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: ch4_type130_max_values
    description: "Channel 4 type 130, max values bytes, decoded by the vendor's own decoder"
    payload: "0482FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      distance: -1
  - name: ch6_type199_max_values
    description: "Channel 6 type 199, max values bytes, decoded by the vendor's own decoder"
    payload: "06C7FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      radar_signal_rssi: -0.01
