# Milesight IoT EM500-PP
name: milesight_em500_pp
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
        # PRESSURE
        "[3, 123]":
          - name: pressure
            unit: "hPa"
            type: s16

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01755C037B0A00"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 92
      pressure: 10
  - name: vendor_reference_2
    description: "Example declared by the vendor in the TTN device repository"
    payload: "017564037B0A00"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 100
      pressure: 10
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type123_midscale
    description: "Channel 3 type 123, midscale bytes, decoded by the vendor's own decoder"
    payload: "037B1111"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 4369
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type123_zero_values
    description: "Channel 3 type 123, zero values bytes, decoded by the vendor's own decoder"
    payload: "037B0000"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type123_max_values
    description: "Channel 3 type 123, max values bytes, decoded by the vendor's own decoder"
    payload: "037BFFFF"
    fPort: 85
    source: vendor-codec
    expected:
      pressure: -1
