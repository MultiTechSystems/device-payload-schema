# Milesight IoT GS301
name: milesight_gs301
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: {1: "on", default: "on"}
            # raw: readOnOffStatus(1)
        # LORAWAN CLASS
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # PRODUCT SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "%"}
            semantic: "battery"
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE
        "[2, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # HUMIDITY
        "[3, 104]":
          - name: humidity
            unit: "%"
            sensor: humidity
            ipso: {object: 3304, instance: 0, resource: 5700}
            senml: {name: "humidity", unit: "%RH"}
            semantic: "humidity"
            type: u8
            div: 2
            # raw: readUInt8(bytes[i]) / 2
        # NH3
        "[4, 125]":
          # One 16-bit little-endian word. 0xFFFE and 0xFFFF are status codes: the
          # status peeks at the word through a bit range without consuming it, and a
          # mapping miss omits it. Only 0xFFFF is mapped: its bytes read the same in
          # either order, while the interpreter reads a bit range's base big-endian
          # and the TS013 generator in the schema's order, so 0xFFFE ("polarizing")
          # cannot be mapped portably and is left to the formula below.
          # formula: readSensorStatus(raw) -> 0xFFFE "polarizing", 0xFFFF "device error"
          # formula: the vendor reports nh3 only when the word is not a status
          # code; this schema still reports nh3 (655.34 or 655.35 scaled) beside
          # the status, because a `match` inside a tlv case is not decoded by the
          # Python interpreter.
          - name: nh3_sensor_status
            type: u16[0:15]
            consume: 0
            sensor: none
            lookup: {65535: "device error"}
            # raw: readSensorStatus(nh3_raw_data)
          - name: nh3
            type: u16
            div: 100
            # raw: nh3_raw_data / 100
        # H2S
        "[5, 125]":
          # One 16-bit little-endian word. 0xFFFE and 0xFFFF are status codes: the
          # status peeks at the word through a bit range without consuming it, and a
          # mapping miss omits it. Only 0xFFFF is mapped: its bytes read the same in
          # either order, while the interpreter reads a bit range's base big-endian
          # and the TS013 generator in the schema's order, so 0xFFFE ("polarizing")
          # cannot be mapped portably and is left to the formula below.
          # formula: readSensorStatus(raw) -> 0xFFFE "polarizing", 0xFFFF "device error"
          # formula: the vendor reports h2s only when the word is not a status
          # code; this schema still reports h2s (655.34 or 655.35 scaled) beside
          # the status, because a `match` inside a tlv case is not decoded by the
          # Python interpreter.
          - name: h2s_sensor_status
            type: u16[0:15]
            consume: 0
            sensor: none
            lookup: {65535: "device error"}
            # raw: readSensorStatus(h2s_raw_data)
          - name: h2s
            type: u16
            div: 100
            # raw: h2s_raw_data / 100
        # H2S (@since v1.2)
        "[6, 125]":
          # One 16-bit little-endian word. 0xFFFE and 0xFFFF are status codes: the
          # status peeks at the word through a bit range without consuming it, and a
          # mapping miss omits it. Only 0xFFFF is mapped: its bytes read the same in
          # either order, while the interpreter reads a bit range's base big-endian
          # and the TS013 generator in the schema's order, so 0xFFFE ("polarizing")
          # cannot be mapped portably and is left to the formula below.
          # formula: readSensorStatus(raw) -> 0xFFFE "polarizing", 0xFFFF "device error"
          # formula: the vendor reports h2s only when the word is not a status
          # code; this schema still reports h2s (655.34 or 655.35 scaled) beside
          # the status, because a `match` inside a tlv case is not decoded by the
          # Python interpreter.
          - name: h2s_sensor_status
            type: u16[0:15]
            consume: 0
            sensor: none
            lookup: {65535: "device error"}
            # raw: readSensorStatus(h2s_raw_data)
          - name: h2s
            type: u16
            div: 1000
            # raw: h2s_raw_data / 1000
        # SENSOR CALIBRATION RESULT (@since v1.2)
        "[7, 234]":
          - name: nh3_calibration_result
            type: u8
            # raw: {
        # SENSOR ID (@since v1.2)
        "[255, 124]":
          - name: sensor_id
            type: ascii
            length: 43
            # raw: readAscii(bytes.slice(i, i + 43))

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch2_type103_midscale
    description: "Channel 2 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "02671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 436.9
  - name: ch3_type104_midscale
    description: "Channel 3 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "036811"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch2_type103_max_values
    description: "Channel 2 type 103, max values bytes, decoded by the vendor's own decoder"
    payload: "0267FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -0.1
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: nh3_u16_word
    description: "NH3 is one 16-bit little-endian word scaled /100"
    payload: "047D1102"
    fPort: 85
    source: vendor-codec
    expected:
      nh3: 5.29
  - name: nh3_u16_high_word
    description: "NH3 near the top of the word: 0xFEFF is a reading, not a status code"
    payload: "047DFFFE"
    fPort: 85
    source: vendor-codec
    expected:
      nh3: 652.79
  - name: h2s_u16_word
    description: "H2S (channel 5) is one 16-bit little-endian word scaled /100"
    payload: "057D3412"
    fPort: 85
    source: vendor-codec
    expected:
      h2s: 46.6
  - name: h2s_v12_u16_word
    description: "H2S (channel 6, v1.2) is one 16-bit little-endian word scaled /1000"
    payload: "067D3412"
    fPort: 85
    source: vendor-codec
    expected:
      h2s: 4.66
  - name: sensor_id_43_bytes
    description: "Sensor ID is 43 ASCII bytes, followed here by a battery channel to prove alignment"
    payload: "047D3412FF7C47533330312D4E48332D303132333435363738394142434445464748494A4B4C4D4E4F5051525354555657017564"
    fPort: 85
    source: vendor-codec
    expected:
      nh3: 46.6
      sensor_id: "GS301-NH3-0123456789ABCDEFGHIJKLMNOPQRSTUVW"
      battery: 100
