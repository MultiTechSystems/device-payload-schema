# Milesight IoT WS51x
name: milesight_ws515
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            sensor: none
            lookup: {1: "reset", default: "reset"}
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: {1: "on", default: "on"}
            # raw: readDeviceStatus(1)
        # VOLTAGE
        "[3, 116]":
          - name: voltage
            type: u16
            div: 10
        # ACTIVE POWER
        "[4, 128]":
          - name: active_power
            type: u32
        # POWER FACTOR
        "[5, 129]":
          - name: power_factor
            type: u8
            # raw: readUInt8(bytes[i])
        # POWER CONSUMPTION
        "[6, 131]":
          - name: power_consumption
            type: u32
        # CURRENT
        "[7, 201]":
          - name: current
            type: u16
        # STATE
        "[8, 112]":
          - name: socket_status
            type: u8
            sensor: none
            lookup: ["off", "on"]
            # raw: readSocketStatus(bytes[i])
        # TEMPERATURE (@since v1.9)
        "[9, 103]":
          # One 16-bit little-endian word. 0xFFFD and 0xFFFF are status codes: the
          # status peeks at the word through a bit range without consuming it, and a
          # mapping miss omits it. Only 0xFFFF is mapped: its bytes read the same in
          # either order, while the interpreter reads a bit range's base big-endian
          # and the TS013 generator in the schema's order, so 0xFFFD cannot be
          # mapped portably.
          # formula: raw == 0xFFFD -> temperature_sensor_status "over range
          #   alarm"; raw == 0xFFFF -> temperature_sensor_status "read
          #   failed"; otherwise temperature. The vendor reports temperature
          #   only for a non-status word; this schema still reports it beside
          #   the status, because a `match` inside a tlv case is not decoded
          #   by the Python interpreter.
          - name: temperature_sensor_status
            type: u16[0:15]
            consume: 0
            sensor: none
            lookup: {65535: "read failed"}
            # raw: readSensorStatus(1) / readSensorStatus(2)
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
        # TEMPERATURE THRESHOLD ALARM (@since v2.1)
        "[137, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            sensor: none
            lookup: ["threshold alarm release", "threshold alarm", "overheat alarm", "mutation alarm"]
            # raw: readTemperatureAlarm(bytes[i + 2])
        # TEMPERATURE MUTATION ALARM (@since v1.9 @deprecated v2.1)
        "[153, 103]":
          - name: temperature
            unit: "°C"
            sensor: temperature
            ipso: {object: 3303, instance: 0, resource: 5700}
            senml: {name: "temperature", unit: "Cel"}
            semantic: "temperature"
            type: s16
            div: 10
          - name: temperature_mutation
            type: s16
            div: 10
          - name: temperature_alarm
            type: u8
            sensor: none
            lookup: ["threshold alarm release", "threshold alarm", "overheat alarm", "mutation alarm"]
            # raw: readTemperatureAlarm(3)

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "08700105816107C9A8000374830806831D000000048023000000"
    fPort: 85
    source: vendor-doc
    expected:
      socket_status: "on"
      power_factor: 97
      current: 168
      voltage: 217.9
      power_consumption: 29
      active_power: 35
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch3_type116_midscale
    description: "Channel 3 type 116, midscale bytes, decoded by the vendor's own decoder"
    payload: "03741111"
    fPort: 85
    source: vendor-codec
    expected:
      voltage: 436.9
  - name: ch4_type128_midscale
    description: "Channel 4 type 128, midscale bytes, decoded by the vendor's own decoder"
    payload: "048011111111"
    fPort: 85
    source: vendor-codec
    expected:
      active_power: 286331153
  - name: ch5_type129_midscale
    description: "Channel 5 type 129, midscale bytes, decoded by the vendor's own decoder"
    payload: "058111"
    fPort: 85
    source: vendor-codec
    expected:
      power_factor: 17
  - name: ch6_type131_midscale
    description: "Channel 6 type 131, midscale bytes, decoded by the vendor's own decoder"
    payload: "068311111111"
    fPort: 85
    source: vendor-codec
    expected:
      power_consumption: 286331153
  - name: ch7_type201_midscale
    description: "Channel 7 type 201, midscale bytes, decoded by the vendor's own decoder"
    payload: "07C91111"
    fPort: 85
    source: vendor-codec
    expected:
      current: 4369
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch3_type116_zero_values
    description: "Channel 3 type 116, zero values bytes, decoded by the vendor's own decoder"
    payload: "03740000"
    fPort: 85
    source: vendor-codec
    expected:
      voltage: 0
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
  - name: power_on_reset_event
    description: "Reset-event frame: the vendor reports reset_event 'reset' whatever the byte holds"
    payload: "FFFEFF"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: temperature_s16_word
    description: "Temperature channel is one signed 16-bit word scaled /10"
    payload: "0967F000"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: 24
  - name: temperature_s16_negative
    description: "Temperature channel, negative reading"
    payload: "0967F0FF"
    fPort: 85
    source: vendor-codec
    expected:
      temperature: -1.6
