# Milesight IoT TS302
name: milesight_ts30x
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            lookup: ["normal", "reset"]
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            lookup: ["off", "on"]
            # raw: readDeviceStatus(1)
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
            # raw: readUInt8(bytes[i])
        # TEMPERATURE(CHANNEL 1 SENSOR)
        "[3, 103]":
          - name: temperature_chn1
            type: s16
            div: 10
        # MAGNET STATUS(CHANNEL 1 SENSOR)
        "[3, 0]":
          - name: magnet_chn1
            type: u8
            lookup: ["close", "open"]
            # raw: readMagnetStatus(bytes[i])
        # TEMPERATURE(CHANNEL 2 SENSOR)
        "[4, 103]":
          - name: temperature_chn2
            type: s16
            div: 10
        # MAGNET STATUS(CHANNEL 2 SENSOR)
        "[4, 0]":
          - name: magnet_chn2
            type: u8
            lookup: ["close", "open"]
            # raw: readMagnetStatus(bytes[i])
        # TEMPERATURE(CHANNEL 1 SENSOR) ALARM
        "[131, 103]":
          - name: temperature_chn1
            type: s16
            div: 10
          - name: temperature_chn1_alarm
            type: u8
            lookup: ["threshold_alarm_release", "threshold_alarm", "mutation_alarm"]
            # raw: readAlarmType(bytes[i + 2])
        # TEMPERATURE(CHANNEL 1 SENSOR) ALARM
        "[147, 215]":
          - name: temperature_chn1
            type: s16
            div: 10
          - name: temperature_chn1_mutation
            type: s16
            div: 100
          - name: temperature_chn1_alarm
            type: u8
            lookup: ["threshold_alarm_release", "threshold_alarm", "mutation_alarm"]
            # raw: readAlarmType(bytes[i + 4])
        # TEMPERATURE(CHANNEL 2 SENSOR) ALARM
        "[132, 103]":
          - name: temperature_chn2
            type: s16
            div: 10
          - name: temperature_chn2_alarm
            type: u8
            lookup: ["threshold_alarm_release", "threshold_alarm", "mutation_alarm"]
            # raw: readAlarmType(bytes[i + 2])
        # TEMPERATURE(CHANNEL 2 SENSOR) ALARM
        "[148, 215]":
          - name: temperature_chn2
            type: s16
            div: 10
          - name: temperature_chn2_mutation
            type: s16
            div: 100
          - name: temperature_chn2_alarm
            type: u8
            lookup: ["threshold_alarm_release", "threshold_alarm", "mutation_alarm"]
            # raw: readAlarmType(bytes[i + 4])

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "0175640367FB0004670101"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 100
      temperature_chn1: 25.1
      temperature_chn2: 25.7
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type103_midscale
    description: "Channel 3 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "03671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature_chn1: 436.9
  - name: ch4_type103_midscale
    description: "Channel 4 type 103, midscale bytes, decoded by the vendor's own decoder"
    payload: "04671111"
    fPort: 85
    source: vendor-codec
    expected:
      temperature_chn2: 436.9
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
