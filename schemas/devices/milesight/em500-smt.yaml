# Milesight IoT EM500-SMTC
name: milesight_em500_smt
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # HUMIDITY
        "[4, 104]":
          - name: humidity
            type: u8
            div: 2
        "[4, 202]":
          - name: humidity
            type: u8
            div: 2

test_vectors:
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch4_type104_midscale
    description: "Channel 4 type 104, midscale bytes, decoded by the vendor's own decoder"
    payload: "046811"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch4_type202_midscale
    description: "Channel 4 type 202, midscale bytes, decoded by the vendor's own decoder"
    payload: "04CA11"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 8.5
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch4_type104_zero_values
    description: "Channel 4 type 104, zero values bytes, decoded by the vendor's own decoder"
    payload: "046800"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 0
  - name: ch4_type202_zero_values
    description: "Channel 4 type 202, zero values bytes, decoded by the vendor's own decoder"
    payload: "04CA00"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch4_type104_max_values
    description: "Channel 4 type 104, max values bytes, decoded by the vendor's own decoder"
    payload: "0468FF"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 127.5
  - name: ch4_type202_max_values
    description: "Channel 4 type 202, max values bytes, decoded by the vendor's own decoder"
    payload: "04CAFF"
    fPort: 85
    source: vendor-codec
    expected:
      humidity: 127.5
