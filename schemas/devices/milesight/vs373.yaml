# Milesight IoT VS373
name: milesight_vs373
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            sensor: none
            lookup: ["off", "on"]
            # raw: readDeviceStatus(bytes[i])
        # LORAWAN CLASS
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # PRODUCT SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # DETECTION TARGET (v1.0.1)
        "[3, 248]":
          - name: detection_status
            type: u8
            sensor: none
            lookup: ["normal", "vacant", "in_bed", "out_of_bed", "fall"]
            # raw: readDetectionStatus(bytes[i])
          - name: target_status
            type: u8
            sensor: none
            lookup: ["normal", "motionless", "abnormal", "lying_down"]
            # raw: readTargetStatus(bytes[i + 1])
          - name: use_time_now
            type: u16
          - name: use_time_today
            type: u16
        # DETECTION TARGET (v1.0.2)
        "[7, 176]":
          - name: detection_status
            type: u8
            sensor: none
            lookup: ["normal", "vacant", "in_bed", "out_of_bed", "fall"]
            # raw: readDetectionStatus(bytes[i])
          - name: target_status
            type: u8
            sensor: none
            lookup: ["normal", "motionless", "abnormal", "lying_down"]
            # raw: readTargetStatus(bytes[i + 1])
          - name: use_time_now
            type: u8
            # raw: readUInt24LE(bytes.slice(i + 2, i + 5))
          - name: use_time_today
            type: u8
            # raw: readUInt24LE(bytes.slice(i + 5, i + 8))
        # REGION OCCUPANCY (v1.0.1)
        "[4, 249]":
          - name: region_1_occupancy
            type: u8
            lookup: ["vacant", "occupied"]
            # raw: readOccupancyStatus(bytes[i] === 1 ? 0 : 1)
          - name: region_2_occupancy
            type: u8
            lookup: ["vacant", "occupied"]
            # raw: readOccupancyStatus(bytes[i + 1] === 1 ? 0 : 1)
          - name: region_3_occupancy
            type: u8
            lookup: ["vacant", "occupied"]
            # raw: readOccupancyStatus(bytes[i + 2] === 1 ? 0 : 1)
          - name: region_4_occupancy
            type: u8
            lookup: ["vacant", "occupied"]
            # raw: readOccupancyStatus(bytes[i + 3] === 1 ? 0 : 1)
        # OUT OF BED (v1.0.1)
        "[5, 250]":
          - name: region_1_out_of_bed_time
            type: u16
          - name: region_2_out_of_bed_time
            type: u16
          - name: region_3_out_of_bed_time
            type: u16
          - name: region_4_out_of_bed_time
            type: u16
        # OUT OF BED (v1.0.2) - REGION 1-3
        "[11, 180]":
          - name: region_1_out_of_bed_time
            type: u8
            # raw: readUInt24LE(bytes.slice(i, i + 3))
          - name: region_2_out_of_bed_time
            type: u8
            # raw: readUInt24LE(bytes.slice(i + 3, i + 6))
          - name: region_3_out_of_bed_time
            type: u8
            # raw: readUInt24LE(bytes.slice(i + 6, i + 9))
        # OUT OF BED (v1.0.2) - REGION 4-6
        "[12, 180]":
          - name: region_4_out_of_bed_time
            type: u8
            # raw: readUInt24LE(bytes.slice(i, i + 3))
          - name: region_5_out_of_bed_time
            type: u8
            # raw: readUInt24LE(bytes.slice(i + 3, i + 6))
          - name: region_6_out_of_bed_time
            type: u8
            # raw: readUInt24LE(bytes.slice(i + 6, i + 9))
        # BREATHING DETECTION
        "[8, 177]":
          - name: respiratory_status
            type: u8
            # raw: readBreathStatus(bytes[i])
          - name: respiratory_rate
            type: u16
            div: 100

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch5_type250_midscale
    description: "Channel 5 type 250, midscale bytes, decoded by the vendor's own decoder"
    payload: "05FA1111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      region_1_out_of_bed_time: 4369
      region_2_out_of_bed_time: 4369
      region_3_out_of_bed_time: 4369
      region_4_out_of_bed_time: 4369
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type11_zero_values
    description: "Channel 255 type 11, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0B00"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "off"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch3_type248_zero_values
    description: "Channel 3 type 248, zero values bytes, decoded by the vendor's own decoder"
    payload: "03F8000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      detection_status: "normal"
      target_status: "normal"
      use_time_now: 0
      use_time_today: 0
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
