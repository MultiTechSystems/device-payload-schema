# Milesight IoT EM500-SWL
name: milesight_em500_swl
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            type: u8
        # WATER LEVEL
        "[3, 119]":
          - name: distance
            type: u16

test_vectors:
  - name: vendor_reference
    description: "Example declared by the vendor in the TTN device repository"
    payload: "01755C03770200"
    fPort: 85
    source: vendor-doc
    expected:
      battery: 92
      distance: 2
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type119_midscale
    description: "Channel 3 type 119, midscale bytes, decoded by the vendor's own decoder"
    payload: "03771111"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 4369
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch3_type119_zero_values
    description: "Channel 3 type 119, zero values bytes, decoded by the vendor's own decoder"
    payload: "03770000"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 0
  - name: ch1_type117_max_values
    description: "Channel 1 type 117, max values bytes, decoded by the vendor's own decoder"
    payload: "0175FF"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 255
  - name: ch3_type119_max_values
    description: "Channel 3 type 119, max values bytes, decoded by the vendor's own decoder"
    payload: "0377FFFF"
    fPort: 85
    source: vendor-codec
    expected:
      distance: 65535
