# Milesight IoT WS136 / WS156
name: milesight_ws156
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            sensor: percentage
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "/100"}
            semantic: "battery"
            type: u8
test_vectors:
  # Battery channel 01 75, decoded by the vendor decoder (ws156.js).
  - name: vendor_battery_channel
    description: "Battery channel, decoded by the vendor's own decoder"
    source: vendor-codec
    fPort: 85
    payload: "01755A"
    expected:
      battery: 90
