# Milesight IoT EM310-TILT
name: milesight_em310_tilt
version: 1
endian: little

fields:
  - tlv:
      tag_fields:
        - name: channel_id
          type: u8
        - name: channel_type
          type: u8
      tag_key: [channel_id, channel_type]
      cases:
        # IPSO VERSION
        "[255, 1]":
          - name: ipso_version
            type: bitfield_string
            length: 1
            parts: [[4, 4, decimal], [0, 4, decimal]]
            prefix: "v"
            # raw: readProtocolVersion(bytes[i])
        # HARDWARE VERSION
        "[255, 9]":
          - name: hardware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [12, 4, decimal]]
            prefix: "v"
            # raw: readHardwareVersion(bytes.slice(i, i + 2))
        # FIRMWARE VERSION
        "[255, 10]":
          - name: firmware_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, hex], [8, 8, hex]]
            prefix: "v"
            # raw: readFirmwareVersion(bytes.slice(i, i + 2))
        # TSL VERSION
        "[255, 255]":
          - name: tsl_version
            type: bitfield_string
            length: 2
            parts: [[0, 8, decimal], [8, 8, decimal]]
            prefix: "v"
            # raw: readTslVersion(bytes.slice(i, i + 2))
        # SERIAL NUMBER
        "[255, 22]":
          - name: sn
            type: hex
            length: 8
            # raw: readSerialNumber(bytes.slice(i, i + 8))
        # LORAWAN CLASS TYPE
        "[255, 15]":
          - name: lorawan_class
            type: u8
            lookup: ["Class A", "Class B", "Class C", "Class CtoB"]
            # raw: readLoRaWANClass(bytes[i])
        # RESET EVENT
        "[255, 254]":
          - name: reset_event
            type: u8
            lookup: {1: "reset", default: "reset"}
            # raw: readResetEvent(1)
        # DEVICE STATUS
        "[255, 11]":
          - name: device_status
            type: u8
            lookup: {1: "on", default: "on"}
            # raw: readDeviceStatus(1)
        # ANGLE ALARM CONDITION (downlink response, channel 0xFE or 0xFF)
        # The vendor reads it under either channel; an encoder writes the first, 0xFF.
        "[255, 99]":
          - name: angle_alarm_condition
            type: ascii
            length: 8
            nul: stop
            charset: utf-8
            # raw: readUtf8(bytes.slice(offset, offset + 8)), which stops at 0x00
        "[254, 99]":
          - name: angle_alarm_condition
            type: ascii
            length: 8
            nul: stop
            charset: utf-8
            # raw: readUtf8(bytes.slice(offset, offset + 8)), which stops at 0x00
        # BATTERY
        "[1, 117]":
          - name: battery
            unit: "%"
            ipso: {object: 3320, instance: 0, resource: 5700}
            senml: {name: "battery", unit: "/100"}
            type: u8
            # raw: readUInt8(bytes[i])
        # ANGLE
        "[3, 207]":
          - name: angle_x
            type: s16
            div: 100
          - name: angle_y
            type: s16
            div: 100
          - name: angle_z
            type: s16
            div: 100
          - name: threshold_x
            type: u8[0:0]
            lookup: ["normal", "trigger"]
            # raw: readAngleStatus((threshold_value >>> 0) & 0x01)
          - name: threshold_y
            type: u8[1:1]
            lookup: ["normal", "trigger"]
            # raw: readAngleStatus((threshold_value >>> 1) & 0x01)
          - name: threshold_z
            type: u8[2:2]
            lookup: ["normal", "trigger"]
            # raw: readAngleStatus((threshold_value >>> 2) & 0x01)

            consume: 1

test_vectors:
  - name: ch255_type1_midscale
    description: "Channel 255 type 1, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0111"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v1.1"
  - name: ch255_type9_midscale
    description: "Channel 255 type 9, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF091111"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v11.1"
  - name: ch255_type10_midscale
    description: "Channel 255 type 10, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF0A1111"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v11.11"
  - name: ch255_type255_midscale
    description: "Channel 255 type 255, midscale bytes, decoded by the vendor's own decoder"
    payload: "FFFF1111"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v17.17"
  - name: ch255_type22_midscale
    description: "Channel 255 type 22, midscale bytes, decoded by the vendor's own decoder"
    payload: "FF161111111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "1111111111111111"
  - name: ch1_type117_midscale
    description: "Channel 1 type 117, midscale bytes, decoded by the vendor's own decoder"
    payload: "017511"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 17
  - name: ch3_type207_midscale
    description: "Channel 3 type 207, midscale bytes, decoded by the vendor's own decoder"
    # The value is seven bytes; the vector harvester padded it to nine, so the last two
    # read as an undescribed channel. Trimmed; em310-tilt.js gives the same output.
    payload: "03CF11111111111111"
    fPort: 85
    source: vendor-codec
    expected:
      angle_x: 43.69
      angle_y: 43.69
      angle_z: 43.69
      threshold_x: "trigger"
      threshold_y: "normal"
      threshold_z: "normal"
    expected_warnings: []
  - name: ch255_type1_zero_values
    description: "Channel 255 type 1, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0100"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v0.0"
  - name: ch255_type9_zero_values
    description: "Channel 255 type 9, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF090000"
    fPort: 85
    source: vendor-codec
    expected:
      hardware_version: "v0.0"
  - name: ch255_type10_zero_values
    description: "Channel 255 type 10, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0A0000"
    fPort: 85
    source: vendor-codec
    expected:
      firmware_version: "v0.0"
  - name: ch255_type255_zero_values
    description: "Channel 255 type 255, zero values bytes, decoded by the vendor's own decoder"
    payload: "FFFF0000"
    fPort: 85
    source: vendor-codec
    expected:
      tsl_version: "v0.0"
  - name: ch255_type22_zero_values
    description: "Channel 255 type 22, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF160000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      sn: "0000000000000000"
  - name: ch255_type15_zero_values
    description: "Channel 255 type 15, zero values bytes, decoded by the vendor's own decoder"
    payload: "FF0F00"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class A"
  - name: ch1_type117_zero_values
    description: "Channel 1 type 117, zero values bytes, decoded by the vendor's own decoder"
    payload: "017500"
    fPort: 85
    source: vendor-codec
    expected:
      battery: 0
  - name: ch255_type1_max_values
    description: "Channel 255 type 1, max values bytes, decoded by the vendor's own decoder"
    payload: "FF01FF"
    fPort: 85
    source: vendor-codec
    expected:
      ipso_version: "v15.15"
  - name: power_on_reset_event
    description: "Reset-event frame: the vendor reports reset_event 'reset' whatever the byte holds"
    payload: "FFFEFF"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: power_on_device_status
    description: "Power-on frame: the vendor reports device_status 'on' whatever the byte holds"
    payload: "FF0BFF"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: reset_event_byte_one
    description: "Reset-event frame with the byte 0x01, the index the vendor's own map labels 'reset'"
    payload: "FFFE01"
    fPort: 85
    source: vendor-codec
    expected:
      reset_event: "reset"
  - name: device_status_byte_one
    description: "Device-status frame with the byte 0x01, the index the vendor's own map labels 'on'"
    payload: "FF0B01"
    fPort: 85
    source: vendor-codec
    expected:
      device_status: "on"
  - name: lorawan_class_b
    description: "LoRaWAN class byte 0x01"
    payload: "FF0F01"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class B"
  - name: lorawan_class_c
    description: "LoRaWAN class byte 0x02"
    payload: "FF0F02"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class C"
  - name: lorawan_class_ctob
    description: "LoRaWAN class byte 0x03"
    payload: "FF0F03"
    fPort: 85
    source: vendor-codec
    expected:
      lorawan_class: "Class CtoB"
  - name: angles_threshold_y
    description: "Angle words 0x1234/0xFEDC/0x0456 little-endian, threshold byte 0x02 sets Y alone"
    payload: "03CF3412DCFE560402"
    fPort: 85
    source: vendor-codec
    expected:
      angle_x: 46.6
      angle_y: -2.92
      angle_z: 11.1
      threshold_x: "normal"
      threshold_y: "trigger"
      threshold_z: "normal"
  - name: angles_threshold_z
    description: "Angle words with threshold byte 0x04 setting Z alone"
    payload: "03CF3412DCFE560404"
    fPort: 85
    source: vendor-codec
    expected:
      angle_x: 46.6
      angle_y: -2.92
      angle_z: 11.1
      threshold_x: "normal"
      threshold_y: "normal"
      threshold_z: "trigger"
  - name: angle_alarm_condition_ascii
    description: "Channel 0xFF type 0x63: eight bytes of UTF-8 text padded with 0x00, beside a battery channel"
    payload: "FF63783E333000000000017564"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "x>30"
      battery: 100
    expected_warnings: []
  - name: angle_alarm_condition_two_byte_characters
    description: "Channel 0xFF type 0x63 holding U+00C5 and U+00B0, two UTF-8 bytes each"
    payload: "FF63C3856E6700000000"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "Ång"
  - name: angle_alarm_condition_degree_sign
    description: "Channel 0xFF type 0x63: x>30 followed by U+00B0"
    payload: "FF63783E3330C2B00000"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "x>30°"
  - name: angle_alarm_condition_three_byte_character
    description: "Channel 0xFF type 0x63 holding U+20AC, three UTF-8 bytes"
    payload: "FF63E282AC3130000000"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "€10"
  - name: angle_alarm_condition_four_byte_character
    description: "Channel 0xFF type 0x63 holding U+1F600, a four-byte UTF-8 character"
    payload: "FF63F09F988000000000"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "\U0001F600"
  - name: angle_alarm_condition_full_length_fe
    description: "Channel 0xFE type 0x63: eight characters and no 0x00, so the whole field is text"
    payload: "FE634142434445464748"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "ABCDEFGH"
  - name: angle_alarm_condition_stops_at_nul
    description: "Channel 0xFF type 0x63: readUtf8 stops at the first 0x00, so the bytes after it are not reported"
    payload: "FF634142000058590000"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: "AB"
  - name: angle_alarm_condition_empty
    description: "Channel 0xFF type 0x63 of eight 0x00 bytes: empty text"
    payload: "FF630000000000000000"
    fPort: 85
    source: vendor-codec
    expected:
      angle_alarm_condition: ""
