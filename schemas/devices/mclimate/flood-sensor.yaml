# MClimate Flood Sensor
name: mclimate_flood_sensor
version: 1
endian: big

fields:
  - byte_group:
      size: 1
      fields:
        - name: reason
          type: u8[5:7]
          lookup:
            0: "keepalive"
            1: "testButtonPressed"
            2: "floodDetected"
            3: "fraudDetected"
        - name: boxTamper
          type: u8[3:3]
        - name: flood
          type: u8[1:1]
  - name: battery
    type: u8
    mult: 0.016
    unit: "V"
  # The vendor decoder (flood-sensor.js) reads a third byte only where the frame has
  # one: a 2-byte frame is the short package, with no temperature (PS-402).
  - name: temperature
    type: u8
    optional: true
    unit: "°C"
    senml: {unit: Cel}
test_vectors:
  - name: vendor_reference_1
    description: "Example declared by the vendor in the TTN device repository"
    source: vendor-doc
    fPort: 2
    payload: "08C9"
    expected:
      reason: "keepalive"
      boxTamper: true
      flood: false
      battery: 3.216
