  70:
    description: "Configuration (VoBoXX)"
    fields:
      - {name: fport, type: number, value: 70, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Configuration"}
      - {name: _cfg_mask, type: number, value: 0}
      - {name: _subgroup, type: "u8[0:3]", consume: 0, var: subgroupID}
      - &cfg_dispatch_xx
        match:
          field: $subgroupID
          default:
            - {name: _unparsed, type: bytes, length: remaining}
          cases:
            0: &cfg_lib_general
              - {name: subgroupID, type: "u8[0:3]"}
              - {name: sequenceNumber, type: "u8[4:7]", consume: 1, var: sequenceNumber}
              - match:
                  field: $sequenceNumber
                  default: skip
                  cases:
                    0:
                      # cycleTime (18 bits over bytes 4-6) is summed in the flagged block below
                      - {name: _cfg_mask, type: "u8[0:7]", consume: 0, mult: 0, add: 1}
                      - {name: transRejoin, type: "u8[0:3]"}
                      - {name: ackFrequency, type: "u8[4:7]", consume: 1}
                      - match:
                          field: $fport
                          default: skip
                          cases:
                            70:
                              - name: lowBattery
                                type: "u8[0:3]"
                                transform: [{add: 25}, {div: 10}]
                                unit: V
                            71:
                              - name: lowBattery
                                type: "u8[0:3]"
                                transform: [{add: 25}, {div: 10}]
                                unit: V
                            72:
                              - name: lowVoltThreshold
                                type: "u8[0:3]"
                                transform: [{add: 25}, {div: 10}]
                                unit: V
                      - {name: reserved1, type: "u8[4:4]"}
                      - {name: heartbeatAckEnable, type: bool, bit: 5}
                      - {name: operationMode, type: "u8[6:6]"}
                      - {name: cycleSubBands, type: bool, bit: 7, consume: 1}
                      - {name: ackRetries, type: "u8[0:2]"}
                      - {name: reservedLL, type: "u8[3:5]"}
                      - {name: ackEnable, type: bool, bit: 6}
                      - {name: heartbeatEnable, type: bool, bit: 7, consume: 1}
                      - {name: _ct_lo, type: u16, endian: little}
                      - {name: _ct_hi, type: "u8[0:1]", mult: 65536}
                      - {name: backOffReset, type: "u8[2:7]", consume: 1}
                      - {name: reservedRD, type: "u8[0:5]"}
                      - {name: reserved2, type: "u8[6:7]", consume: 1}
                      - {name: resendAttempts, type: "u8[0:3]"}
                      - {name: freqSubBand, type: "u8[4:7]", consume: 1}
                    1:
                      - {name: timeSyncInterval, type: u8}
                      # The vendor prints these eight bytes reversed with '-' separators; see the header
                      - {name: joinEUIBytes, type: bytes, length: 8}
                      - {name: joinNonceResetEnable, type: bool, bit: 0}
                      - {name: timeSyncWakeupEnable, type: bool, bit: 1}
                      - {name: reserved1, type: "u8[2:7]", consume: 1}
            1: &cfg_lib_vobosync
              - {name: subgroupID, type: "u8[0:3]"}
              - {name: sequenceNumber, type: "u8[4:7]", consume: 1, var: sequenceNumber}
              - match:
                  field: $sequenceNumber
                  default: skip
                  cases:
                    0:
                      - {name: vbsNodeNumber, type: u16, endian: little}
                      - {name: vbsTimeReference, type: u32, endian: little}
                      - {name: reservedVCPDS, type: "u8[0:3]"}
                      - {name: reservedVMPDS, type: "u8[4:7]", consume: 1}
                      - {name: reservedVUDS, type: "u8[0:3]"}
                      - {name: reserved1, type: "u8[4:5]"}
                      - {name: reservedVSAE, type: bool, bit: 6}
                      - {name: vbsEnable, type: bool, bit: 7, consume: 1}
                      - {name: reserved3, type: "u8[0:5]"}
                      - {name: reserved2, type: "u8[6:7]", consume: 1}
                    1:
                      - {name: vbsMeasurementDelaySec, type: "u8[0:6]", unit: s}
                      - {name: reserved1, type: "u8[7:7]", consume: 1}
                      - {name: vbsUplinkDelaySec, type: "u8[0:6]", unit: s}
                      - {name: reserved2, type: "u8[7:7]", consume: 1}
            4: &cfg_xx_general
              - {name: subgroupID, type: "u8[0:3]"}
              - {name: sequenceNumber, type: "u8[4:7]", consume: 1, var: sequenceNumber}
              - {name: analogVoltage, type: u8, div: 10, unit: V}
              - {name: powerTime, type: u8, div: 10}
              - {name: mbEnable, type: bool, bit: 0}
              - {name: engUnitsEnable, type: bool, bit: 1}
              - {name: din1TransmitEnable, type: bool, bit: 2}
              - {name: din2TransmitEnable, type: bool, bit: 3}
              - {name: din3TransmitEnable, type: bool, bit: 4}
              - {name: wkupTransmitEnable, type: bool, bit: 5}
              - {name: ain1TransmitEnable, type: bool, bit: 6}
              - {name: ain2TransmitEnable, type: bool, bit: 7, consume: 1}
              - {name: ain3TransmitEnable, type: bool, bit: 0}
              - {name: batteryLevelTransmitEnable, type: bool, bit: 1}
              - {name: adcTemperatureTransmitEnable, type: bool, bit: 2}
              - {name: mbTransmitEnable, type: bool, bit: 3}
              - {name: ainPayloadType, type: "u8[4:4]"}
              - {name: reservedMAWE, type: bool, bit: 5}
              - {name: reservedMADE, type: bool, bit: 6}
              - {name: reservedMAME, type: bool, bit: 7, consume: 1}
            5: &cfg_mb_general
              - {name: subgroupID, type: "u8[0:3]"}
              - {name: sequenceNumber, type: "u8[4:7]", consume: 1, var: sequenceNumber}
              - {name: mbTimeout, type: u16, endian: little, unit: ms}
              - {name: mbBaud, type: "u8[0:3]"}
              - {name: mbStopBits, type: "u8[4:5]"}
              - {name: mbParity, type: "u8[6:7]", consume: 1}
              - {name: mbPayloadType, type: "u8[0:1]"}
              - {name: reserved1, type: "u8[2:7]", consume: 1}
            6: &cfg_groups_first
              - {name: subgroupID, type: "u8[0:3]"}
              - {name: sequenceNumber, type: "u8[4:7]", consume: 1, var: sequenceNumber}
              - {name: mbFirstCycleG1, type: bool, bit: 0}
              - {name: mbFirstCycleG2, type: bool, bit: 1}
              - {name: mbFirstCycleG3, type: bool, bit: 2}
              - {name: mbFirstCycleG4, type: bool, bit: 3}
              - {name: mbFirstCycleG5, type: bool, bit: 4}
