# Volley Boast VoBo endpoints: VoBo-GP-1, VoBo-HL-1 (both "VoBoXX"), VoBo-TC, VoBo-XP
#
# Converted from the vendor's TTN decoder, version 2.2.1:
#   TheThingsNetwork/lorawan-devices vendor/volley-boast/vobo-decoder.js
#   (commit 0db7de3, sha256 9691afa4...b860; codec vobo-codec, shared by all four
#   device files: vobo-gp-1.yaml, vobo-hl-1.yaml, vobo-tc.yaml, vobo-xp.yaml)
#
# ONE SCHEMA, NOT ONE PER MODEL. The decoder never looks at the payload to learn the
# model: it dispatches on fPort alone, the tens digit choosing the message and the last
# digit the model (0, and every port below 10, is VoBoXX; 1 is VoBoTC; 2 is VoBoXP; 3-9
# name no model and report voboType ""). All four device files point at the same codec.
# Split per model, the heartbeat, event log and library configuration messages would be
# repeated verbatim in each file while the port still said which model sent them.
#
# Output keys are the vendor's `data` keys. fport, voboType and payloadType are
# constants of the port, so each port declares them as literals (they read no bytes).
#
# How the file is built:
# - A port's `fields:` are its message. The largest shared bodies - the configuration
#   sub-group bodies, the Modbus Generic block table and the engineering-units table -
#   are written once and reused by YAML anchor and alias. Smaller shared messages
#   (heartbeat 2.0, event log) are written out per port instead: Java's YAML reader
#   (SnakeYAML) refuses a document with more than 50 aliases to collections, and this
#   file uses 46. Keep it under 50 when editing.
# - Values the vendor assembles from pieces of several bytes - (b[0] >> 4) | b[1] << 4
#   and the like - are read as separate bit ranges, each scaled into place with `mult`,
#   and summed with `compute`. The bit ranges are never wider than a byte: a multi-byte
#   bit range reads its base big-endian (PS-059), and these values are little-endian.
# - The Python reference interpreter cannot decode a computed (`type: number`) field
#   inside a `match` case. So a configuration message whose values need arithmetic
#   (cycleTime; the VoBo-TC gains and offsets) reads its raw parts as `_` variables in
#   the case, sets a bit in `_cfg_mask`, and a `flagged` block after the dispatch does
#   the arithmetic - the pattern dnt/dnt-lw-wsci.yaml uses for its status report.
#   `_cfg_mask` is set with a non-consuming read scaled to a constant (mult: 0, add: N),
#   because a literal cannot sit in a match case either.
#
# NOT DECODED, and why:
# - Multi-frame reassembly is out of scope: the language decodes one uplink at a time
#   and holds no state between them. Modbus Generic (fPorts 100-109) block type 3 is a
#   fragment of a register block spread over several uplinks. Block type 2, a whole
#   block in one frame, needs no state, but reports its registers as
#   group<g>register1..N with N taken from the frame, and no construct can build N keys
#   from a count. Both are left undecoded: the block ends the frame with a PS-302
#   warning ("unknown TLV tag") and nothing after it is read. Block types 0 and 1 (one
#   and two registers) and the group-0 terminator are decoded.
# - Modbus Standard Variable Length (fPorts 120-129) numbers its slots from the LAST
#   byte of the frame, which no construct can read before the registers it names. Those
#   ports are not declared.
# - fPorts 33-39, 43-49, 53-59 and 113-119 are not declared: the vendor decoder throws
#   on every one ("Invalid VoBo Type"), because no model has a sensor-name table there.
#
# DEVIATIONS from the vendor's output, each forced by the language:
# 1. Digital Inputs (fPorts 50-52). The vendor reports two parallel arrays,
#    digitalSensorStrings (the name of each valid input, e.g. ["WKUP", "DIN1"]) and
#    digitalSensorData (its bit). Here each valid input is its own key, named exactly as
#    the vendor names it, holding its bit: {WKUP: 1, DIN1: 0}. Unnamed inputs keep the
#    vendor's generated name, DigitalSensor<n>, with n the input number.
# 2. Event Log / Notification metadata (fPorts 60-69, 80-89): the vendor's array of five
#    octets is a lowercase hex string here (a `bytes` field, PS-074).
# 3. Library configuration sequence 1: the vendor's joinEUI is the eight wire bytes
#    reversed, upper-case, joined with "-" ("08-07-...-01"). No construct reverses bytes
#    or inserts separators, so this reports joinEUIBytes, the same eight bytes as
#    lower-case hex in wire order (least significant first), a `bytes` field
#    (`hex:upper` is not implemented by the C# interpreter or the TS013 generator). The
#    key is renamed so the wire-order string cannot be mistaken for the vendor's.
# 4. Analog Input Variable Length (fPorts 110-112): the vendor puts each record's labels
#    at top level as analogSensorString<i> / engUnitsString<i> and adds
#    numOfAinPayloads. Here each ainPayloads record carries its own analogSensorString0
#    and engUnitsString0, as a one-input frame does, and numOfAinPayloads (the length of
#    ainPayloads) is not reported.
# 5. Modbus Generic: a group repeated within one frame is collected into an array
#    (PS-157); the vendor keeps the last value.
# 6. Modbus Generic: the vendor stops one byte early (while byteIdx < size - 1), so it
#    ignores a lone trailing byte. Here that byte is read as a block header and the
#    decode fails for want of its register.
#
# VENDOR DEFECTS reproduced or worked around:
# - VoboSync configuration, sequence 0 (sub-group 1), calls Buffer.readUInt32LE on
#   bytes.slice(3, 7). TTN passes input.bytes as a plain Array, which has no such
#   method, so on TTN the vendor decoder throws a TypeError for every such frame. It is
#   decoded here as the code intends (u32, little-endian), and those vectors were taken
#   from the vendor decoder with a Node Buffer as input.
# - Heartbeat 1.0 builds each firmware version number as
#   (b[n+1] & 0x0F) | (b[n] & 0xF0) >> 4 - a bitwise OR of two nibbles in the same
#   position, where a shift was probably meant. It is reproduced exactly (see port 10).
# - Sensor names and units come from the vendor's tables verbatim, typos included
#   ("inHg (20 degC or 68 degF)" for code 2, "inH20" for code 145).
#
# Test vectors: payloads crafted for every port and message, decoded by the vendor's
# decodeUplink under Node with bytes as a plain Array (as TTN passes them), mapped onto
# these keys by deviations 1-4, and kept only where this schema agrees on every key.
name: volley_boast_vobo
version: 1
endian: big
description: "Volley Boast VoBo-GP-1, VoBo-HL-1, VoBo-TC and VoBo-XP (vendor decoder 2.2.1)"
ports:
  1:
    description: "Standard: discrete inputs, three ADCs, battery, temperature, Modbus slot 0"
    fields:
      - {name: fport, type: number, value: 1, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Standard"}
      # byte 0: four discrete inputs, then the low nibble of ADC1
      - name: DIN1
        type: "u8[0:0]"
        ipso: {object: 3200, instance: 1, resource: 5500}
        semantic: digital_input.state
      - name: DIN2
        type: "u8[1:1]"
        ipso: {object: 3200, instance: 2, resource: 5500}
        semantic: digital_input.state
      - name: DIN3
        type: "u8[2:2]"
        ipso: {object: 3200, instance: 3, resource: 5500}
        semantic: digital_input.state
      - name: WKUP
        type: "u8[3:3]"
        ipso: {object: 3200, instance: 0, resource: 5500}
        semantic: digital_input.state
      # 12-bit values packed little-endian across byte boundaries; each part
      # is read as its own byte range and scaled into place, then summed
      - {name: _adc1_lo, type: "u8[4:7]", consume: 1}
      - {name: _adc1_hi, type: u8, mult: 16}
      - {name: ADC1, type: number, compute: {op: add, a: $_adc1_lo, b: $_adc1_hi}}
      - {name: _adc2_lo, type: u8}
      - {name: _adc2_hi, type: "u8[0:3]", mult: 256}
      - {name: _adc3_lo, type: "u8[4:7]", consume: 1}
      - {name: _adc3_hi, type: u8, mult: 16}
      - {name: ADC2, type: number, compute: {op: add, a: $_adc2_lo, b: $_adc2_hi}}
      - {name: ADC3, type: number, compute: {op: add, a: $_adc3_lo, b: $_adc3_hi}}
      # Battery is the 12-bit ADC code times 4 (mV)
      - {name: _bat_lo, type: u8, mult: 4}
      - {name: _bat_hi, type: "u8[0:3]", mult: 1024}
      # Temperature is a 12-bit two's-complement count of 0.125 degC: the vendor's
      # sign branch, (4096 - raw) * -0.125, is what reading the top byte as s8 gives
      - {name: _temp_lo, type: "u8[4:7]", consume: 1, mult: 0.125}
      - {name: _temp_hi, type: s8, mult: 2}
      - name: Battery
        type: number
        compute: {op: add, a: $_bat_lo, b: $_bat_hi}
        unit: mV
        ipso: {object: 3316, instance: 0, resource: 5700}
        semantic: battery.voltage
      - name: Temperature
        type: number
        compute: {op: add, a: $_temp_lo, b: $_temp_hi}
        unit: "°C"
        ipso: {object: 3303, instance: 0, resource: 5700}
        senml: {name: temperature, unit: Cel}
        semantic: device.temperature
      - {name: Modbus0, type: u16, endian: little}
  2:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 2, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus1, type: u16, endian: little}
      - {name: Modbus2, type: u16, endian: little}
      - {name: Modbus3, type: u16, endian: little}
      - {name: Modbus4, type: u16, endian: little}
      - {name: Modbus5, type: u16, endian: little}
  3:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 3, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus6, type: u16, endian: little}
      - {name: Modbus7, type: u16, endian: little}
      - {name: Modbus8, type: u16, endian: little}
      - {name: Modbus9, type: u16, endian: little}
      - {name: Modbus10, type: u16, endian: little}
  4:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 4, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus11, type: u16, endian: little}
      - {name: Modbus12, type: u16, endian: little}
      - {name: Modbus13, type: u16, endian: little}
      - {name: Modbus14, type: u16, endian: little}
      - {name: Modbus15, type: u16, endian: little}
  5:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 5, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus16, type: u16, endian: little}
      - {name: Modbus17, type: u16, endian: little}
      - {name: Modbus18, type: u16, endian: little}
      - {name: Modbus19, type: u16, endian: little}
      - {name: Modbus20, type: u16, endian: little}
  6:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 6, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus21, type: u16, endian: little}
      - {name: Modbus22, type: u16, endian: little}
      - {name: Modbus23, type: u16, endian: little}
      - {name: Modbus24, type: u16, endian: little}
      - {name: Modbus25, type: u16, endian: little}
  7:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 7, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus26, type: u16, endian: little}
      - {name: Modbus27, type: u16, endian: little}
      - {name: Modbus28, type: u16, endian: little}
      - {name: Modbus29, type: u16, endian: little}
      - {name: Modbus30, type: u16, endian: little}
  8:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 8, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus31, type: u16, endian: little}
      - {name: Modbus32, type: u16, endian: little}
      - {name: Modbus33, type: u16, endian: little}
      - {name: Modbus34, type: u16, endian: little}
      - {name: Modbus35, type: u16, endian: little}
  9:
    description: "Modbus Standard: five Modbus slots"
    fields:
      - {name: fport, type: number, value: 9, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Modbus Standard"}
      - {name: Modbus36, type: u16, endian: little}
      - {name: Modbus37, type: u16, endian: little}
      - {name: Modbus38, type: u16, endian: little}
      - {name: Modbus39, type: u16, endian: little}
      - {name: Modbus40, type: u16, endian: little}
  10:
    description: "Heartbeat 1.0"
    fields:
      - {name: fport, type: number, value: 10, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Heartbeat 1.0"}
      - {name: _bat_lo, type: u8, mult: 4}
      - {name: _bat_hi, type: "u8[0:3]", mult: 1024}
      - name: batteryLevelMV
        type: number
        compute: {op: add, a: $_bat_lo, b: $_bat_hi}
        unit: mV
        ipso: {object: 3316, instance: 0, resource: 5700}
        semantic: battery.voltage
      # fwVersionMajor = (b2 & 0x0F) | (b1 & 0xF0) >> 4, and minor/patch likewise:
      # a bitwise OR of two nibbles in the same position, not a shift. The
      # language has no OR, so each result bit is 1 when either source bit is
      # (a guard on the second source) and the four bits are summed.
      # Bytes 1-4: each high nibble is the `b` source of one version number and
      # the next byte's low nibble its `a` source.
      - {name: _maj_b0, type: "u8[4:4]"}
      - {name: _maj_b1, type: "u8[5:5]"}
      - {name: _maj_b2, type: "u8[6:6]"}
      - {name: _maj_b3, type: "u8[7:7]", consume: 1}
      - {name: _maj_a0, type: "u8[0:0]"}
      - {name: _maj_a1, type: "u8[1:1]", mult: 2}
      - {name: _maj_a2, type: "u8[2:2]", mult: 4}
      - {name: _maj_a3, type: "u8[3:3]", mult: 8}
      - {name: _min_b0, type: "u8[4:4]"}
      - {name: _min_b1, type: "u8[5:5]"}
      - {name: _min_b2, type: "u8[6:6]"}
      - {name: _min_b3, type: "u8[7:7]", consume: 1}
      - {name: _min_a0, type: "u8[0:0]"}
      - {name: _min_a1, type: "u8[1:1]", mult: 2}
      - {name: _min_a2, type: "u8[2:2]", mult: 4}
      - {name: _min_a3, type: "u8[3:3]", mult: 8}
      - {name: _pat_b0, type: "u8[4:4]"}
      - {name: _pat_b1, type: "u8[5:5]"}
      - {name: _pat_b2, type: "u8[6:6]"}
      - {name: _pat_b3, type: "u8[7:7]", consume: 1}
      - {name: _pat_a0, type: "u8[0:0]"}
      - {name: _pat_a1, type: "u8[1:1]", mult: 2}
      - {name: _pat_a2, type: "u8[2:2]", mult: 4}
      - {name: _pat_a3, type: "u8[3:3]", mult: 8}
      - {name: fwVersionCustom, type: "u8[4:7]", consume: 1}
      - name: _maj_o0
        type: number
        ref: $_maj_a0
        guard: {when: [{field: $_maj_b0, eq: 0}], else: 1}
      - name: _maj_o1
        type: number
        ref: $_maj_a1
        guard: {when: [{field: $_maj_b1, eq: 0}], else: 2}
      - name: _maj_o2
        type: number
        ref: $_maj_a2
        guard: {when: [{field: $_maj_b2, eq: 0}], else: 4}
      - name: _maj_o3
        type: number
        ref: $_maj_a3
        guard: {when: [{field: $_maj_b3, eq: 0}], else: 8}
      - {name: _maj_lo, type: number, compute: {op: add, a: $_maj_o0, b: $_maj_o1}}
      - {name: _maj_hi, type: number, compute: {op: add, a: $_maj_o2, b: $_maj_o3}}
      - {name: fwVersionMajor, type: number, compute: {op: add, a: $_maj_lo, b: $_maj_hi}}
      - name: _min_o0
        type: number
        ref: $_min_a0
        guard: {when: [{field: $_min_b0, eq: 0}], else: 1}
      - name: _min_o1
        type: number
        ref: $_min_a1
        guard: {when: [{field: $_min_b1, eq: 0}], else: 2}
      - name: _min_o2
        type: number
        ref: $_min_a2
        guard: {when: [{field: $_min_b2, eq: 0}], else: 4}
      - name: _min_o3
        type: number
        ref: $_min_a3
        guard: {when: [{field: $_min_b3, eq: 0}], else: 8}
      - {name: _min_lo, type: number, compute: {op: add, a: $_min_o0, b: $_min_o1}}
      - {name: _min_hi, type: number, compute: {op: add, a: $_min_o2, b: $_min_o3}}
      - {name: fwVersionMinor, type: number, compute: {op: add, a: $_min_lo, b: $_min_hi}}
      - name: _pat_o0
        type: number
        ref: $_pat_a0
        guard: {when: [{field: $_pat_b0, eq: 0}], else: 1}
      - name: _pat_o1
        type: number
        ref: $_pat_a1
        guard: {when: [{field: $_pat_b1, eq: 0}], else: 2}
      - name: _pat_o2
        type: number
        ref: $_pat_a2
        guard: {when: [{field: $_pat_b2, eq: 0}], else: 4}
      - name: _pat_o3
        type: number
        ref: $_pat_a3
        guard: {when: [{field: $_pat_b3, eq: 0}], else: 8}
      - {name: _pat_lo, type: number, compute: {op: add, a: $_pat_o0, b: $_pat_o1}}
      - {name: _pat_hi, type: number, compute: {op: add, a: $_pat_o2, b: $_pat_o3}}
      - {name: fwVersionPatch, type: number, compute: {op: add, a: $_pat_lo, b: $_pat_hi}}
      - {name: recSignalLevels, type: u8, mult: -1, unit: dBm}
      - {name: analogVoltageConfig, type: "u8[0:4]", sensor: none}
      - {name: _apt_lo, type: "u8[5:7]", consume: 1}
      - {name: _apt_hi, type: "u8[0:4]", mult: 8}
      - {name: _ftr_lo, type: "u8[5:7]", consume: 1}
      - {name: _ftr_hi, type: "u8[0:0]", mult: 8}
      - {name: cycleThroughFSB, type: "u8[1:1]"}
      - {name: ackEnable, type: "u8[2:2]"}
      - {name: ackFreq, type: "u8[3:6]"}
      - {name: _ackreq_lo, type: "u8[7:7]", consume: 1}
      - {name: _ackreq_hi, type: "u8[0:2]", mult: 2}
      - {name: _blt_lo, type: "u8[3:7]", consume: 1, mult: 4}
      - {name: _blt_hi, type: "u8[0:6]", consume: 1, mult: 128}
      - {name: _apt, type: number, compute: {op: add, a: $_apt_lo, b: $_apt_hi}}
      - name: analogPowerTimeConfig
        type: number
        compute: {op: div, a: $_apt, b: 10}
        sensor: none
      - name: failedTransmissionBeforeRejoinConfig
        type: number
        compute: {op: add, a: $_ftr_lo, b: $_ftr_hi}
      - {name: ackReq, type: number, compute: {op: add, a: $_ackreq_lo, b: $_ackreq_hi}}
      - name: batteryLevelThreshold
        type: number
        compute: {op: add, a: $_blt_lo, b: $_blt_hi}
        unit: mV
        sensor: none
  20:
    description: "Heartbeat 2.0"
    fields:
      - {name: fport, type: number, value: 20, var: fport}
      - {name: voboType, type: string, value: "VoBoXX"}
      - {name: payloadType, type: string, value: "Heartbeat 2.0"}
      - {name: _bl_lo, type: u8}
      - {name: _bl_hi, type: "u8[0:3]", mult: 256}
      - {name: fatalErrorsTotal, type: "u8[4:7]", consume: 1}
      - name: batteryLevel
        type: number
        compute: {op: add, a: $_bl_lo, b: $_bl_hi}
        unit: mV
        ipso: {object: 3316, instance: 0, resource: 5700}
        semantic: battery.voltage
      - {name: rssiAvg, type: u8}
      - {name: failedJoinAttemptsTotal, type: "u8[0:6]"}
      - {name: configUpdateOccurred, type: "u8[7:7]", consume: 1}
      - {name: _fw_lo, type: u8}
      - {name: _fw_hi, type: "u8[0:1]", mult: 256}
      - {name: rebootsTotal, type: "u8[2:4]"}
      - {name: failedTransmitsTotal, type: "u8[5:7]", consume: 1}
      - {name: firmwareRevision, type: number, compute: {op: add, a: $_fw_lo, b: $_fw_hi}}
      - {name: errorEventLogsTotal, type: u8}
      - {name: warningEventLogsTotal, type: u8}
      - {name: infoEventLogsTotal, type: u8}
      - {name: measurementPacketsTotal, type: u16, endian: little}
  21:
    description: "Heartbeat 2.0"
    fields:
      - {name: fport, type: number, value: 21, var: fport}
      - {name: voboType, type: string, value: "VoBoTC"}
      - {name: payloadType, type: string, value: "Heartbeat 2.0"}
      - {name: _bl_lo, type: u8}
      - {name: _bl_hi, type: "u8[0:3]", mult: 256}
      - {name: fatalErrorsTotal, type: "u8[4:7]", consume: 1}
      - name: batteryLevel
        type: number
        compute: {op: add, a: $_bl_lo, b: $_bl_hi}
        unit: mV
        ipso: {object: 3316, instance: 0, resource: 5700}
        semantic: battery.voltage
      - {name: rssiAvg, type: u8}
      - {name: failedJoinAttemptsTotal, type: "u8[0:6]"}
      - {name: configUpdateOccurred, type: "u8[7:7]", consume: 1}
      - {name: _fw_lo, type: u8}
      - {name: _fw_hi, type: "u8[0:1]", mult: 256}
      - {name: rebootsTotal, type: "u8[2:4]"}
      - {name: failedTransmitsTotal, type: "u8[5:7]", consume: 1}
      - {name: firmwareRevision, type: number, compute: {op: add, a: $_fw_lo, b: $_fw_hi}}
      - {name: errorEventLogsTotal, type: u8}
      - {name: warningEventLogsTotal, type: u8}
      - {name: infoEventLogsTotal, type: u8}
      - {name: measurementPacketsTotal, type: u16, endian: little}
  22:
    description: "Heartbeat 2.0"
