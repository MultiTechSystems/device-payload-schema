# https://www.decentlab.com/products/infrared-thermometer-/-surface-temperature-sensor-for-lorawan
name: decentlab_dl_itst
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: temperature_target
              type: u16
              transform:
                - div: 10
                - add: -100
              unit: "°C"
              senml: {unit: Cel}
            - name: temperature_head
              type: u16
              transform:
                - div: 10
                - add: -100
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0202D900020C54"
    expected:
      device_id: 729
      protocol_version: 2
      battery_voltage: 3.156
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0202D9000304F904C40C54"
    expected:
      device_id: 729
      protocol_version: 2
      temperature_target: 27.3
      temperature_head: 22.0
      battery_voltage: 3.156
