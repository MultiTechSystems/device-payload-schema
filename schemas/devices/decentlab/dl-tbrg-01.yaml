# https://www.decentlab.com/products/tipping-bucket-rain-gauge-for-lorawan
name: decentlab_dl_tbrg_01
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: precipitation
              type: u16
              transform:
                - div: 10
              unit: "mm"
            - name: precipitation_interval
              type: u16
              unit: "s"
            # The vendor reads this as x[2] + x[3] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: cumulative_precipitation
              type: u32le16
              transform:
                - div: 10
              unit: "mm"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

test_vectors:
  # The word-ordered field's bytes are the vendor-documented pair from
  # CR-2026-005: words a9fd 0134, which the device reports as 20228605 and a
  # big-endian u32 misreads as 2851930420 (PS-271). The other fields carry chosen
  # bytes and their expectations come from decoding, so the provenance is
  # `generated`: this pins the word-ordered read and the agreement between the
  # five implementations, not the vendor's own values.
  - name: word_ordered_sensor_id
    description: "Group with the word-ordered identifier enabled"
    source: generated
    payload: "0230c5000113881388a9fd0134"
    expected:
      protocol_version: 2
      device_id: 12485
      flags: 1
      precipitation: 500
      precipitation_interval: 5000
      cumulative_precipitation: 2022860.5
