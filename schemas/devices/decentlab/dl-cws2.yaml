# https://www.decentlab.com/products/high-precision-winter-road-maintenance-sensor-with-radiation-shield-for-lorawan
name: decentlab_dl_cws2
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: air_temperature_radiation_shield
              type: u16
              transform:
                - mult: 0.002670328831921874
                - add: -45
              unit: "°C"
              senml: {unit: Cel}
            - name: air_humidity_radiation_shield
              type: u16
              transform:
                - mult: 0.0015259021896696424
                - add: -2.220446049250313e-16
              unit: "%"
        - bit: 1
          fields:
            - name: surface_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: air_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: air_humidity
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "%"
            - name: dew_point
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: angle
              type: u16
              transform:
                - add: -32768
              unit: "°"
              senml: {unit: deg}
            - name: sensor_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
        - bit: 2
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
