# https://www.decentlab.com/products/high-precision-air-temperature-and-humidity-sensor-with-radiation-shield-for-lorawan
name: decentlab_dl_rhc
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # The vendor reads this as x[0] + x[1] * 65536 - low word first - so a
            # big-endian u32 takes the two halves the wrong way round: for words
            # a9fd 0134 it gave 2851930420 where the sensor id is 20228605. The
            # converter matched the expression and emitted u32 confidently, so no
            # hint was left to warn anyone.
            - name: sensor_id
              type: u32le16
            - name: air_humidity
              type: u16
              div: 100
              unit: "%"
            - name: air_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
