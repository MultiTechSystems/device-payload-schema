# https://www.decentlab.com/products/high-precision-air-temperature-and-humidity-sensor-with-radiation-shield-for-lorawan
name: decentlab_dl_rhc
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # The vendor reads this as x[0] + x[1] * 65536 - low word first - so a
            # big-endian u32 takes the two halves the wrong way round: for words
            # a9fd 0134 it gave 2851930420 where the sensor id is 20228605. The
            # converter matched the expression and emitted u32 confidently, so no
            # hint was left to warn anyone.
            - name: sensor_id
              type: u32le16
            - name: air_humidity
              type: u16
              div: 100
              unit: "%"
            - name: air_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

test_vectors:
  # The word-ordered field's bytes are the vendor-documented pair from
  # CR-2026-005: words a9fd 0134, which the device reports as 20228605 and a
  # big-endian u32 misreads as 2851930420 (PS-271). The other fields carry chosen
  # bytes and their expectations come from decoding, so the provenance is
  # `generated`: this pins the word-ordered read and the agreement between the
  # five implementations, not the vendor's own values.
  - name: word_ordered_sensor_id
    description: "Group with the word-ordered identifier enabled"
    source: generated
    payload: "0230c50001a9fd013413881388"
    expected:
      protocol_version: 2
      device_id: 12485
      flags: 1
      sensor_id: 20228605
      air_humidity: 50
      air_temperature: -277.68
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0202E00003A9FD01341CA285F30C60"
    expected:
      device_id: 736
      protocol_version: 2
      sensor_id: 20228605
      air_humidity: 73.3
      air_temperature: 15.23
      battery_voltage: 3.168
