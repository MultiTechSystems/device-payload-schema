# https://www.decentlab.com/products/total-solar-radiation-sensor-for-lorawan
name: decentlab_dl_pyr
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: total_solar_radiation
              type: u16
              transform:
                - mult: 0.457763671875
                - add: -15000
              unit: "W⋅m⁻²"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
