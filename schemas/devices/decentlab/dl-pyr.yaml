# https://www.decentlab.com/products/total-solar-radiation-sensor-for-lorawan
name: decentlab_dl_pyr
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: total_solar_radiation
              type: u16
              transform:
                - mult: 0.457763671875
                - add: -15000
              unit: "W⋅m⁻²"
              senml: {unit: W/m2}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02029100020C60"
    expected:
      device_id: 657
      protocol_version: 2
      battery_voltage: 3.168
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "020291000380690C60"
    expected:
      device_id: 657
      protocol_version: 2
      total_solar_radiation: 48.065185546875
      battery_voltage: 3.168
