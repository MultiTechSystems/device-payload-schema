# https://www.decentlab.com/products/eleven-parameter-weather-station-for-lorawan
name: decentlab_dl_atm41g2
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: solar_radiation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "W⋅m⁻²"
            - name: precipitation
              type: u16
              div: 1000
              unit: "mm"
            - name: lightning_strike_count
              type: u16
              add: -32768
              unit: "None"
            - name: lightning_average_distance
              type: u16
              add: -32768
              unit: "km"
            - name: wind_speed
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "m⋅s⁻¹"
            - name: wind_direction
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
            - name: maximum_wind_speed
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "m⋅s⁻¹"
            - name: air_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
            - name: vapor_pressure
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "kPa"
            - name: barometric_pressure
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "kPa"
            - name: relative_humidity
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "%"
            - name: internal_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
            - name: tilt_angle_x_orientation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
            - name: tilt_angle_y_orientation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
            - name: precipitation_electrical_conductivity
              type: u16
              add: -32768
              unit: "µS⋅cm⁻¹"
            # The vendor reads this as x[15] + x[16] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: cumulative_precipitation
              type: u32le16
              transform:
                - div: 1000
              unit: "mm"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
