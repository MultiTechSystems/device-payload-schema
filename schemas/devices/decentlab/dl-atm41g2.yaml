# https://www.decentlab.com/products/eleven-parameter-weather-station-for-lorawan
name: decentlab_dl_atm41g2
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: solar_radiation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "W⋅m⁻²"
            - name: precipitation
              type: u16
              div: 1000
              unit: "mm"
            - name: lightning_strike_count
              type: u16
              add: -32768
              unit: "None"
            - name: lightning_average_distance
              type: u16
              add: -32768
              unit: "km"
            - name: wind_speed
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "m⋅s⁻¹"
            - name: wind_direction
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
            - name: maximum_wind_speed
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "m⋅s⁻¹"
            - name: air_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
            - name: vapor_pressure
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "kPa"
            - name: barometric_pressure
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "kPa"
            - name: relative_humidity
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "%"
            - name: internal_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
            - name: tilt_angle_x_orientation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
            - name: tilt_angle_y_orientation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
            - name: precipitation_electrical_conductivity
              type: u16
              add: -32768
              unit: "µS⋅cm⁻¹"
            # The vendor reads this as x[15] + x[16] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: cumulative_precipitation
              type: u32le16
              transform:
                - div: 1000
              unit: "mm"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

test_vectors:
  # The word-ordered field's bytes are the vendor-documented pair from
  # CR-2026-005: words a9fd 0134, which the device reports as 20228605 and a
  # big-endian u32 misreads as 2851930420 (PS-271). The other fields carry chosen
  # bytes and their expectations come from decoding, so the provenance is
  # `generated`: this pins the word-ordered read and the agreement between the
  # five implementations, not the vendor's own values.
  - name: word_ordered_sensor_id
    description: "Group with the word-ordered identifier enabled"
    source: generated
    payload: "0230c50001138813881388138813881388138813881388138813881388138813881388a9fd0134"
    expected:
      protocol_version: 2
      device_id: 12485
      flags: 1
      solar_radiation: -2776.8
      precipitation: 5
      lightning_strike_count: -27768
      lightning_average_distance: -27768
      wind_speed: -277.68
      wind_direction: -2776.8
      maximum_wind_speed: -277.68
      air_temperature: -2776.8
      vapor_pressure: -277.68
      barometric_pressure: -277.68
      relative_humidity: -2776.8
      internal_temperature: -2776.8
      tilt_angle_x_orientation: -2776.8
      tilt_angle_y_orientation: -2776.8
      precipitation_electrical_conductivity: -27768
      cumulative_precipitation: 20228.605
