# https://www.decentlab.com/products/eleven-parameter-weather-station-for-lorawan
name: decentlab_dl_atm41g2
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: solar_radiation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "W⋅m⁻²"
              senml: {unit: W/m2}
            - name: precipitation
              type: u16
              div: 1000
              unit: "mm"
            - name: lightning_strike_count
              type: u16
              add: -32768
              # A count: no unit. The vendor decoder writes 'None' for that, which the
              # converter copied as though it were a unit's name.
            - name: lightning_average_distance
              type: u16
              add: -32768
              unit: "km"
            - name: wind_speed
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "m⋅s⁻¹"
              senml: {unit: m/s}
            - name: wind_direction
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
              senml: {unit: deg}
            - name: maximum_wind_speed
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "m⋅s⁻¹"
              senml: {unit: m/s}
            - name: air_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
              senml: {unit: Cel}
            - name: vapor_pressure
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "kPa"
            - name: barometric_pressure
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "kPa"
            - name: relative_humidity
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "%"
            - name: internal_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
              senml: {unit: Cel}
            - name: tilt_angle_x_orientation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
              senml: {unit: deg}
            - name: tilt_angle_y_orientation
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°"
              senml: {unit: deg}
            - name: precipitation_electrical_conductivity
              type: u16
              add: -32768
              unit: "µS⋅cm⁻¹"
            # The vendor reads this as x[15] + x[16] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: cumulative_precipitation
              type: u32le16
              transform:
                - div: 1000
              unit: "mm"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

test_vectors:
  # The word-ordered field's bytes are the vendor-documented pair from
  # CR-2026-005: words a9fd 0134, which the device reports as 20228605 and a
  # big-endian u32 misreads as 2851930420 (PS-271). The other fields carry chosen
  # bytes and their expectations come from decoding, so the provenance is
  # `generated`: this pins the word-ordered read and the agreement between the
  # five implementations, not the vendor's own values.
  - name: word_ordered_sensor_id
    description: "Group with the word-ordered identifier enabled"
    source: generated
    payload: "0230c50001138813881388138813881388138813881388138813881388138813881388a9fd0134"
    expected:
      protocol_version: 2
      device_id: 12485
      flags: 1
      solar_radiation: -2776.8
      precipitation: 5
      lightning_strike_count: -27768
      lightning_average_distance: -27768
      wind_speed: -277.68
      wind_direction: -2776.8
      maximum_wind_speed: -277.68
      air_temperature: -2776.8
      vapor_pressure: -277.68
      barometric_pressure: -277.68
      relative_humidity: -2776.8
      internal_temperature: -2776.8
      tilt_angle_x_orientation: -2776.8
      tilt_angle_y_orientation: -2776.8
      precipitation_electrical_conductivity: -27768
      cumulative_precipitation: 20228.605
  # The vendor's own examples: main() in DL-ATM41G2.js (decentlab-decoders 045ec68),
  # decoded by that decoder. It does not report `flags`.
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "025EF80003805C000080008000803484B3803680E78086A60181D680ED81C9809F8000117000010ADC"
    expected:
      protocol_version: 2
      device_id: 24312
      solar_radiation: 9.2
      precipitation: 0
      lightning_strike_count: 0
      lightning_average_distance: 0
      wind_speed: 0.52
      wind_direction: 120.3
      maximum_wind_speed: 0.54
      air_temperature: 23.1
      vapor_pressure: 1.34
      barometric_pressure: 97.29
      relative_humidity: 47
      internal_temperature: 23.7
      tilt_angle_x_orientation: 45.7
      tilt_angle_y_orientation: 15.9
      precipitation_electrical_conductivity: 0
      cumulative_precipitation: 70
      battery_voltage: 2.78
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "025EF800020ADC"
    expected:
      protocol_version: 2
      device_id: 24312
      battery_voltage: 2.78
