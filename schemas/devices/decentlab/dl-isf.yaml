# https://www.decentlab.com/products/sapflow-sensor-for-lorawan
name: decentlab_dl_isf
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: sap_flow
              type: u16
              transform:
                - mult: 0.016
                - add: -50
              unit: "l⋅h⁻¹"
            - name: heat_velocity_outer
              type: u16
              transform:
                - mult: 0.016
                - add: -50
              unit: "cm⋅h⁻¹"
            - name: heat_velocity_inner
              type: u16
              transform:
                - mult: 0.016
                - add: -50
              unit: "cm⋅h⁻¹"
            - name: alpha_outer
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: alpha_inner
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: beta_outer
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: beta_inner
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: tmax_outer
              type: u16
              transform:
                - div: 500
              unit: "s"
            - name: tmax_inner
              type: u16
              transform:
                - div: 500
              unit: "s"
            - name: temperature_outer
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
            - name: max_voltage
              type: u16
              transform:
                - div: 1000
                - add: -32.768
              unit: "V"
            - name: min_voltage
              type: u16
              transform:
                - div: 1000
                - add: -32.768
              unit: "V"
            # x[12] + x[13] * 65536, low word first, so a big-endian u32 takes the
            # halves the wrong way round. The vendor's own test payload happens not
            # to expose the difference, so cross-validation passed either way.
            - name: diagnostic
              type: u32le16
            - name: upstream_tmax_outer
              type: u16
              transform:
                - div: 500
              unit: "s"
            - name: upstream_tmax_inner
              type: u16
              transform:
                - div: 500
              unit: "s"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

test_vectors:
  # The word-ordered field's bytes are the vendor-documented pair from
  # CR-2026-005: words a9fd 0134, which the device reports as 20228605 and a
  # big-endian u32 misreads as 2851930420 (PS-271). The other fields carry chosen
  # bytes and their expectations come from decoding, so the provenance is
  # `generated`: this pins the word-ordered read and the agreement between the
  # five implementations, not the vendor's own values.
  - name: word_ordered_sensor_id
    description: "Group with the word-ordered identifier enabled"
    source: generated
    payload: "0230c50001138813881388138813881388138813881388138813881388a9fd013413881388"
    expected:
      protocol_version: 2
      device_id: 12485
      flags: 1
      sap_flow: 30
      heat_velocity_outer: 30
      heat_velocity_inner: 30
      alpha_outer: -8.4
      alpha_inner: -8.4
      beta_outer: -8.4
      beta_inner: -8.4
      tmax_outer: 10
      tmax_inner: 10
      temperature_outer: -277.68
      max_voltage: -27.768
      min_voltage: -27.768
      diagnostic: 20228605
      upstream_tmax_outer: 10
      upstream_tmax_inner: 10
