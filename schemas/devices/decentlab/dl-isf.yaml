# https://www.decentlab.com/products/sapflow-sensor-for-lorawan
name: decentlab_dl_isf
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: sap_flow
              type: u16
              transform:
                - mult: 0.016
                - add: -50
              unit: "l⋅h⁻¹"
            - name: heat_velocity_outer
              type: u16
              transform:
                - mult: 0.016
                - add: -50
              unit: "cm⋅h⁻¹"
            - name: heat_velocity_inner
              type: u16
              transform:
                - mult: 0.016
                - add: -50
              unit: "cm⋅h⁻¹"
            - name: alpha_outer
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: alpha_inner
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: beta_outer
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: beta_inner
              type: u16
              transform:
                - mult: 0.00032
                - add: -10
            - name: tmax_outer
              type: u16
              transform:
                - div: 500
              unit: "s"
            - name: tmax_inner
              type: u16
              transform:
                - div: 500
              unit: "s"
            - name: temperature_outer
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
            - name: max_voltage
              type: u16
              transform:
                - div: 1000
                - add: -32.768
              unit: "V"
            - name: min_voltage
              type: u16
              transform:
                - div: 1000
                - add: -32.768
              unit: "V"
            - name: diagnostic
              type: u32
            - name: upstream_tmax_outer
              type: u16
              transform:
                - div: 500
              unit: "s"
            - name: upstream_tmax_inner
              type: u16
              transform:
                - div: 500
              unit: "s"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
