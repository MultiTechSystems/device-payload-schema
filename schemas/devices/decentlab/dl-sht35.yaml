# https://www.decentlab.com/products/air-temperature-and-humidity-sensor-with-radiation-shield-for-lorawan
name: decentlab_dl_sht35
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: air_temperature
              description: "Air temperature"
              type: u16
              transform:
                - mult: 0.002670328831921874
                - add: -45
              unit: "°C"
              senml: {unit: Cel}
              semantic: "air.temperature"
            - name: air_humidity
              description: "Air humidity"
              type: u16
              transform:
                - mult: 0.0015259021896696424
                - add: -2.220446049250313e-16
              unit: "%"
              senml: {unit: "%RH"}
              semantic: "air.relativeHumidity"
        - bit: 1
          fields:
            - name: battery_voltage
              description: "Battery voltage"
              type: u16
              div: 1000
              unit: "V"
              semantic: "battery"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02030E00020C60"
    expected:
      device_id: 782
      protocol_version: 2
      battery_voltage: 3.168
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02030E000364A079B10C60"
    expected:
      device_id: 782
      protocol_version: 2
      air_temperature: 23.787670710307466
      air_humidity: 47.536430914778364
      battery_voltage: 3.168
