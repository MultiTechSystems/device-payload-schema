# https://www.decentlab.com/products/analog-or-digital-sensor-device-for-lorawan
name: decentlab_dl_dlr2_011
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: ch0_input
              type: u16
        - bit: 1
          fields:
            - name: ch1_input
              type: u16
        - bit: 2
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02437100040AF9"
    expected:
      device_id: 17265
      protocol_version: 2
      battery_voltage: 2.809
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0243710007000100000AF9"
    expected:
      device_id: 17265
      protocol_version: 2
      ch0_input: 1
      ch1_input: 0
      battery_voltage: 2.809
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    source: vendor-codec
    payload: "0212340007000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      ch0_input: 0
      ch1_input: 0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    source: vendor-codec
    payload: "0212340007800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      ch0_input: 32768
      ch1_input: 32768
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    source: vendor-codec
    payload: "0212340007FFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      ch0_input: 65535
      ch1_input: 65535
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    source: vendor-codec
    payload: "02123400040BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
