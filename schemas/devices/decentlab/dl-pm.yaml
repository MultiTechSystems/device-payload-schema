# https://www.decentlab.com/products/particulate-matter-temperature-humidity-and-barometric-pressure-sensor-for-lorawan
name: decentlab_dl_pm
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
        - bit: 1
          fields:
            - name: pm1_0_mass_concentration
              type: u16
              div: 10
              unit: "µg⋅m⁻³"
              senml: {unit: ug/m3}
            - name: pm2_5_mass_concentration
              type: u16
              div: 10
              unit: "µg⋅m⁻³"
              senml: {unit: ug/m3}
            - name: pm4_mass_concentration
              type: u16
              div: 10
              unit: "µg⋅m⁻³"
              senml: {unit: ug/m3}
            - name: pm10_mass_concentration
              type: u16
              div: 10
              unit: "µg⋅m⁻³"
              senml: {unit: ug/m3}
            - name: typical_particle_size
              type: u16
              unit: "nm"
            - name: pm0_5_number_concentration
              type: u16
              div: 10
              unit: "1⋅cm⁻³"
            - name: pm1_0_number_concentration
              type: u16
              div: 10
              unit: "1⋅cm⁻³"
            - name: pm2_5_number_concentration
              type: u16
              div: 10
              unit: "1⋅cm⁻³"
            - name: pm4_number_concentration
              type: u16
              div: 10
              unit: "1⋅cm⁻³"
            - name: pm10_number_concentration
              type: u16
              div: 10
              unit: "1⋅cm⁻³"
        - bit: 2
          fields:
            - name: air_temperature
              type: u16
              transform:
                - mult: 0.0026812744140625
                - add: -46.85
              unit: "°C"
              senml: {unit: Cel}
            - name: air_humidity
              type: u16
              transform:
                - mult: 0.0019073486328125
                - add: -6
              unit: "%"
        - bit: 3
          fields:
            - name: barometric_pressure
              type: u16
              mult: 2
              unit: "Pa"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "021B5000010C25"
    expected:
      device_id: 6992
      protocol_version: 2
      battery_voltage: 3.109
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "021B50000D0C2567BD618DBD10"
    expected:
      device_id: 6992
      protocol_version: 2
      battery_voltage: 3.109
      air_temperature: 24.35660461425781
      air_humidity: 41.63221740722656
      barometric_pressure: 96800
