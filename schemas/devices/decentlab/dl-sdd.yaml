# https://www.decentlab.com/products/soil-moisture-temperature-and-salinity-profile
name: decentlab_dl_sdd
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: moisture_at_level_0
              sensor: percentage   # volumetric moisture; "level" is the probe depth
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "%"
              senml: {unit: "/100"}
