# https://www.decentlab.com/products/albedometer-sensor-for-lorawan
name: decentlab_dl_alb
version: 3
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: incoming_radiation
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "W/m²"
              ipso: {object: 3301, instance: 0, resource: 5700}
              senml: {name: "solar_in", unit: "W/m2"}
              semantic: "solar.irradiance.incoming"
            - name: reflected_radiation
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "W/m²"
              ipso: {object: 3301, instance: 1, resource: 5700}
              senml: {name: "solar_ref", unit: "W/m2"}
              semantic: "solar.irradiance.reflected"
            - name: albedo
              type: number
              compute:
                op: div
                a: $reflected_radiation
                b: $incoming_radiation
              guard:
                when:
                  - field: $incoming_radiation
                    gt: 0
                  - field: $reflected_radiation
                    gte: 0
                else: 0
              senml: {name: "albedo", unit: "/"}
              semantic: "solar.albedo"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "vbat", unit: "V"}
              semantic: "battery.voltage"

test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "02528500020BD3"
    expected:
      device_id: 21125
      protocol_version: 2
      battery_voltage: 3.027
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0252850003809980220BD3"
    expected:
      device_id: 21125
      protocol_version: 2
      incoming_radiation: 15.3
      reflected_radiation: 3.4
      albedo: 0.222222
      battery_voltage: 3.027
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    payload: "0212340003000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      incoming_radiation: -3276.8
      reflected_radiation: -3276.8
      albedo: 0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    payload: "0212340003800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      incoming_radiation: 0.0
      reflected_radiation: 0.0
      albedo: 0
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    payload: "0212340003FFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      incoming_radiation: 3276.7
      reflected_radiation: 3276.7
      albedo: 1.0
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
