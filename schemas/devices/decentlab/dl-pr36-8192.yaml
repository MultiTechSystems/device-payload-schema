# https://www.decentlab.com/products/high-precision-pressure-/-liquid-level-and-temperature-sensor-for-lorawan
name: decentlab_dl_pr36_8192
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: pressure
              type: u16
              transform:
                - div: 8192
                - add: -4
              unit: "bar"
            - name: temperature
              type: u16
              transform:
                - div: 256
                - add: -128
              unit: "°C"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
