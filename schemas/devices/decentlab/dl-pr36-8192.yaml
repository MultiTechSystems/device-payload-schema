# https://www.decentlab.com/products/high-precision-pressure-/-liquid-level-and-temperature-sensor-for-lorawan
name: decentlab_dl_pr36_8192
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: pressure
              type: u16
              transform:
                - div: 8192
                - add: -4
              unit: "bar"
            - name: temperature
              type: u16
              transform:
                - div: 256
                - add: -128
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02032B00020C2B"
    expected:
      device_id: 811
      protocol_version: 2
      battery_voltage: 3.115
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02032B0003806797810C2B"
    expected:
      device_id: 811
      protocol_version: 2
      pressure: 0.0125732421875
      temperature: 23.50390625
      battery_voltage: 3.115
