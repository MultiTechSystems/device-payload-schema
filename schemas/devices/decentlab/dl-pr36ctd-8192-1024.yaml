# https://www.decentlab.com/products/high-precision-pressure-/-liquid-level-temperature-and-electrical-conductivity-sensor-for-lorawan
name: decentlab_dl_pr36ctd_8192_1024
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: pressure
              type: u16
              transform:
                - div: 8192
                - add: -4
              unit: "bar"
            - name: temperature_electronics
              type: u16
              transform:
                - div: 256
                - add: -128
              unit: "°C"
              senml: {unit: Cel}
            - name: temperature_pt1000
              type: u16
              transform:
                - div: 256
                - add: -128
              unit: "°C"
              senml: {unit: Cel}
            - name: electrical_conductivity
              type: u16
              transform:
                - div: 1024
                - add: -32
              unit: "mS⋅cm⁻¹"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "020A1700020C2B"
    expected:
      device_id: 2583
      protocol_version: 2
      battery_voltage: 3.115
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "020A17000380079786978180060C2B"
    expected:
      device_id: 2583
      protocol_version: 2
      pressure: 0.0008544921875
      temperature_electronics: 23.5234375
      temperature_pt1000: 23.50390625
      electrical_conductivity: 0.005859375
      battery_voltage: 3.115
