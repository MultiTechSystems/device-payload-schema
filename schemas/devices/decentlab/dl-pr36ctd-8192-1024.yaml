# https://www.decentlab.com/products/high-precision-pressure-/-liquid-level-temperature-and-electrical-conductivity-sensor-for-lorawan
name: decentlab_dl_pr36ctd_8192_1024
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: pressure
              type: u16
              transform:
                - div: 8192
                - add: -4
              unit: "bar"
            - name: temperature_electronics
              type: u16
              transform:
                - div: 256
                - add: -128
              unit: "°C"
            - name: temperature_pt1000
              type: u16
              transform:
                - div: 256
                - add: -128
              unit: "°C"
            - name: electrical_conductivity
              type: u16
              transform:
                - div: 1024
                - add: -32
              unit: "mS⋅cm⁻¹"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
