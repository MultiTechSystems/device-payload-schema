# https://www.decentlab.com/stem-dendrometer-sensor-for-lorawan
name: decentlab_dl_isd
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: stem_size
              type: u16
              div: 1000
              unit: "mm"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0256E100020C52"
    expected:
      device_id: 22241
      protocol_version: 2
      battery_voltage: 3.154
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0256E100030B520C52"
    expected:
      device_id: 22241
      protocol_version: 2
      stem_size: 2.898
      battery_voltage: 3.154
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    payload: "021234000300000000"
    expected:
      device_id: 4660
      protocol_version: 2
      stem_size: 0.0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    payload: "021234000380008000"
    expected:
      device_id: 4660
      protocol_version: 2
      stem_size: 32.768
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    payload: "0212340003FFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      stem_size: 65.535
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
