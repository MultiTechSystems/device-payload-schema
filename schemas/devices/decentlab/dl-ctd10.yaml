# https://www.decentlab.com/products/pressure-/-liquid-level-temperature-and-electrical-conductivity-sensor-for-lorawan
name: decentlab_dl_ctd10
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: water_depth
              type: u16
              add: -32768
              unit: "mm"
            - name: temperature
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature", unit: "Cel"}
              semantic: "temperature"
            - name: electrical_conductivity
              type: u16
              unit: "µS⋅cm⁻¹"
            - name: freezing_flag
              type: u16
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0207D900020C60"
    expected:
      device_id: 2009
      protocol_version: 2
      battery_voltage: 3.168
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0207D9000390888081006400000C60"
    expected:
      device_id: 2009
      protocol_version: 2
      water_depth: 4232
      temperature: 12.9
      electrical_conductivity: 100
      freezing_flag: 0
      battery_voltage: 3.168
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    payload: "021234000300000000000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      water_depth: -32768
      temperature: -3276.8
      electrical_conductivity: 0
      freezing_flag: 0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    payload: "021234000380008000800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      water_depth: 0
      temperature: 0.0
      electrical_conductivity: 32768
      freezing_flag: 32768
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    payload: "0212340003FFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      water_depth: 32767
      temperature: 3276.7
      electrical_conductivity: 65535
      freezing_flag: 65535
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
