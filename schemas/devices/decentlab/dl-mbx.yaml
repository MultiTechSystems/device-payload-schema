# https://www.decentlab.com/products/ultrasonic-distance-/-level-sensor-for-lorawan
name: decentlab_dl_mbx
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: distance
              type: u16
              unit: "mm"
            - name: number_of_valid_samples
              type: u16
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02012F00020BB1"
    expected:
      device_id: 303
      protocol_version: 2
      battery_voltage: 2.993
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02012F000304D200010BB1"
    expected:
      device_id: 303
      protocol_version: 2
      distance: 1234
      number_of_valid_samples: 1
      battery_voltage: 2.993
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    source: vendor-codec
    payload: "0212340003000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      distance: 0
      number_of_valid_samples: 0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    source: vendor-codec
    payload: "0212340003800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      distance: 32768
      number_of_valid_samples: 32768
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    source: vendor-codec
    payload: "0212340003FFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      distance: 65535
      number_of_valid_samples: 65535
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    source: vendor-codec
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
