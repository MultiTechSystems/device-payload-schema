# https://www.decentlab.com/products/radar-distance-level-sensor-for-lorawan
name: decentlab_dl_rad
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: distance
              type: u16
              unit: "mm"
            - name: temperature
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature", unit: "Cel"}
              semantic: "temperature"
            - name: reliability
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "dB"
            - name: status
              type: u16
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "02586B00020B93"
    expected:
      device_id: 22635
      protocol_version: 2
      battery_voltage: 2.963
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "02586B0003074C88B68A8C00000B93"
    expected:
      device_id: 22635
      protocol_version: 2
      distance: 1868
      temperature: 22.3
      reliability: 27.0
      status: 0
      battery_voltage: 2.963
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    payload: "021234000300000000000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      distance: 0
      temperature: -327.68
      reliability: -327.68
      status: 0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    payload: "021234000380008000800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      distance: 32768
      temperature: 0.0
      reliability: 0.0
      status: 32768
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    payload: "0212340003FFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      distance: 65535
      temperature: 327.67
      reliability: 327.67
      status: 65535
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
