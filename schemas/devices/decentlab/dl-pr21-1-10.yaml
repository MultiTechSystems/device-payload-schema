# https://www.decentlab.com/products/pressure-/-liquid-level-and-temperature-sensor-with-g1/4-pipe-thread-for-lorawan
name: decentlab_dl_pr21_1_10
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: pressure
              type: u16
              transform:
                - mult: 0.000335693359375
                - add: -6.5
              unit: "bar"
            - name: temperature
              type: u16
              transform:
                - div: 320
                - add: -51.2
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02016700020C7F"
    expected:
      device_id: 359
      protocol_version: 2
      battery_voltage: 3.199
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02016700034E8060170C7F"
    expected:
      device_id: 359
      protocol_version: 2
      pressure: 0.24609375
      temperature: 25.671875
      battery_voltage: 3.199
