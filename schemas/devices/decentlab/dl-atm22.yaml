# https://www.decentlab.com/products/wind-speed-wind-direction-and-temperature-sensor-for-lorawan
name: decentlab_dl_atm22
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: wind_speed
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "m⋅s⁻¹"
            - name: wind_direction
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "°"
              ipso: {object: 3332, instance: 0, resource: 5700}
              senml: {name: "wind_direction", unit: "deg"}
              semantic: "wind.direction"
            - name: maximum_wind_speed
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "m⋅s⁻¹"
            - name: air_temperature
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "air_temperature", unit: "Cel"}
              semantic: "air.temperature"
            - name: x_orientation_angle
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "°"
            - name: y_orientation_angle
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "°"
            - name: north_wind_speed
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "m⋅s⁻¹"
            - name: east_wind_speed
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "m⋅s⁻¹"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0208C900020BF5"
    expected:
      device_id: 2249
      protocol_version: 2
      battery_voltage: 3.061
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0208C900038009812B8014810880027FE8800880040BF5"
    expected:
      device_id: 2249
      protocol_version: 2
      wind_speed: 0.09
      wind_direction: 29.9
      maximum_wind_speed: 0.2
      air_temperature: 26.4
      x_orientation_angle: 0.2
      y_orientation_angle: -2.4
      north_wind_speed: 0.08
      east_wind_speed: 0.04
      battery_voltage: 3.061
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    payload: "0212340003000000000000000000000000000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      wind_speed: -327.68
      wind_direction: -3276.8
      maximum_wind_speed: -327.68
      air_temperature: -3276.8
      x_orientation_angle: -3276.8
      y_orientation_angle: -3276.8
      north_wind_speed: -327.68
      east_wind_speed: -327.68
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    payload: "0212340003800080008000800080008000800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      wind_speed: 0.0
      wind_direction: 0.0
      maximum_wind_speed: 0.0
      air_temperature: 0.0
      x_orientation_angle: 0.0
      y_orientation_angle: 0.0
      north_wind_speed: 0.0
      east_wind_speed: 0.0
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    payload: "0212340003FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      wind_speed: 327.67
      wind_direction: 3276.7
      maximum_wind_speed: 327.67
      air_temperature: 3276.7
      x_orientation_angle: 3276.7
      y_orientation_angle: 3276.7
      north_wind_speed: 327.67
      east_wind_speed: 327.67
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
