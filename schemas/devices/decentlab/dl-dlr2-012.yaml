# https://www.decentlab.com/products/analog-or-digital-sensor-device-for-lorawan
name: decentlab_dl_dlr2_012
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # The vendor reads this as x[0] + x[1] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: _strain_gauge_low
              type: u16
            - name: _strain_gauge_high
              type: u16
            - name: _strain_gauge_high_scaled
              type: number
              compute:
                op: mul
                a: $_strain_gauge_high
                b: 65536
            - name: strain_gauge
              type: number
              compute:
                op: add
                a: $_strain_gauge_low
                b: $_strain_gauge_high_scaled
              transform:
                - mult: 0.003688406236100905
                - add: -30940.59405940594
              unit: "µm⋅m⁻¹"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
