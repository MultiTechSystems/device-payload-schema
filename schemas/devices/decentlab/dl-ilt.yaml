# https://www.decentlab.com/leaf-temperature-sensor-for-lorawan
name: decentlab_dl_ilt
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: leaf_temperature
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "leaf_temperature", unit: "Cel"}
              semantic: "leaf.temperature"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0256D200020C9D"
    expected:
      device_id: 22226
      protocol_version: 2
      battery_voltage: 3.229
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0256D200038A8C0C9D"
    expected:
      device_id: 22226
      protocol_version: 2
      leaf_temperature: 27.0
      battery_voltage: 3.229
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    source: vendor-codec
    payload: "021234000300000000"
    expected:
      device_id: 4660
      protocol_version: 2
      leaf_temperature: -327.68
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    source: vendor-codec
    payload: "021234000380008000"
    expected:
      device_id: 4660
      protocol_version: 2
      leaf_temperature: 0.0
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    source: vendor-codec
    payload: "0212340003FFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      leaf_temperature: 327.67
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    source: vendor-codec
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
