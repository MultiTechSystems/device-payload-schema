# https://www.decentlab.com/products/large-range-optical-turbidity-and-temperature-sensor-for-lorawan
name: decentlab_dl_mes5
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: status
              type: u16
            - name: temperature
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature", unit: "Cel"}
              semantic: "temperature"
            - name: sludge_blanket
              type: u16
              div: 100
              unit: "%"
            - name: suspended_solid
              type: u16
              div: 100
              unit: "g⋅L⁻¹"
            - name: turbidity
              type: u16
              div: 10
              unit: "FAU"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "024E0300020AF5"
    expected:
      device_id: 19971
      protocol_version: 2
      battery_voltage: 2.805
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "024E030003000088E6210800F223650AF5"
    expected:
      device_id: 19971
      protocol_version: 2
      status: 0
      temperature: 22.78
      sludge_blanket: 84.56
      suspended_solid: 2.42
      turbidity: 906.1
      battery_voltage: 2.805
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    source: vendor-codec
    payload: "0212340003000000000000000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      status: 0
      temperature: -327.68
      sludge_blanket: 0.0
      suspended_solid: 0.0
      turbidity: 0.0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    source: vendor-codec
    payload: "0212340003800080008000800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      status: 32768
      temperature: 0.0
      sludge_blanket: 327.68
      suspended_solid: 327.68
      turbidity: 3276.8
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    source: vendor-codec
    payload: "0212340003FFFFFFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      status: 65535
      temperature: 327.67
      sludge_blanket: 655.35
      suspended_solid: 655.35
      turbidity: 6553.5
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    source: vendor-codec
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
