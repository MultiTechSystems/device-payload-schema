# https://www.decentlab.com/products/analog-or-digital-sensor-device-for-lorawan
name: decentlab_dl_dlr2_005
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # The vendor reads this as x[0] + x[1] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: _voltage_low
              type: u16
            - name: _voltage_high
              type: u16
            - name: _voltage_high_scaled
              type: number
              compute:
                op: mul
                a: $_voltage_high
                b: 65536
            - name: voltage
              type: number
              compute:
                op: add
                a: $_voltage_low
                b: $_voltage_high_scaled
              transform:
                - mult: 3.5762786865234375e-07
                - add: -3
              unit: "V"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
