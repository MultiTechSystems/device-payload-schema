# https://www.decentlab.com/products/analog-or-digital-sensor-device-for-lorawan
name: decentlab_dl_dlr2_010
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: ch0_pulse_count
              type: u16
            - name: ch0_pulse_interval
              type: u16
              unit: "s"
            # The vendor reads this as x[2] + x[3] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: _ch0_cumulative_pulse_count_low
              type: u16
            - name: _ch0_cumulative_pulse_count_high
              type: u16
            - name: _ch0_cumulative_pulse_count_high_scaled
              type: number
              compute:
                op: mul
                a: $_ch0_cumulative_pulse_count_high
                b: 65536
            - name: ch0_cumulative_pulse_count
              type: number
              compute:
                op: add
                a: $_ch0_cumulative_pulse_count_low
                b: $_ch0_cumulative_pulse_count_high_scaled
        - bit: 1
          fields:
            - name: ch1_pulse_count
              type: u16
            - name: ch1_pulse_interval
              type: u16
              unit: "s"
            # The vendor reads this as x[2] + x[3] * 65536: two 16-bit words,
            # low word first, so those four bytes are not a big-endian u32 and
            # cannot be read as one field. Reading only the low word also left the
            # high word unconsumed, misaligning every group after it.
            - name: _ch1_cumulative_pulse_count_low
              type: u16
            - name: _ch1_cumulative_pulse_count_high
              type: u16
            - name: _ch1_cumulative_pulse_count_high_scaled
              type: number
              compute:
                op: mul
                a: $_ch1_cumulative_pulse_count_high
                b: 65536
            - name: ch1_cumulative_pulse_count
              type: number
              compute:
                op: add
                a: $_ch1_cumulative_pulse_count_low
                b: $_ch1_cumulative_pulse_count_high_scaled
        - bit: 2
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
