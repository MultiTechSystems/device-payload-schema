# https://www.decentlab.com/products/laser-distance-level-sensor-for-lorawan
name: decentlab_dl_lid
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: distance_average
              type: u16
              unit: "mm"
            - name: distance_minimum
              type: u16
              unit: "mm"
            - name: distance_maximum
              type: u16
              unit: "mm"
            - name: distance_median
              type: u16
              unit: "mm"
            - name: distance_10th_percentile
              type: u16
              unit: "mm"
            - name: distance_25th_percentile
              type: u16
              unit: "mm"
            - name: distance_75th_percentile
              type: u16
              unit: "mm"
            - name: distance_90th_percentile
              type: u16
              unit: "mm"
            - name: distance_most_frequent_value
              type: u16
              unit: "mm"
            - name: number_of_samples
              type: u16
            - name: total_acquisition_time
              type: u16
              div: 1.024
              unit: "ms"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0211C900020ABD"
    expected:
      device_id: 4553
      protocol_version: 2
      battery_voltage: 2.749
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0211C90003119B117611BC119E118A119411A811A81194006401990ABD"
    expected:
      device_id: 4553
      protocol_version: 2
      distance_average: 4507
      distance_minimum: 4470
      distance_maximum: 4540
      distance_median: 4510
      distance_10th_percentile: 4490
      distance_25th_percentile: 4500
      distance_75th_percentile: 4520
      distance_90th_percentile: 4520
      distance_most_frequent_value: 4500
      number_of_samples: 100
      total_acquisition_time: 399.414062
      battery_voltage: 2.749
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    source: vendor-codec
    payload: "0212340003000000000000000000000000000000000000000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      distance_average: 0
      distance_minimum: 0
      distance_maximum: 0
      distance_median: 0
      distance_10th_percentile: 0
      distance_25th_percentile: 0
      distance_75th_percentile: 0
      distance_90th_percentile: 0
      distance_most_frequent_value: 0
      number_of_samples: 0
      total_acquisition_time: 0.0
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    source: vendor-codec
    payload: "0212340003800080008000800080008000800080008000800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      distance_average: 32768
      distance_minimum: 32768
      distance_maximum: 32768
      distance_median: 32768
      distance_10th_percentile: 32768
      distance_25th_percentile: 32768
      distance_75th_percentile: 32768
      distance_90th_percentile: 32768
      distance_most_frequent_value: 32768
      number_of_samples: 32768
      total_acquisition_time: 32000.0
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    source: vendor-codec
    payload: "0212340003FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      distance_average: 65535
      distance_minimum: 65535
      distance_maximum: 65535
      distance_median: 65535
      distance_10th_percentile: 65535
      distance_25th_percentile: 65535
      distance_75th_percentile: 65535
      distance_90th_percentile: 65535
      distance_most_frequent_value: 65535
      number_of_samples: 65535
      total_acquisition_time: 63999.023438
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    source: vendor-codec
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
