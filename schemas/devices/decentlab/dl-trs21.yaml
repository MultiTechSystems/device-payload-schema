# https://www.decentlab.com/products/soil-water-potential-and-temperature-sensor-for-lorawan
name: decentlab_dl_trs21
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: water_potential
              type: u16
              transform:
                - div: -10
              unit: "kPa"
            - name: soil_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02019200020C25"
    expected:
      device_id: 402
      protocol_version: 2
      battery_voltage: 3.109
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0201920003007580A10C25"
    expected:
      device_id: 402
      protocol_version: 2
      water_potential: -11.7
      soil_temperature: 16.1
      battery_voltage: 3.109
