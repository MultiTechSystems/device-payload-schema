# https://www.decentlab.com/products/soil-moisture-temperature-and-electrical-conductivity-sensor-for-lorawan
name: decentlab_dl_trs11
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # x[0] feeds two outputs, so it is read once into an internal field and
            # both derive from it. A field per output would have consumed a word
            # each, leaving soil_temperature to read past the end of the payload.
            - name: _raw
              type: u16
            - name: _scaled
              type: number
              ref: $_raw
              transform:
                - div: 10
            # The vendor squares a cubic in _scaled. The square is a `compute`
            # rather than a `pow` transform stage because pow exists only in the
            # Python interpreter; multiplying the value by itself decodes
            # identically in all of them.
            - name: _permittivity_root
              type: number
              ref: $_scaled
              polynomial: [0.000000002887, -0.0000208, 0.05276, -43.39]
            - name: dielectric_permittivity
              type: number
              compute:
                op: mul
                a: $_permittivity_root
                b: $_permittivity_root
            - name: volumetric_water_content
              type: number
              ref: $_scaled
              transform:
                - mult: 0.0003879
                - add: -0.6956
              unit: "m³⋅m⁻³"
            - name: soil_temperature
              type: u16
              transform:
                - div: 10
                - add: -3276.8
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "0210D50003463F810B0C79"
    expected:
      device_id: 4309
      protocol_version: 2
      dielectric_permittivity: 1.0259018697121183
      volumetric_water_content: 0.0019605699999999393
      soil_temperature: 26.7
      battery_voltage: 3.193
