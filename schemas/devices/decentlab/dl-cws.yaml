# https://www.decentlab.com/products/high-precision-winter-road-maintenance-sensor-for-lorawan
name: decentlab_dl_cws
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: surface_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: air_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: air_humidity
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "%"
            - name: dew_point
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: angle
              type: u16
              transform:
                - add: -32768
              unit: "°"
              senml: {unit: deg}
            - name: sensor_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02463900020B74"
    expected:
      device_id: 17977
      protocol_version: 2
      battery_voltage: 2.932
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02463900038A778A95977A874C80478A5E0B74"
    expected:
      device_id: 17977
      protocol_version: 2
      surface_temperature: 26.79
      air_temperature: 27.09
      air_humidity: 60.1
      dew_point: 18.68
      angle: 71
      sensor_temperature: 26.54
      battery_voltage: 2.932
