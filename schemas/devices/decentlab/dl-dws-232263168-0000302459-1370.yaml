# https://www.decentlab.com/products/weighing-scale-for-lorawan
name: decentlab_dl_dws_232263168_0000302459_1370
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # Both outputs derive from the ratio of two words, and the group is
            # three words wide even though the vendor reads only the first two, so
            # the third is consumed explicitly to keep the next group aligned.
            - name: _counter
              type: u16
            - name: _interval
              type: u16
            - name: _reserved_w2
              type: u16
            - name: frequency
              type: number
              compute:
                op: div
                a: $_counter
                b: $_interval
              transform:
                - mult: 32768
              unit: "Hz"
            # The vendor squares the frequency. A `compute` multiplication rather
            # than a `pow` transform stage, because pow exists only in the Python
            # interpreter and this must decode the same in all of them.
            - name: _frequency_squared
              type: number
              compute:
                op: mul
                a: $frequency
                b: $frequency
            - name: weight
              type: number
              ref: $_frequency_squared
              transform:
                - add: -232263168
                - mult: 0.000302459
                - add: 1370
              unit: "g"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
