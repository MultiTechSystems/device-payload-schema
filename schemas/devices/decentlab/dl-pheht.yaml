# https://www.decentlab.com/products/ph-orp-and-temperature-sensor-for-lorawan
name: decentlab_dl_pheht
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: status
              type: u16
            - name: temperature
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature", unit: "Cel"}
              semantic: "temperature"
            - name: ph
              type: u16
              transform:
                - add: -32768
                - div: 100
            - name: redox
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "mV"
            - name: ph_mv
              type: u16
              transform:
                - add: -32768
                - div: 10
              unit: "mV"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0252B800020C5C"
    expected:
      device_id: 21176
      protocol_version: 2
      battery_voltage: 3.164
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    payload: "0252B800030000884282C77F637FF60C5C"
    expected:
      device_id: 21176
      protocol_version: 2
      status: 0
      temperature: 21.14
      ph: 7.11
      redox: -15.7
      ph_mv: -1.0
      battery_voltage: 3.164
  - name: zero_words
    description: "All sensor words zero (offset-binary minimum, negative readings)"
    payload: "0212340003000000000000000000000000"
    expected:
      device_id: 4660
      protocol_version: 2
      status: 0
      temperature: -327.68
      ph: -327.68
      redox: -3276.8
      ph_mv: -3276.8
      battery_voltage: 0.0
  - name: midscale_words
    description: "All sensor words at offset-binary midpoint (zero readings)"
    payload: "0212340003800080008000800080008000"
    expected:
      device_id: 4660
      protocol_version: 2
      status: 32768
      temperature: 0.0
      ph: 0.0
      redox: 0.0
      ph_mv: 0.0
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    payload: "0212340003FFFFFFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      status: 65535
      temperature: 327.67
      ph: 327.67
      redox: 3276.7
      ph_mv: 3276.7
      battery_voltage: 65.535
  - name: min_payload_battery_only
    description: "Minimum payload: only the last sensor group present"
    payload: "02123400020BF5"
    expected:
      device_id: 4660
      protocol_version: 2
      battery_voltage: 3.061
