# https://www.decentlab.com/products/co2-temperature-humidity-and-barometric-pressure-sensor-for-lorawan
name: decentlab_dl_lp8p
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: air_temperature
              type: u16
              transform:
                - mult: 0.0026812744140625
                - add: -46.85
              unit: "°C"
              senml: {unit: Cel}
            - name: air_humidity
              type: u16
              transform:
                - mult: 0.0019073486328125
                - add: -6
              unit: "%"
              senml: {unit: "/100"}
        - bit: 1
          fields:
            - name: barometer_temperature
              type: u16
              transform:
                - div: 100
                - add: -50
              unit: "°C"
              senml: {unit: Cel}
            - name: barometric_pressure
              type: u16
              mult: 2
              unit: "Pa"
        - bit: 2
          fields:
            - name: co2_concentration
              type: u16
              add: -32768
              unit: "ppm"
            - name: co2_concentration_lpf
              type: u16
              add: -32768
              unit: "ppm"
            - name: co2_sensor_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
              senml: {unit: Cel}
            - name: capacitor_voltage_1
              type: u16
              div: 1000
              unit: "V"
            - name: capacitor_voltage_2
              type: u16
              div: 1000
              unit: "V"
            - name: co2_sensor_status
              type: u16
            - name: raw_ir_reading
              type: u16
            - name: raw_ir_reading_lpf
              type: u16
        - bit: 3
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "02057800080C25"
    expected:
      device_id: 1400
      protocol_version: 2
      battery_voltage: 3.109
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "020578000B67BD618D1CEDBD100C25"
    expected:
      device_id: 1400
      protocol_version: 2
      air_temperature: 24.35660461425781
      air_humidity: 41.63221740722656
      barometer_temperature: 24.05
      barometric_pressure: 96800
      battery_voltage: 3.109
