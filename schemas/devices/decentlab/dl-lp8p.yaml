# https://www.decentlab.com/products/co2-temperature-humidity-and-barometric-pressure-sensor-for-lorawan
name: decentlab_dl_lp8p
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: air_temperature
              type: u16
              transform:
                - mult: 0.0026812744140625
                - add: -46.85
              unit: "°C"
            - name: air_humidity
              type: u16
              transform:
                - mult: 0.0019073486328125
                - add: -6
              unit: "%"
        - bit: 1
          fields:
            - name: barometer_temperature
              type: u16
              transform:
                - div: 100
                - add: -50
              unit: "°C"
            - name: barometric_pressure
              type: u16
              mult: 2
              unit: "Pa"
        - bit: 2
          fields:
            - name: co2_concentration
              type: u16
              add: -32768
              unit: "ppm"
            - name: co2_concentration_lpf
              type: u16
              add: -32768
              unit: "ppm"
            - name: co2_sensor_temperature
              type: u16
              transform:
                - div: 100
                - add: -327.68
              unit: "°C"
            - name: capacitor_voltage_1
              type: u16
              div: 1000
              unit: "V"
            - name: capacitor_voltage_2
              type: u16
              div: 1000
              unit: "V"
            - name: co2_sensor_status
              type: u16
            - name: raw_ir_reading
              type: u16
            - name: raw_ir_reading_lpf
              type: u16
        - bit: 3
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
