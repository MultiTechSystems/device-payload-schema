              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature_at_level_4", unit: "Cel"}
              semantic: "temperature.at.level.4"
            - name: temperature_at_level_5
              type: u16
