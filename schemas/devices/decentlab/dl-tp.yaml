# https://www.decentlab.com/products/temperature-profile-for-lorawan
name: decentlab_dl_tp
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: temperature_at_level_0
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature_at_level_0", unit: "Cel"}
              semantic: "temperature.at.level.0"
            - name: temperature_at_level_1
              type: u16
              transform:
                - add: -32768
                - div: 100
              unit: "°C"
              ipso: {object: 3303, instance: 0, resource: 5700}
              senml: {name: "temperature_at_level_1", unit: "Cel"}
              semantic: "temperature.at.level.1"
            - name: temperature_at_level_2
              type: u16
              transform:
