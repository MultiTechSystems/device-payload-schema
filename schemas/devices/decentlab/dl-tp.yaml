      temperature_at_level_3: 0.0
      temperature_at_level_4: 0.0
      temperature_at_level_5: 0.0
      temperature_at_level_6: 0.0
      temperature_at_level_7: 0.0
      temperature_at_level_8: 0.0
      temperature_at_level_9: 0.0
      temperature_at_level_10: 0.0
      temperature_at_level_11: 0.0
      temperature_at_level_12: 0.0
      temperature_at_level_13: 0.0
      temperature_at_level_14: 0.0
      temperature_at_level_15: 0.0
      battery_voltage: 32.768
  - name: max_words
    description: "All sensor words 0xFFFF (maximum readings)"
    source: vendor-codec
    payload: "0212340003FFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFFF"
    expected:
      device_id: 4660
      protocol_version: 2
      temperature_at_level_0: 327.67
