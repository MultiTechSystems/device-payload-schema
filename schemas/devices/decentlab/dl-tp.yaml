              senml: {name: "temperature_at_level_15", unit: "Cel"}
              semantic: "temperature.at.level.15"
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"

              ipso: {object: 3316, instance: 0, resource: 5700}
              senml: {name: "battery_voltage", unit: "V"}
              semantic: "battery.voltage"
test_vectors:
  - name: min_payload_vendor_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "023E3E00020AFC"
    expected:
      device_id: 15934
      protocol_version: 2
      battery_voltage: 2.812
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "023E3E00038ABC8A928AA08A848AB38A898AC38AAD8AB78A928AA1000000000000000000000AFC"
    expected:
      device_id: 15934
      protocol_version: 2
      temperature_at_level_0: 27.48
      temperature_at_level_1: 27.06
      temperature_at_level_2: 27.2
      temperature_at_level_3: 26.92
      temperature_at_level_4: 27.39
      temperature_at_level_5: 26.97
      temperature_at_level_6: 27.55
      temperature_at_level_7: 27.33
      temperature_at_level_8: 27.43
      temperature_at_level_9: 27.06
      temperature_at_level_10: 27.21
      temperature_at_level_11: -327.68
