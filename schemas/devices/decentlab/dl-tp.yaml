      temperature_at_level_7: -327.68
      temperature_at_level_8: -327.68
      temperature_at_level_9: -327.68
      temperature_at_level_10: -327.68
      temperature_at_level_11: -327.68
      temperature_at_level_12: -327.68
      temperature_at_level_13: -327.68
      temperature_at_level_14: -327.68
      temperature_at_level_15: -327.68
      battery_voltage: 0.0
