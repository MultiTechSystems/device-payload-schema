# https://www.decentlab.com/products/winter-road-maintenance-sensor-for-lorawan
name: decentlab_dl_wrm
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: air_temperature
              type: u16
              transform:
                - mult: 0.002670328831921874
                - add: -45
              unit: "°C"
            - name: air_humidity
              type: u16
              transform:
                - mult: 0.0015259021896696424
                - add: -2.220446049250313e-16
              unit: "%"
        - bit: 1
          fields:
            - name: surface_temperature
              type: u16
              transform:
                - div: 10
                - add: -100
              unit: "°C"
            - name: head_temperature
              type: u16
              transform:
                - div: 10
                - add: -100
              unit: "°C"
        - bit: 2
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
