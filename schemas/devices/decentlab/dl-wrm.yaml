# https://www.decentlab.com/products/winter-road-maintenance-sensor-for-lorawan
name: decentlab_dl_wrm
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            - name: air_temperature
              type: u16
              transform:
                - mult: 0.002670328831921874
                - add: -45
              unit: "°C"
              senml: {unit: Cel}
            - name: air_humidity
              type: u16
              transform:
                - mult: 0.0015259021896696424
                - add: -2.220446049250313e-16
              unit: "%"
              senml: {unit: "%RH"}
        - bit: 1
          fields:
            - name: surface_temperature
              type: u16
              transform:
                - div: 10
                - add: -100
              unit: "°C"
              senml: {unit: Cel}
            - name: head_temperature
              type: u16
              transform:
                - div: 10
                - add: -100
              unit: "°C"
              senml: {unit: Cel}
        - bit: 2
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "021A1000040C60"
    expected:
      device_id: 6672
      protocol_version: 2
      battery_voltage: 3.168
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "021A10000764A079B104F904C40C60"
    expected:
      device_id: 6672
      protocol_version: 2
      air_temperature: 23.787670710307466
      air_humidity: 47.536430914778364
      surface_temperature: 27.3
      head_temperature: 22.0
      battery_voltage: 3.168
