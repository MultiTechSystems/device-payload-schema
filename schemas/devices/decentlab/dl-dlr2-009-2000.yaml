# https://www.decentlab.com/products/analog-or-digital-sensor-device-for-lorawan
name: decentlab_dl_dlr2_009_2000
version: 2
endian: big

fields:
  - name: protocol_version
    type: u8
  - name: device_id
    type: u16
  - name: flags
    type: u16

  - flagged:
      field: flags
      groups:
        - bit: 0
          fields:
            # Both outputs come from one ratio built out of two words, low word
            # first, so the four bytes are not a big-endian u32 and are read as two.
            - name: _ratio
              type: u32le16
              transform:
                - div: 8388608
                - add: -1
            # resistance = ratio * 2000 / (1 - ratio). The denominator is a compute
            # against a literal, so this needs no new language feature.
            - name: _one_minus_ratio
              type: number
              compute:
                op: sub
                a: 1
                b: $_ratio
            - name: _ratio_scaled
              type: number
              ref: $_ratio
              transform:
                - mult: 2000
            - name: thermistor_resistance
              type: number
              compute:
                op: div
                a: $_ratio_scaled
                b: $_one_minus_ratio
              unit: "Ω"
              senml: {unit: Ohm}
            # temperature is a quadratic in that resistance, so `polynomial` states
            # it directly: 0.0000104876 R^2 + 0.23469 R - 245.18.
            - name: temperature
              type: number
              ref: $thermistor_resistance
              polynomial: [0.0000104876, 0.23469, -245.18]
              unit: "°C"
              senml: {unit: Cel}
        - bit: 1
          fields:
            - name: battery_voltage
              type: u16
              div: 1000
              unit: "V"
test_vectors:
  - name: vendor_reference_1
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "024C6200020AE1"
    expected:
      device_id: 19554
      protocol_version: 2
      battery_voltage: 2.785
  - name: vendor_reference_2
    description: "Vendor-published test payload, decoded by the vendor's own decoder"
    source: vendor-codec
    payload: "024C620003573400AD0AE1"
    expected:
      device_id: 19554
      protocol_version: 2
      thermistor_resistance: 1097.0478279778865
      temperature: 24.908127512458456
      battery_voltage: 2.785
