# RAKwireless Qingping Air Quality Sensor (Modbus RTU frame)
name: rakwireless_qingping
version: 1
endian: big

fields:
  - name: device_address
    type: u8
  - name: function_code
    type: u8
  - name: data_length
    type: u8
  - name: data_type
    type: u8
  - name: timestamp
    type: u32
  # Two 12-bit values packed across three bytes, per the vendor decoder:
  #   temperature = ((b0 * 16) + (b1 >> 4) - 500) / 10   -> bits 12-23
  #   humidity    = (256 * (b1 & 0x0F) + b2) / 10        -> bits 0-11
  # Temperature is 12 bits, not the 20 that a previous `u24[4:23]` claimed, and
  # neither raw value had a consumer, so this schema reported no temperature or
  # humidity at all.
  - byte_group:
      size: 3
      fields:
        - name: _temp_raw
          type: u24[12:23]
        - name: _humi_raw
          type: u24[0:11]
  # valid_range comes from the QingPing LoRaWAN CO2 Sensor datasheet, "Sensor
  # Characteristics". Note the same datasheet's "Features" section gives narrower
  # figures - CO2 400-5000, temperature -10 to 50, humidity 0-95 - so it disagrees
  # with itself. The wider sensor figures are used here, because a plausibility
  # bound that fires on a legitimate reading is worse than one that is loose.
  # The datasheet documents no payload format, so it says nothing about the bit
  # layout below; it bounds the values only.
  - name: temperature
    type: number
    ref: $_temp_raw
    transform:
      - add: -500
      - div: 10
    unit: "°C"
    valid_range: [-20, 50]
    ipso: 3303
    senml: {unit: "Cel"}
    semantic: "temperature.ambient"
  - name: humidity
    type: number
    ref: $_humi_raw
    transform:
      - div: 10
    unit: "%"
    valid_range: [0, 99.9]
    ipso: 3304
    senml: {unit: "%RH"}
    semantic: "humidity.relative"
  - name: co2
    type: u16
    unit: "ppm"
    valid_range: [400, 9999]
    ipso: 3325
    semantic: "gas.co2"
  - name: battery
    type: u8
    unit: "%"
    valid_range: [0, 100]

test_vectors:
  # Expected values produced by the vendor's own decoder, decoder-qingping.js in
  # the TTN device repository, run over this payload. Note the published decoder
  # declares `function Decoder(bytes, port)` and then reads `data[...]`, so it
  # throws as shipped; it was run with that one identifier corrected and is
  # otherwise untouched.
  - name: realtime_data
    description: "Real-time frame: function code 0x41, data type 0x01"
    payload: "01 41 0E 01 6541A0B0 2DF1C4 0320 57"
    source: vendor-codec
    expected:
      device_address: 1
      timestamp: 1698799792
      temperature: 23.5
      humidity: 45.2
      co2: 800
      battery: 87
