name: utility_meter__reset_all_counters
description: Composed from schemas/library/commands/utility_meter.yaml#/definitions/reset_counter_req
  so the library's test vectors run in every implementation.
endian: big
fields: &id001
- name: category
  type: u8
  value: 1
- name: cid
  type: u8
  value: 1
- name: register_id
  type: u8
  description: Register to reset (0xFF=all resettable)
definitions:
  set_tariff_req:
    name: SetTariffReq
    cid: 0
    direction: downlink
    description: Set active tariff for meter
    fields:
    - name: category
      type: u8
      value: 1
    - name: cid
      type: u8
      value: 0
    - name: tariff_id
      type: u8
      description: Tariff identifier (0-255)
  set_tariff_ans:
    name: SetTariffAns
    cid: 0
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 1
    - name: cid
      type: u8
      value: 0
    - name: status
      type: u8
      description: 0=success, 1=invalid tariff
  reset_counter_req:
    name: ResetCounterReq
    cid: 1
    direction: downlink
    description: Reset meter counter/register
    fields: *id001
  reset_counter_ans:
    name: ResetCounterAns
    cid: 1
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 1
    - name: cid
      type: u8
      value: 1
    - name: status
      type: u8
      description: 0=success, 1=invalid register, 2=not resettable
  set_ct_ratio_req:
    name: SetCTRatioReq
    cid: 2
    direction: downlink
    description: Set current transformer ratio for power meter
    fields:
    - name: category
      type: u8
      value: 1
    - name: cid
      type: u8
      value: 2
    - name: ct_ratio
      type: u16
      description: CT ratio (e.g., 100 for 100:1)
      valid_range:
      - 1
      - 10000
  set_ct_ratio_ans:
    name: SetCTRatioAns
    cid: 2
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 1
    - name: cid
      type: u8
      value: 2
    - name: status
      type: u8
      description: 0=success, 1=invalid ratio
test_vectors:
- name: reset_all_counters
  payload: 01 01 FF
  source: spec-example
  expected:
    category: 1
    cid: 1
    register_id: 255
