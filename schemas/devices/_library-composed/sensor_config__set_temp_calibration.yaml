name: sensor_config__set_temp_calibration
description: Composed from schemas/library/commands/sensor_config.yaml#/definitions/set_calibration_req
  so the library's test vectors run in every implementation.
endian: big
fields: &id001
- name: category
  type: u8
  value: 16
- name: cid
  type: u8
  value: 2
- name: field_id
  type: u8
  description: Field identifier
- name: offset
  type: s16
  description: Calibration offset (in field units)
definitions:
  set_interval_req:
    name: SetIntervalReq
    cid: 0
    direction: downlink
    description: Set sensor reporting interval
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 0
    - name: interval_seconds
      type: u16
      description: Reporting interval in seconds (0=default)
      valid_range:
      - 0
      - 65535
  set_interval_ans:
    name: SetIntervalAns
    cid: 0
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 0
    - name: status
      type: u8
      description: 0=success, 1=invalid, 2=out of range
    - name: current_interval
      type: u16
      description: Currently active interval in seconds
  read_now_req:
    name: ReadNowReq
    cid: 1
    direction: downlink
    description: Request immediate sensor reading
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 1
    - name: field_mask
      type: u8
      description: Bitmask of fields to read (0xFF=all)
  read_now_ans:
    name: ReadNowAns
    cid: 1
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 1
    - name: sensor_data
      type: bytes
      description: Sensor data (format per device schema)
  set_calibration_req:
    name: SetCalibrationReq
    cid: 2
    direction: downlink
    description: Set calibration offset for a sensor field
    fields: *id001
  set_calibration_ans:
    name: SetCalibrationAns
    cid: 2
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 2
    - name: status
      type: u8
      description: 0=success, 1=invalid field, 2=invalid offset
  set_enable_req:
    name: SetEnableReq
    cid: 3
    direction: downlink
    description: Enable or disable sensor fields
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 3
    - name: field_bitmask
      type: u16
      description: Bitmask of fields to enable (1=enable, 0=disable)
  set_enable_ans:
    name: SetEnableAns
    cid: 3
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 3
    - name: status
      type: u8
      description: 0=success, 1=invalid mask
  set_profile_req:
    name: SetProfileReq
    cid: 4
    direction: downlink
    description: Switch sensor operating profile
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 4
    - name: profile_id
      type: u8
      description: Profile identifier (device-specific)
  set_profile_ans:
    name: SetProfileAns
    cid: 4
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 4
    - name: status
      type: u8
      description: 0=success, 1=invalid profile
    - name: active_profile
      type: u8
      description: Currently active profile ID
  get_config_req:
    name: GetConfigReq
    cid: 5
    direction: downlink
    description: Query current sensor configuration
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 5
  get_config_ans:
    name: GetConfigAns
    cid: 5
    direction: uplink
    fields:
    - name: category
      type: u8
      value: 16
    - name: cid
      type: u8
      value: 5
    - name: interval
      type: u16
      description: Current reporting interval (seconds)
    - name: active_profile
      type: u8
      description: Active profile ID
    - name: enabled_fields
      type: u16
      description: Bitmask of enabled fields
test_vectors:
- name: set_temp_calibration
  payload: 10 02 01 FFEC
  source: spec-example
  expected:
    category: 16
    cid: 2
    field_id: 1
    offset: -20
