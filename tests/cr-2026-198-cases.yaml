# CR-2026-198 (PS-621 to PS-623 amended, PS-639, PS-640): a packed repeat may pack records of
# several fields, each declaring `packed_bits`, an element being the fields' bits in order
# (PS-639); its `bit_offset` is any bit count from 0, or a `$` reference to a field decoded
# before it (PS-621); and with `consume: 0` it reads its bits in place, so the fields after
# it read the same bytes (PS-640). An encoder writes a record's fields in order, each checked
# against its own `packed_bits`, takes a referenced offset from the input and rejects a
# repeat whose offset is not there (computed), and with `consume: 0` leaves its bits for the
# following fields to write over (PS-623).
#
# The cases are the spec prototype's TestCR2026198PackedRecords (TE Connectivity's peaks,
# Terabee's two runs in one block, people-flow's computed offset, and four load
# rejections), plus an offset from a field the input gives, an offset past the first byte,
# a record part that does not fit, a field reading the bytes an in-place repeat read, and
# PS-539 for an offset naming nothing. They are read by the reference and the generated
# codec (tests/test_cr_2026_198_cases.py), Go (go/schema/cr198_test.go), Java
# (CR2026198Test.java) and C# (CR2026_198Tests.cs). C has no repeat;
# tools/schema_binary.py refuses `packed_bits` and `bit_offset` by name (PS-446).
#
#   decode: `schema` (YAML text), `payload` (hex) and `expected` (JSON text, the whole data).
#   cases:  `schema`, `input` (JSON text) and either `payload` (hex) or `error`.
#   load:   `schema` and `error`, the prototype's text.

decode:

- name: te_connectivity_peaks
  schema: "name: t\nversion: 1\nfields:\n  - {name: PeakNb, type: u8}\n  - {name: peaksList, type: repeat, count: $PeakNb, fields: [{name: Freq, type: u16, packed_bits: 11}, {name: Mag, type: u8, packed_bits: 8}]}\n"
  payload: "027d1900141c"
  expected: '{"PeakNb": 2, "peaksList": [{"Freq": 1000, "Mag": 200}, {"Freq": 5, "Mag": 7}]}'

- name: terabee_two_runs_in_one_block
  schema: "name: t\nversion: 1\nfields:\n  - {name: type, type: 'u48[44:47]'}\n  - {name: zone_id, type: 'u48[41:43]'}\n  - {name: point_1, type: repeat, count: 2, packed_bits: 10, bit_offset: 7, consume: 0, element: {type: u16}}\n  - {name: point_2, type: repeat, count: 2, packed_bits: 10, bit_offset: 27, consume: 0, element: {type: u16}}\n  - {type: skip, length: 6}\n"
  payload: "3a2807800804"
  expected: '{"type": 3, "zone_id": 5, "point_1": [80, 60], "point_2": [1, 2]}'

- name: a_computed_offset_decodes
  schema: "name: t\nversion: 1\nfields:\n  - {name: _bits, type: number, source: $remaining, mult: 8}\n  - {name: _pad, type: number, compute: {op: mod, a: $_bits, b: 13}}\n  - {name: _n, type: number, compute: {op: idiv, a: $_bits, b: 13}}\n  - {name: points, type: repeat, count: $_n, bit_offset: $_pad, fields: [{name: x, type: u8, packed_bits: 7}, {name: y, type: u8, packed_bits: 6}]}\n"
  payload: "50f00840c4"
  expected: '{"points": [{"x": 80, "y": 60}, {"x": 1, "y": 2}, {"x": 3, "y": 4}]}'

- name: an_offset_from_a_field
  schema: "name: t\nversion: 1\nfields:\n  - {name: lead, type: u8}\n  - {name: v, type: repeat, count: 2, bit_offset: $lead, fields: [{name: a, type: u8, packed_bits: 4}, {name: b, type: u8, packed_bits: 4}]}\n"
  payload: "03024680"
  expected: '{"lead": 3, "v": [{"a": 1, "b": 2}, {"a": 3, "b": 4}]}'

- name: an_offset_past_the_first_byte
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 6, bit_offset: 12, element: {type: s8}}\n"
  payload: "000fc5"
  expected: '{"v": [-1, 5]}'

- name: a_field_after_reads_the_same_bytes
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 4, consume: 0, element: {type: u8}}\n  - {name: w, type: u8}\n"
  payload: "12"
  expected: '{"v": [1, 2], "w": 18}'

cases:

- name: te_connectivity_peaks
  schema: "name: t\nversion: 1\nfields:\n  - {name: PeakNb, type: u8}\n  - {name: peaksList, type: repeat, count: $PeakNb, fields: [{name: Freq, type: u16, packed_bits: 11}, {name: Mag, type: u8, packed_bits: 8}]}\n"
  input: '{"PeakNb": 2, "peaksList": [{"Freq": 1000, "Mag": 200}, {"Freq": 5, "Mag": 7}]}'
  payload: "027d1900141c"

- name: terabee_two_runs_in_one_block
  schema: "name: t\nversion: 1\nfields:\n  - {name: type, type: 'u48[44:47]'}\n  - {name: zone_id, type: 'u48[41:43]'}\n  - {name: point_1, type: repeat, count: 2, packed_bits: 10, bit_offset: 7, consume: 0, element: {type: u16}}\n  - {name: point_2, type: repeat, count: 2, packed_bits: 10, bit_offset: 27, consume: 0, element: {type: u16}}\n  - {type: skip, length: 6}\n"
  input: '{"type": 3, "zone_id": 5, "point_1": [80, 60], "point_2": [1, 2]}'
  payload: "3a2807800804"

- name: a_computed_offset_is_not_encoded
  schema: "name: t\nversion: 1\nfields:\n  - {name: _bits, type: number, source: $remaining, mult: 8}\n  - {name: _pad, type: number, compute: {op: mod, a: $_bits, b: 13}}\n  - {name: _n, type: number, compute: {op: idiv, a: $_bits, b: 13}}\n  - {name: points, type: repeat, count: $_n, bit_offset: $_pad, fields: [{name: x, type: u8, packed_bits: 7}, {name: y, type: u8, packed_bits: 6}]}\n"
  input: '{"points": [{"x": 80, "y": 60}, {"x": 1, "y": 2}, {"x": 3, "y": 4}]}'
  error: "Repeat 'points': its bit_offset $_pad is not in the input; a repeat whose offset is computed decodes but is not encoded (PS-623)"

- name: an_offset_from_a_field
  schema: "name: t\nversion: 1\nfields:\n  - {name: lead, type: u8}\n  - {name: v, type: repeat, count: 2, bit_offset: $lead, fields: [{name: a, type: u8, packed_bits: 4}, {name: b, type: u8, packed_bits: 4}]}\n"
  input: '{"lead": 3, "v": [{"a": 1, "b": 2}, {"a": 3, "b": 4}]}'
  payload: "03024680"

- name: an_offset_past_the_first_byte
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 6, bit_offset: 12, element: {type: s8}}\n"
  input: '{"v": [-1, 5]}'
  payload: "000fc5"

- name: a_record_part_that_does_not_fit
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 1, fields: [{name: a, type: u8, packed_bits: 4}, {name: b, type: u8, packed_bits: 3}]}\n"
  input: '{"v": [{"a": 1, "b": 8}]}'
  error: "Repeat 'v': element 0 is 8, which does not fit in 3 bits (PS-623)"

- name: a_field_after_writes_over_the_same_bytes
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 4, consume: 0, element: {type: u8}}\n  - {name: w, type: u8}\n"
  input: '{"v": [1, 2], "w": 18}'
  payload: "12"

load:

- name: packed_bits_on_the_repeat_and_its_fields
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 1, packed_bits: 4, fields: [{name: a, type: u8, packed_bits: 4}]}\n"
  error: "Repeat 'v': a packed record declares packed_bits on each field, not on the repeat (PS-639)"

- name: a_field_without_packed_bits
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 1, fields: [{name: a, type: u8, packed_bits: 4}, {name: b, type: u8}]}\n"
  error: "Repeat 'v': every field of a packed record declares packed_bits (PS-639)"

- name: a_part_wider_than_its_type
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 1, fields: [{name: a, type: u8, packed_bits: 9}]}\n"
  error: "Repeat 'v': a packed part is an integer type at least 9 bits wide (PS-621, PS-639)"

- name: consume_other_than_zero
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 1, packed_bits: 4, consume: 1, element: {type: u8}}\n"
  error: "Repeat 'v': a packed repeat declares consume: 0 or no consume (PS-640)"

- name: a_negative_offset
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 4, bit_offset: -1, element: {type: u8}}\n"
  error: "Repeat 'v': bit_offset is a bit count, 0 or more, or a $ reference (PS-621)"

- name: an_offset_that_is_text
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 4, bit_offset: four, element: {type: u8}}\n"
  error: "Repeat 'v': bit_offset is a bit count, 0 or more, or a $ reference (PS-621)"

- name: an_offset_naming_nothing
  schema: "name: t\nversion: 1\nfields:\n  - {name: v, type: repeat, count: 2, packed_bits: 4, bit_offset: $nowhere, element: {type: u8}}\n"
  error: "`$nowhere` (bit_offset) names no field, var, tag component, index or count_as the schema declares (PS-539)"
