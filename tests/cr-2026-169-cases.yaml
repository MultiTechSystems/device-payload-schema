# CR-2026-169 (0.5.7, PS-581): which port entry an encoder uses.
#
# A caller's FPort chooses the entry, or the `default` entry where none lists it, and an
# entry declared `uplink` is refused only where a downlink is being encoded. Without an
# FPort: the one entry declaring `downlink`; else the one downlink-capable entry
# (`downlink`, `both` or no declaration, PS-287); else the input is rejected naming the
# candidates. A `default` entry is never chosen without an FPort. A schema with no `ports`
# reports the caller's FPort, else the document's `fPort` (PS-458).
#
# One case list, read by the reference and the generated codec (tests/test_cr_2026_169_cases.py),
# Go (go/schema/cr169_test.go), Java (CR2026169Test.java) and C# (CR2026_169Tests.cs). C has
# no `ports`, so it does not apply.
#
# `schema` is YAML text, `input` JSON text. `fport` is the FPort the caller gives (none when
# absent). `direction` is downlink unless it says `none` (an uplink encoded for a round trip;
# the generated codec's encodeDownlink is always a downlink, so it skips those). A case has
# `payload` (hex) and `used` (the FPort reported), or `error` (text the rejection contains).
# The prototype's TestCR2026169EncodePort, case for case.

cases:

- name: the_declared_downlink_entry_without_an_fport
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: temperature, type: s16}]}\n  2: {direction: downlink, fields: [{name: interval, type: u16}]}\n  3: {direction: both, fields: [{name: status, type: u8}]}\n"
  input: '{"interval": 300}'
  payload: "012c"
  used: 2

- name: a_given_fport_chooses_its_entry
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: temperature, type: s16}]}\n  2: {direction: downlink, fields: [{name: interval, type: u16}]}\n  3: {direction: both, fields: [{name: status, type: u8}]}\n"
  input: '{"status": 7}'
  fport: 3
  payload: "07"
  used: 3

- name: an_uplink_entry_takes_no_downlink
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: temperature, type: s16}]}\n  2: {direction: downlink, fields: [{name: interval, type: u16}]}\n"
  input: '{"temperature": 5}'
  fport: 1
  error: "FPort 1 is declared direction:uplink and takes no downlink to encode (PS-581)"

- name: an_uplink_still_encodes_for_a_round_trip
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: temperature, type: s16}]}\n  2: {direction: downlink, fields: [{name: interval, type: u16}]}\n"
  input: '{"temperature": 5}'
  fport: 1
  direction: none
  payload: "0005"
  used: 1

- name: the_one_downlink_capable_entry
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: a, type: u8}]}\n  5: {fields: [{name: b, type: u8}]}\n"
  input: '{"b": 9}'
  payload: "09"
  used: 5

- name: a_both_entry_is_downlink_capable
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: a, type: u8}]}\n  7: {direction: both, fields: [{name: b, type: u8}]}\n"
  input: '{"b": 9}'
  payload: "09"
  used: 7

- name: several_candidates_are_rejected_naming_them
  schema: "name: t\nports:\n  4: {fields: [{name: a, type: u8}]}\n  5: {fields: [{name: b, type: u8}]}\n"
  input: '{"b": 9}'
  error: "has 2 downlink-capable port entries (4, 5); give the FPort (PS-581)"

- name: several_declared_downlink_entries_are_rejected
  schema: "name: t\nports:\n  4: {direction: downlink, fields: [{name: a, type: u8}]}\n  5: {direction: downlink, fields: [{name: b, type: u8}]}\n  6: {direction: both, fields: [{name: c, type: u8}]}\n"
  input: '{"b": 9}'
  error: "has 2 declared downlink port entries (4, 5); give the FPort (PS-581)"

- name: no_entry_takes_a_downlink
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: a, type: u8}]}\n  2: {direction: uplink, fields: [{name: b, type: u8}]}\n"
  input: '{"b": 9}'
  error: "has no port entry that takes a downlink (PS-581)"

- name: a_default_entry_is_never_chosen_without_an_fport
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: a, type: u8}]}\n  default: {fields: [{name: b, type: u8}]}\n"
  input: '{"b": 9}'
  error: "PS-581"

- name: a_default_entry_takes_an_unlisted_fport
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: a, type: u8}]}\n  default: {fields: [{name: b, type: u8}]}\n"
  input: '{"b": 9}'
  fport: 40
  payload: "09"
  used: 40

- name: an_unlisted_fport_without_a_default_is_rejected
  schema: "name: t\nports:\n  1: {direction: uplink, fields: [{name: a, type: u8}]}\n  2: {direction: downlink, fields: [{name: b, type: u8}]}\n"
  input: '{"b": 1}'
  fport: 99
  error: "FPort 99 matches no port entry and schema 't' declares no default; it defines 1, 2 (PS-581)"

# The worked example's command port: a looked-up command byte, then a match on it (PS-523:
# the match reads the code the lookup wrote, not the label).
- name: a_command_selected_by_its_label
  schema: "name: t\nendian: big\nports:\n  10:\n    direction: downlink\n    fields:\n      - {name: command, type: u8, lookup: {0: set_interval, 4: set_sampling}}\n      - match:\n          field: $command\n          cases:\n            0: [{name: interval, type: u16}]\n            4: [{name: sample_interval, type: u16}, {name: per_uplink, type: u8}]\n"
  input: '{"command": "set_sampling", "sample_interval": 600, "per_uplink": 6}'
  payload: "04025806"
  used: 10

- name: a_flat_schema_reports_the_document_fport
  schema: "name: t\nfPort: 225\nfields:\n  - {name: a, type: u8}\n"
  input: '{"a": 1}'
  payload: "01"
  used: 225

- name: a_flat_schema_reports_the_callers_fport
  schema: "name: t\nfPort: 225\nfields:\n  - {name: a, type: u8}\n"
  input: '{"a": 1}'
  fport: 225
  payload: "01"
  used: 225
