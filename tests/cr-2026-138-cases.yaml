# CR-2026-138 (PS-553): a field has a name; padding is a skip.
#
# One case list, read by the reference (tests/test_cr_2026_138_field_names.py, which also
# runs the validator and the TS013 generator over it), Go (go/schema/cr138_test.go), Java
# (CR2026138Test.java) and C# (CR2026_138Tests.cs), so all four loaders refuse the same
# schemas with the same text. A rejected schema cannot be a corpus vector, which is why
# this is here rather than in schemas/devices.
#
# Each case gives `schema` (YAML text) and either `error` - the whole message the load
# reports, which is the spec prototype's check_field_names text - or `payload` (hex) and
# `expected` (JSON text): the schema loads, decodes the payload to exactly that object and
# re-encodes it to the payload.

cases:

# --- Rejected, naming the field by its 1-based position ------------------------------

- name: top_level
  schema: |
    name: t
    fields:
      - {type: u8}
      - {name: b, type: u8}
  error: "Schema 't': field 1, a u8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: between_two_named_fields
  schema: |
    name: t
    fields:
      - {name: a, type: u8}
      - {type: u16}
      - {name: b, type: u8}
  error: "Schema 't': field 2, a u16, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: with_modifiers
  schema: |
    name: t
    fields:
      - {name: a, type: u8}
      - {type: u8, mult: 2}
  error: "Schema 't': field 2, a u8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_an_object
  schema: |
    name: t
    fields:
      - name: o
        type: object
        fields:
          - {name: a, type: u8}
          - {type: u16}
  error: "Schema 't', in 'o': field 2, a u16, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_a_repeat_trailer
  schema: |
    name: t
    fields:
      - name: r
        type: repeat
        until: end
        reserve: 1
        fields: [{name: v, type: u8}]
        trailer: [{type: u8}]
  error: "Schema 't', in 'r': field 1, a u8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_a_match_case
  schema: |
    name: t
    fields:
      - {name: k, type: u8}
      - match:
          field: $k
          cases:
            1: [{type: u8}]
  error: "Schema 't': field 1, a u8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_a_match_default
  schema: |
    name: t
    fields:
      - {name: k, type: u8}
      - match:
          field: $k
          cases:
            1: [{name: a, type: u8}]
          default: [{name: b, type: u8}, {type: s8}]
  error: "Schema 't': field 2, a s8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_a_flagged_group
  schema: |
    name: t
    fields:
      - {name: flags, type: u8}
      - flagged:
          field: flags
          groups:
            - {bit: 0, fields: [{name: a, type: u8}, {type: u8}]}
  error: "Schema 't': field 2, a u8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_a_tlv_case
  schema: |
    name: t
    fields:
      - tlv:
          tag_size: 1
          cases:
            1: [{type: u16}]
  error: "Schema 't': field 1, a u16, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: in_a_port
  schema: |
    name: t
    ports:
      2:
        fields:
          - {name: a, type: u8}
          - {type: s16}
  error: "Schema 't', port 2: field 2, a s16, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

- name: through_a_definition
  schema: |
    name: t
    definitions:
      pair:
        fields: [{name: a, type: u8}, {type: u8}]
    fields:
      - $ref: '#/definitions/pair'
  error: "Schema 't': field 2, a u8, has no name; a field that reads or reports a value is named, and padding is a `skip` (PS-553)"

# --- Exempt: these load, decode and re-encode -----------------------------------------

- name: a_skip_is_nameless
  schema: |
    name: t
    fields:
      - {name: a, type: u8}
      - {type: skip, length: 2}
      - {name: b, type: u8}
  payload: "01000002"
  expected: '{"a": 1, "b": 2}'

- name: a_byte_group_member_may_be_unnamed
  schema: |
    name: t
    fields:
      - byte_group:
          size: 1
          fields:
            - {name: a, type: "u8[0:3]"}
            - {type: "u8[4:7]"}
  payload: "01"
  expected: '{"a": 1}'

- name: a_repeat_element_is_nameless
  schema: |
    name: t
    fields:
      - {name: v, type: repeat, count: 2, element: {type: u8}}
  payload: "0506"
  expected: '{"v": [5, 6]}'

- name: constructs_need_no_name
  schema: |
    name: t
    fields:
      - {name: k, type: u8}
      - match:
          field: $k
          cases:
            1:
              - {name: flags, type: u8}
              - flagged:
                  field: flags
                  groups:
                    - {bit: 0, fields: [{name: a, type: u8}]}
      - tlv:
          tag_size: 1
          cases:
            9: [{name: c, type: u8}]
  payload: "0101070903"
  expected: '{"k": 1, "flags": 1, "a": 7, "c": 3}'
